<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAEXE · Planejamento Estratégico (online)</title>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#1F3A5F; --navy-d:#162a45; --accent:#2E8BC0; --gold:#E6A817;
  --bg:#f4f6f9; --card:#fff; --line:#e4e8ee; --text:#22303f; --muted:#6b7a8d;
  --green:#2e9e6b; --red:#d9534f; --amber:#e6a817;
  --radius:12px; --shadow:0 1px 3px rgba(20,40,70,.08),0 4px 16px rgba(20,40,70,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.hidden{display:none!important}
a{color:var(--accent)}
code{background:#eef2f7;padding:1px 6px;border-radius:5px;font-size:.85em}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-d)}
.btn-accent{background:var(--accent);color:#fff}
.btn-light{background:#eef2f7;color:var(--navy)}.btn-light:hover{background:#e2e9f1}
.btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover{color:var(--navy)}
.btn-danger{background:#fbeaea;color:var(--red)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-block{width:100%;justify-content:center;margin-top:10px}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--accent))}
.login-card{background:#fff;border-radius:18px;padding:38px 34px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-brand{text-align:center;margin-bottom:22px}
.login-brand h1{color:var(--navy);font-size:28px;letter-spacing:2px;margin-top:10px}
.login-brand p{color:var(--muted);font-size:13px}
.logo-badge{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto}
.logo-badge.sm{width:38px;height:38px;font-size:15px;border-radius:10px}
#login-form label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
#login-form input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px}
#login-form input:focus{outline:none;border-color:var(--accent)}
.login-error{color:var(--red);font-size:13px;margin-top:10px;text-align:center}
.login-hint{margin-top:22px;padding:14px;background:#f4f6f9;border-radius:10px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7}
.link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline;margin-top:10px;width:100%}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#cdd8e6;display:flex;flex-direction:column;position:fixed;height:100vh}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand strong{color:#fff;display:block;font-size:16px;letter-spacing:1px}
.sidebar-brand span{font-size:11px;color:#8fa3bd}
#nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6f86a3;margin:16px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:8px;cursor:pointer;color:#cdd8e6;font-size:13.5px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .ico{width:18px;text-align:center}
.sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.user-chip{font-size:12.5px}.user-chip strong{color:#fff;display:block}
.user-chip span{color:#8fa3bd;font-size:11px}
.content{flex:1;margin-left:248px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h2{font-size:19px;color:var(--navy)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.role-badge{background:#eef2f7;color:var(--navy);padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700}
.view{padding:26px 28px;max-width:1180px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.stat .label{font-size:12px;color:var(--muted);font-weight:600}
.stat .value{font-size:28px;font-weight:800;color:var(--navy);margin-top:4px}
.stat .sub{font-size:11.5px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:20px}
.card h3{color:var(--navy);font-size:16px;margin-bottom:4px}
.card .desc{color:var(--muted);font-size:13px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}.sidebar{width:64px}.content{margin-left:64px}.sidebar-brand span,.sidebar-brand strong,.nav-item span:not(.ico),.nav-section,.user-chip{display:none}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#f7f9fc;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafbfd}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-head h3{color:var(--navy);font-size:17px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill-green{background:#e3f3ec;color:var(--green)}.pill-amber{background:#fcf3da;color:#b9860f}
.pill-red{background:#fbeaea;color:var(--red)}.pill-blue{background:#e6f1f8;color:var(--accent)}.pill-gray{background:#eef2f7;color:var(--muted)}
.swot-Força{border-left:4px solid var(--green)}
.swot-Fraqueza{border-left:4px solid var(--red)}
.swot-Oportunidade{border-left:4px solid var(--accent)}
.swot-Ameaça{border-left:4px solid var(--gold)}
.progress{background:#eef2f7;border-radius:20px;height:8px;overflow:hidden;min-width:90px}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:20px}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,30,45,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:14px;width:560px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{color:var(--navy)}
.modal-x{background:none;border:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.bsc-row{display:grid;grid-template-columns:210px 1fr;gap:14px;margin-bottom:14px;align-items:stretch}
.bsc-persp{color:#fff;border-radius:10px;padding:14px;font-weight:700;font-size:14px;display:flex;align-items:center}
.bsc-objs{display:flex;flex-wrap:wrap;gap:10px}
.bsc-obj{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;flex:1;min-width:200px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
.bsc-obj b{color:var(--navy);font-size:13.5px}
.bsc-obj ul{margin:8px 0 0 16px;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:90;font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
.philo-box{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;border-radius:14px;padding:26px;margin-bottom:20px}
.philo-box h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.8}
.philo-box p{font-size:17px;margin-top:6px;font-weight:500}
.value-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.value-item{background:#fff;border-radius:10px;padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--gold)}
.value-item b{color:var(--navy)}.value-item p{color:var(--muted);font-size:12.5px;margin-top:4px}
.inline-actions{display:flex;gap:6px;flex-wrap:wrap}
.gut-num{font-weight:800;color:var(--navy)}
.dept-card{border-left:4px solid var(--accent)}
.dept-sub{margin-top:14px}
.dept-sub h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;flex-direction:column;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin:0 6px 6px 0;font-size:12.5px}
.chip b{color:var(--navy)}.chip span{color:var(--muted);font-size:11px}
.chip-row{display:flex;flex-wrap:wrap}
.wk-input{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.wk-input:focus{outline:none;border-color:var(--accent)}
.color-dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:middle}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:42px!important}
.pass-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:var(--muted);padding:4px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#cdd8e6;display:inline-block;vertical-align:middle}
.avatar.lg{width:96px;height:96px}
.avatar-fallback{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;font-weight:800}
.q-group{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.q-head{background:var(--navy);color:#fff;padding:10px 14px;font-weight:700;font-size:13.5px}
.m-head{background:#eef2f7;color:var(--navy);padding:7px 14px;font-weight:700;font-size:12.5px}
.toggle-group{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle-group button{border:none;background:#fff;padding:7px 14px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.toggle-group button.active{background:var(--accent);color:#fff}
.wk-card{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.wk-card:hover{border-color:var(--accent);background:#fafbfd}
.wk-card .wk-meta{font-size:12px;color:var(--muted)}
.tag-ok{color:var(--green);font-weight:700}.tag-no{color:var(--red);font-weight:700}
.owner-chip{display:inline-block;background:#e6f1f8;color:var(--accent);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;margin:0 4px 4px 0}
.check-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.check-list label{display:flex;align-items:center;gap:8px;padding:6px;font-weight:500;cursor:pointer}
.check-list input{width:auto}
.goal-select{width:100%;font-size:14px}
.goal-full{font-weight:600;color:var(--navy);margin-top:10px;font-size:14.5px;line-height:1.4}
.ms-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line)}
.ms-row input[type=checkbox]{width:auto}
.ms-row.done label{text-decoration:line-through;color:var(--muted)}
.ms-row label{flex:1;cursor:pointer}
.ms-add{display:flex;gap:8px;margin-top:10px}
.ms-add input{flex:1}
.sidebar{transition:transform .2s ease}
.content{transition:margin-left .2s ease}
body.nav-collapsed .sidebar{transform:translateX(-100%)}
body.nav-collapsed .content{margin-left:0}
.topbar-left{display:flex;align-items:center;gap:12px}
#nav-toggle{font-size:16px;line-height:1;padding:7px 11px}
/* Organograma */
.org-chart{padding:10px 0;text-align:center;overflow-x:auto}
.org-node{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 16px;display:inline-block}
.org-company{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;border:none;min-width:240px}
.org-company b{font-size:16px}.org-company span{display:block;font-size:11.5px;opacity:.85}
.org-trunk{width:2px;height:22px;background:var(--line);margin:0 auto}
.org-cols{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:22px}
.org-branch{position:relative}
.org-branch::before{content:'';position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--line)}
.org-dept{border-top:4px solid var(--accent);min-width:210px;max-width:250px;text-align:left;vertical-align:top}
.org-dept b{color:var(--navy);font-size:14px}.org-dept>span{display:block;color:var(--muted);font-size:11.5px;margin-bottom:8px}
.org-people{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.org-person{background:#f7f9fc;border-radius:7px;padding:6px 9px}
.org-person b{color:var(--navy);font-size:12.5px}.org-person span{color:var(--muted);font-size:11px;display:block}
.org-procs{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.org-proc{background:#eef2f7;color:var(--navy);border-radius:6px;padding:2px 7px;font-size:10.5px}
.org-tree{list-style:none;margin:6px 0 0;padding-left:18px;border-left:2px solid var(--line)}
.org-tree li{margin:6px 0}
.org-person2{display:inline-block;background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:6px 10px;border-left:3px solid var(--accent)}
.org-person2 b{color:var(--navy);font-size:12.5px} .org-person2 span{display:block;color:var(--muted);font-size:11px}
.org-imgwrap{text-align:center;padding:10px} .org-imgwrap img{max-width:100%;border:1px solid var(--line);border-radius:10px}
.stk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stk-q{border:1px solid var(--line);border-radius:10px;padding:12px;min-height:130px}
.stk-q h4{margin:0;color:var(--navy);font-size:13.5px} .stk-q .sub{color:var(--muted);font-size:11px;margin:2px 0 8px}
.stk-chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 9px;font-size:11.5px;margin:0 4px 4px 0}
.stk-q.q-key{background:#eaf6ef;border-color:var(--green)}
.stk-q.q-sat{background:#eaf1f8;border-color:var(--accent)}
.stk-q.q-inf{background:#fcf6e6;border-color:var(--gold)}
.stk-q.q-mon{background:#f7f9fc}
.bmc-wrap{overflow-x:auto}
.bmc{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;min-width:860px}
.bmc-block{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;font-size:11.5px}
.bmc-block h5{margin:0 0 5px;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);padding-bottom:3px}
.bmc-block ul{margin:0;padding-left:15px} .bmc-block li{margin:3px 0;line-height:1.35}
.bmc-block.bmc-pp{background:#eaf1f8;border-color:var(--accent)}
.diag-q{padding:9px 0;border-bottom:1px solid var(--line)}
.diag-ql{font-weight:500;margin-bottom:6px;font-size:13.5px}
.diag-q .scale{display:flex;gap:6px;flex-wrap:wrap}
.diag-q .opt{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 0;min-width:38px;cursor:pointer;font-weight:600;color:var(--navy)}
.diag-q .opt:hover{border-color:var(--accent)} .diag-q .opt input{margin-bottom:2px}
.wk-grid{min-width:520px}
.wk-grid th,.wk-grid td{text-align:center;white-space:nowrap}
.wk-grid th:first-child,.wk-grid td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.wk-grid thead th{cursor:default}
.wk-grid thead th.wk-col{cursor:pointer;color:var(--accent)}
.wk-grid thead th.wk-col:hover{text-decoration:underline}
.wk-grid .wk-total{background:#f7f9fc;font-weight:700}
.ind-key{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
.ind-group{background:#eef2f7;padding:10px 16px;font-size:13px;color:var(--muted)}
.ind-group b{color:var(--navy)} .ind-group span{color:var(--muted);margin:0 2px}
.ind-table{width:100%;border-collapse:collapse;font-size:12px}
.ind-table th{background:#fff;text-align:center;padding:7px 6px;font-size:11px;color:var(--muted)}
.ind-table td{text-align:center;padding:5px 6px;border-bottom:1px solid var(--line)}
.ind-table .ind-name{text-align:left;min-width:220px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--navy);font-weight:500}
.ind-cell{display:inline-block;width:24px;height:16px;border-radius:3px}
.tut-flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tut-step{background:#f7f9fc;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;cursor:pointer}
.tut-step:hover{border-color:var(--accent)}
.tut-step b{display:block;color:var(--navy);font-size:13.5px}.tut-step span{font-size:12px;color:var(--muted)}
.tut-item{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;scroll-margin-top:80px}
.tut-item summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
.tut-item summary::-webkit-details-marker{display:none}
.tut-item summary b{color:var(--navy);font-size:14.5px}
.tut-item summary::after{content:'▸';margin-left:auto;color:var(--muted);transition:.15s}
.tut-item[open] summary::after{transform:rotate(90deg)}
.tut-who{font-size:11.5px;color:var(--muted);background:#eef2f7;border-radius:20px;padding:2px 10px}
.tut-body{padding:0 16px 14px 42px;font-size:13.5px}
.tut-body h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 4px}
.tut-body ol,.tut-body ul{margin:0 0 10px 18px}.tut-body li{margin-bottom:4px}
.help-btn{font-weight:700}
.sector-chip{min-width:230px;max-width:360px}
.sec-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}
.sec-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin-right:2px}
.staff-chip{display:inline-block;background:#f1f3f6;color:var(--text);border-radius:20px;padding:2px 9px;font-size:11.5px;margin:0 4px 4px 0}
.legacy-chip{background:#fff7e6;color:#8a6d1f}
.org-secs{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.org-sec{background:#f7f9fc;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:6px 9px;font-size:11.5px}
.org-sec b{display:block;color:var(--navy);font-size:12px}.org-sec span{display:block;color:var(--muted)}

<script>

const SUPABASE_URL = 'https://qgkelrlftxqpoyspxmsf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFna2VscmxmdHhxcG95c3B4bXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjczNTUsImV4cCI6MjA5NTkwMzM1NX0.dvEPOWwBLbrJJdYtXnhfjTsWvH4MxCDj3mxq9Yit7B0';
const APP_URL = 'https://sisplanoestrategico.organiza.workers.dev/';
let sb = null; // criado no bootstrap, quando a biblioteca Supabase terminar de carregar

/* ---------- helpers de banco ---------- */
async function tList(table, order, asc=true){
  let q = sb.from(table).select('*');
  if (order) q = q.order(order, { ascending: asc });
  const { data, error } = await q;
  if (error) throw error;
  return data || [];
}
async function tInsert(table, row){ const { data, error } = await sb.from(table).insert(row).select(); if(error) throw error; return data; }
async function tUpdate(table, id, row){ const { error } = await sb.from(table).update(row).eq('id', id); if(error) throw error; }
async function tDelete(table, id){ const { error } = await sb.from(table).delete().eq('id', id); if(error) throw error; }

/* ====== RELATÓRIO TRIMESTRAL DE METAS (Word + PowerPoint no modelo Daexe) ====== */
const RelMetas = (() => {
  const NAVY='1C4587', GOLD='B8923F', GOLD_L='DAB868', TXT='33415C';
  const ST = { A:['Atingida','1E7B3C','E3F2E6'], P:['Parcial','9A6B00','FFF3D6'], N:['Não atingida','B3261E','FBE4E2'], S:['Sem dados','5F6368','ECEDEF'] };
  const ORD = ['1º','2º','3º','4º'];
  const MESC = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const xe = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const nf = (n, d=0) => (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d});
  const dm = (d) => ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
  const cut = (s, n) => { s=String(s||'').replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n-1).replace(/\s+\S*$/,'')+'…' : s; };
  const lines = (t) => String(t||'').split('\n').map(x=>x.trim().replace(/^[-•*]\s+/,'')).filter(Boolean);

  function weeksOfYear(year){
    const weeks=[]; let d=new Date(year,0,1);
    const dow=d.getDay(); d.setDate(d.getDate()+(dow===0?1:(dow===1?0:8-dow)));
    let w=1;
    while(d.getFullYear()<=year && w<=53){ const s=new Date(d), e=new Date(d); e.setDate(e.getDate()+6); if(s.getFullYear()>year) break; weeks.push({week:w,start:s,end:e}); d.setDate(d.getDate()+7); w++; }
    return weeks;
  }
  function fmtU(n, unit){
    const v=Number(n)||0;
    if(unit==='R$') return 'R$ '+nf(v, Math.abs(v)<1000?2:0);
    if(unit==='%') return nf(v,1)+'%';
    if(!unit) return nf(v,1);
    return nf(v,1)+' '+unit;
  }
  const STOP = new Set(['e','de','do','da','dos','das','a','o','os','as','em','&']);
  function deptCode(name){
    const ws=String(name||'').trim().split(/[\s,\/-]+/).filter(w=>w && !STOP.has(w.toLowerCase()));
    let c=ws.map(w=>w[0]).join('').toUpperCase();
    if(c.length<3 && ws[0]) c=ws[0].slice(0,3).toUpperCase();
    return c.slice(0,4)||'—';
  }

  /* ---------- 1. Cálculo a partir dos dados do sistema ---------- */
  function compute(D, year, quarter, today){
    today = today || new Date();
    const qMonths=[3*(quarter-1), 3*(quarter-1)+1, 3*(quarter-1)+2];
    const qWeeks=weeksOfYear(year).filter(w=>qMonths.includes(w.start.getMonth()));
    const closed=qWeeks.filter(w=>w.end < new Date(today.getFullYear(),today.getMonth(),today.getDate()));
    const closedSet=new Set(closed.map(w=>w.week));
    const partial = closed.length < qWeeks.length;
    const lastClosed = closed.length ? closed[closed.length-1].week : 0;
    const profName=(id)=>{ const p=D.profiles.find(x=>x.id===id); return p?p.name:'?'; };
    const persp=D.persp.slice().sort((a,b)=>(a.ord||0)-(b.ord||0));
    const objOf=(id)=>D.objs.find(o=>o.id===id)||{};
    const perspOrd=(pid)=>{ const i=persp.findIndex(p=>p.id===pid); return i<0?99:i; };
    const deptsById={}; D.depts.forEach(d=>deptsById[d.id]=d);
    const goals=D.goals.filter(g=>g.year===year && g.quarter===quarter).sort((a,b)=>{
      const oa=objOf(a.objective_id), ob=objOf(b.objective_id);
      return perspOrd(oa.perspective_id)-perspOrd(ob.perspective_id) || (oa.ord||0)-(ob.ord||0) || a.id-b.id; });
    const goalIds=new Set(goals.map(g=>g.id));
    const gDepts=(gid)=>D.goalDepts.filter(x=>x.goal_id===gid).map(x=>deptsById[x.department_id]).filter(Boolean);
    const hasVal=(e)=>(Number(e.meta)||0)!==0 || (Number(e.realizado)||0)!==0;
    const hasTxt=(e)=>!!((e.causa||'').trim()||(e.acao||'').trim()||(e.note||'').trim());
    const flags=[], flagPS=[], flagF=[];

    const rows=goals.map(g=>{
      const o=objOf(g.objective_id); const p=persp.find(x=>x.id===o.perspective_id)||{name:'Sem perspectiva',id:0};
      const ds=gDepts(g.id);
      let dlist=ds.length?ds:(o.department_id&&deptsById[o.department_id]?[deptsById[o.department_id]]:[]);
      const all=D.weekly.filter(w=>w.goal_id===g.id && w.year===year);
      const ents=all.filter(w=>closedSet.has(w.week));
      const agg={}; ents.forEach(e=>{ if(!hasVal(e)) return; const x=(agg[e.week]=agg[e.week]||{m:0,r:0}); x.m+=Number(e.meta)||0; x.r+=Number(e.realizado)||0; });
      const vals=Object.values(agg); const ct=g.calc_type||'soma';
      const sm=vals.reduce((a,b)=>a+b.m,0), sr=vals.reduce((a,b)=>a+b.r,0);
      const m= ct==='media'&&vals.length ? sm/vals.length : sm, r= ct==='media'&&vals.length ? sr/vals.length : sr;
      const pct = m ? Math.round(r/m*100) : null;
      let st='S'; if(vals.length && m){ st = pct>=100?'A':(pct>=70?'P':'N'); }
      let res = !vals.length ? 'Sem lançamentos' : (m ? `${fmtU(r,g.unit)} de ${fmtU(m,g.unit)} (${nf(pct)}%)` : `${fmtU(r,g.unit)} (sem meta lançada)`);
      if(vals.length && ct==='media') res += ' · média semanal';
      const txt=ents.filter(hasTxt).sort((a,b)=>b.week-a.week);
      const seen=new Set(); const parts=[];
      txt.forEach(e=>{ const c=(e.causa||'').trim(), a=(e.acao||'').trim(), n=(e.note||'').trim();
        const s=[c&&('Causa: '+c), a&&('Ação: '+a), (!c&&!a&&n)?n:''].filter(Boolean).join(' · ');
        const k=s.toLowerCase(); if(s && !seen.has(k) && parts.length<2){ seen.add(k); parts.push(`S${e.week}: ${s}`); } });
      let com = parts.length ? cut(parts.join(' | '), 260) : (vals.length ? 'Sem comentários de causa/ação no período.' : 'Nenhum lançamento no trimestre.');
      // pontos de atenção automáticos
      const short=cut(g.smart_text,70);
      if(g.unit==='%' && ct==='soma' && vals.length>1) flagPS.push(short);
      const rs=ents.filter(e=>Number(e.realizado)>0).map(e=>Number(e.realizado)).sort((a,b)=>a-b);
      if(rs.length>=3){ const med=rs[Math.floor(rs.length/2)]; ents.forEach(e=>{ if(Number(e.realizado)>med*10 && med>0) flags.push(`**Valor fora de escala:** ${fmtU(e.realizado,g.unit)} na sem. ${e.week} (${profName(e.profile_id)}) em "${short}" — cerca de ${nf(Number(e.realizado)/med)}× a mediana das semanas.`); }); }
      ents.forEach(e=>{ const mm=Number(e.meta)||0, rr=Number(e.realizado)||0; if(mm>0 && rr>mm*20 && rr>1000) flags.push(`**Meta e resultado em escalas diferentes:** sem. ${e.week} de "${short}" tem meta ${fmtU(mm,g.unit)} e resultado ${fmtU(rr,g.unit)} (${profName(e.profile_id)}).`); });
      const byP={}; ents.filter(hasVal).sort((a,b)=>a.week-b.week).forEach(e=>{ const k=e.profile_id||'-'; const prev=byP[k]; if(prev && prev.week===e.week-1 && Number(prev.realizado)===Number(e.realizado) && Number(e.realizado)>0 && g.unit==='R$') flags.push(`**Valor repetido:** ${fmtU(e.realizado,g.unit)} nas sem. ${prev.week} e ${e.week} em "${short}" (${profName(e.profile_id)}). Confirme se não é cópia.`); byP[k]=e; });
      const futW=new Set(weeksOfYear(year).filter(x=>x.start>today).map(x=>x.week));
      const fut=all.filter(w=>futW.has(w.week) && Number(w.realizado)!==0);
      if(fut.length) flagF.push(`"${cut(g.smart_text,45)}" (sem. ${[...new Set(fut.map(f=>f.week))].join(', ')})`);
      return { gid:g.id, persp:p.name, perspId:p.id, dept: dlist.map(d=>deptCode(d.name)).join('/')||'—', deptIds:dlist.map(d=>d.id), meta:g.smart_text||'', unit:g.unit||'', res, st, com, pct, n:vals.length };
    });

    if(flagPS.length) flags.unshift(`**Metas em % com fórmula "Soma" (${flagPS.length}):** o sistema soma os percentuais semanais (ex.: "${flagPS[0]}"). Para metas em %, o ideal é a fórmula "Média".`);
    if(flagF.length) flags.push(`**Lançamentos em semanas futuras (${flagF.length} meta(s)):** ${flagF.slice(0,3).join('; ')}${flagF.length>3?'…':'.'} Eles não entram neste relatório.`);
    // departamentos
    const deptList=D.depts.slice().sort((a,b)=>(a.ord||0)-(b.ord||0)).filter(d=>rows.some(r=>r.deptIds.includes(d.id)))
      .map(d=>({id:d.id, name:String(d.name||'').trim(), code:deptCode(d.name)}));
    if(rows.some(r=>!r.deptIds.length)) deptList.push({id:0,name:'Sem departamento',code:'—'});

    // preenchimento
    const asg=D.assignees.filter(a=>goalIds.has(a.goal_id));
    const people=[...new Set(asg.map(a=>a.profile_id))];
    const fill=people.map(pid=>{
      const p=D.profiles.find(x=>x.id===pid)||{name:'?'}; const gids=asg.filter(a=>a.profile_id===pid).map(a=>a.goal_id);
      const ents=D.weekly.filter(w=>w.profile_id===pid && w.year===year && closedSet.has(w.week) && gids.includes(w.goal_id));
      const filled=new Set(ents.filter(e=>hasVal(e)||hasTxt(e)).map(e=>e.goal_id+'_'+e.week)).size;
      const poss=gids.length*closed.length; const ad=poss?Math.round(filled/poss*100):0;
      const just=ents.filter(e=>(e.causa||'').trim()||(e.acao||'').trim()).length;
      const empty=gids.filter(g=>!ents.some(e=>e.goal_id===g && (hasVal(e)||hasTxt(e))));
      const dep=p.department_id&&deptsById[p.department_id]?deptCode(deptsById[p.department_id].name):'—';
      let obs = empty.length ? `Sem lançamentos em ${empty.length} meta(s): ${empty.slice(0,2).map(g=>'“'+cut((goals.find(x=>x.id===g)||{}).smart_text,45)+'”').join('; ')}${empty.length>2?'…':''}` : (ad>=70?'Preenchimento regular.':'Preenchimento irregular ao longo das semanas.');
      return { name:p.name||'?', dep, nm:gids.length, ad, just, obs };
    }).sort((a,b)=>b.ad-a.ad);
    const noEntry=rows.filter(r=>r.n===0 && !D.weekly.some(w=>w.goal_id===r.gid && w.year===year && closedSet.has(w.week) && hasTxt(w)));
    const avgAd = fill.length ? Math.round(fill.reduce((a,b)=>a+b.ad,0)/fill.length) : 0;

    // reportes por departamento (causas e ações)
    const rep={};
    deptList.forEach(d=>{
      const gids=rows.filter(r=>d.id?r.deptIds.includes(d.id):!r.deptIds.length).map(r=>r.gid);
      const ents=D.weekly.filter(w=>gids.includes(w.goal_id) && w.year===year && closedSet.has(w.week) && ((w.causa||'').trim()||(w.acao||'').trim())).sort((a,b)=>b.week-a.week);
      const seen=new Set(); const out=[];
      ents.forEach(e=>{ if(out.length>=4) return; const k=((e.causa||'')+'|'+(e.acao||'')).trim().toLowerCase(); if(seen.has(k)) return; seen.add(k);
        const g=goals.find(x=>x.id===e.goal_id)||{};
        out.push(`**${cut(g.smart_text,50)} (sem. ${e.week}):** ${cut([e.causa&&e.causa.trim(), e.acao&&('Ação: '+e.acao.trim())].filter(Boolean).join('. '),180)}`); });
      rep[d.code]= out.join('\n');
    });

    // iniciativas
    const qStart=qWeeks.length?qWeeks[0].start:new Date(year,qMonths[0],1), qEnd=qWeeks.length?qWeeks[qWeeks.length-1].end:new Date(year,qMonths[2]+1,0);
    const inis=D.inis.slice().sort((a,b)=>(a.ord||0)-(b.ord||0)).map(i=>{
      const owners=(D.iniAssignees||[]).filter(a=>a.initiative_id===i.id).map(a=>profName(a.profile_id)).filter(n=>n!=='?');
      const acts=(D.iniActions||[]).filter(a=>a.initiative_id===i.id && a.when_date && new Date(a.when_date+'T12:00')>=qStart && new Date(a.when_date+'T12:00')<=qEnd);
      const late = i.date_end && new Date(i.date_end+'T23:59') < today && i.status!=='Concluído';
      return { name:i.name||'', who: owners.join(', ')||i.who||'—', st:i.status||'Não iniciado', pr:(i.progress||0)+'%', late, acts:acts.map(a=>`${a.what} (${a.status||'—'})`) };
    });
    const actsQ=inis.reduce((a,b)=>a+b.acts.length,0);
    const lateN=inis.filter(i=>i.late).length;
    const iniNote = inis.length ? `${inis.length} iniciativa(s) cadastradas: ${inis.filter(i=>i.st==='Concluído').length} concluída(s), ${inis.filter(i=>i.st==='Em andamento').length} em andamento${lateN?`, ${lateN} com prazo vencido`:''}. No trimestre foram registradas ${actsQ} ação(ões) com prazo no período nos planos 3Q1C.` : 'Nenhuma iniciativa cadastrada.';

    // textos automáticos
    const cnt=countSt(rows);
    const top=rows.filter(r=>r.st==='A').sort((a,b)=>(b.pct||0)-(a.pct||0)).slice(0,4);
    const low=rows.filter(r=>r.st==='N').sort((a,b)=>(a.pct||0)-(b.pct||0)).slice(0,4);
    const pos=top.map(r=>`**${r.dept} — ${cut(r.meta,70)}:** ${r.res}.`);
    const neg=low.map(r=>`**${r.dept} — ${cut(r.meta,70)}:** ${r.res}.`);
    if(cnt.S) neg.push(`**${cnt.S} meta(s) sem dados suficientes** para avaliação.`);
    if(!pos.length) pos.push('Nenhuma meta atingiu 100% no período.');
    const rec=[];
    if(cnt.N) rec.push(`**Metas não atingidas (${cnt.N}):** revisar causa raiz e plano de ação na reunião de fechamento, com responsável e prazo.`);
    if(cnt.S || noEntry.length) rec.push(`**Metas sem dados:** garantir o lançamento semanal (meta e resultado) de todas as metas atribuídas.`);
    if(fill.some(f=>f.ad<50)) rec.push(`**Cadência de preenchimento:** lembrete semanal e acompanhamento de quem ficou abaixo de 50% de adesão (${fill.filter(f=>f.ad<50).map(f=>f.name.split(' ')[0]).join(', ')}).`);
    if(flags.length) rec.push(`**Qualidade dos dados:** corrigir os lançamentos apontados em "Pontos de atenção" antes de apresentar o fechamento.`);
    if(lateN) rec.push(`**Iniciativas:** reprogramar os prazos das ${lateN} iniciativa(s) vencida(s) e ligar cada uma às metas que ela sustenta.`);
    rec.push(`**Próximo trimestre:** revisar as metas do T${quarter===4?1:quarter+1} à luz destes resultados antes de cadastrá-las no sistema.`);
    const w0=qWeeks[0], w1=closed[closed.length-1]||qWeeks[qWeeks.length-1];
    const periodTxt = qWeeks.length ? `semanas ${w0.week} a ${w1.week} (${dm(w0.start)} a ${dm(w1.end)})` : '';

  async function buildPptx(M, templateBuf){
    const zip=await JSZip.loadAsync(templateBuf);
    const {S, recXml}=buildSlides(M);
    const P='ppt/slides/';
    const rd=(f)=>zip.file(f).async('string');
    const inject=(xml,body,keepPic)=>{ const gs=xml.indexOf('</p:grpSpPr>')+'</p:grpSpPr>'.length; let extra=''; if(keepPic){ const m=xml.match(/<p:pic>[\s\S]*?<\/p:pic>/); if(m) extra=m[0]; } return xml.slice(0,gs)+body+extra+xml.slice(xml.indexOf('</p:spTree>')); };
    // slide 2 — título
    let s2=await rd(P+'slide2.xml');
    s2=s2.replace('TÍTULO DA APRESENTAÇÃO', xe(`RESULTADOS DE METAS · T${M.quarter} ${M.year}`)).replace('Caso precise de um texto de apoio, coloque aqui embaixo', xe(`Fechamento do ${ORD[M.quarter-1]} trimestre${M.partial?' (prévia)':''}`));
    s2=s2.replace(/<p:sp><p:nvSpPr><p:cNvPr id="113"[\s\S]*?<\/p:sp>/,'');
    zip.file(P+'slide2.xml',s2);
    // slide 4 — recomendações
    zip.file(P+'slide4.xml', inject(await rd(P+'slide4.xml'), recXml, true));
    // slides de conteúdo a partir do slide 3
    const base3=await rd(P+'slide3.xml');
    const rels3=(await rd(P+'_rels/slide3.xml.rels')).replace(/<Relationship Id="rId2"[^>]*notesSlide[^>]*\/>/,'');
    zip.file(P+'slide3.xml', inject(base3,S[0]));
    let ct=await rd('[Content_Types].xml'), pres=await rd('ppt/presentation.xml'), prels=await rd('ppt/_rels/presentation.xml.rels');
    const newIds=[];
    for(let k=1;k<S.length;k++){ const n=4+k; // slide5.xml, slide6.xml…
      zip.file(`${P}slide${n}.xml`, inject(base3,S[k]));
      zip.file(`${P}_rels/slide${n}.xml.rels`, rels3);
      ct=ct.replace('</Types>',`<Override PartName="/ppt/slides/slide${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/></Types>`);
      const rid='rIdR'+n; prels=prels.replace('</Relationships>',`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${n}.xml"/></Relationships>`);
      newIds.push(`<p:sldId id="${300+k}" r:id="${rid}"/>`); }
    // ordem: capa, título, resumo(slide3), novos…, recomendações(slide4)
    pres=pres.replace(/(<p:sldId id="\d+" r:id="rId4"\/>)/, '$1'+newIds.join(''));
    zip.file('[Content_Types].xml',ct); zip.file('ppt/presentation.xml',pres); zip.file('ppt/_rels/presentation.xml.rels',prels);
    const app=zip.file('docProps/app.xml'); if(app){ let a=await app.async('string'); a=a.replace(/<Slides>\d+<\/Slides>/,`<Slides>${S.length+3}</Slides>`); zip.file('docProps/app.xml',a); }
    return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation', compression:'DEFLATE'});
  }
  return { compute, buildDocx, buildPptx, countSt, ST, deptCode, weeksOfYear };
})();

    const topGut=swot.map(s=>({item:s.item,gut:s.gravidade*s.urgencia*s.tendencia,classification:s.classification})).sort((a,b)=>b.gut-a.gut).slice(0,5);

    const dyear = new Date().getFullYear();

    const dCalcType = (goals.find(g=>g.id===dashGoal)||{}).calc_type||'soma';
    const dwAgg={}; weekly.filter(w=>w.goal_id===dashGoal && w.year===dyear).forEach(w=>{ const x=(dwAgg[w.week]=dwAgg[w.week]||{m:0,r:0}); x.m+=Number(w.meta)||0; x.r+=Number(w.realizado)||0; });
    const dmWeeks={}; dweeks.forEach(wk=>{ const mo=wk.start.getMonth(); const val=dwAgg[wk.week]; if(!val) return; (dmWeeks[mo]=dmWeeks[mo]||[]).push(val); });
    const mAgg={}; Object.keys(dmWeeks).forEach(mo=>{ mAgg[mo]=periodAgg(dmWeeks[mo], dCalcType); });
    v.innerHTML = `
      <div class="cards">
        <div class="stat"><div class="label">Objetivos Estratégicos</div><div class="value">${objs.length}</div><div class="sub">${goals.length} metas SMART</div></div>
        <div class="stat"><div class="label">Iniciativas</div><div class="value">${inis.length}</div><div class="sub">${conc} concluídas</div></div>
        <div class="stat" style="border-color:var(--green)"><div class="label">Progresso médio</div><div class="value">${avg}%</div><div class="sub">do plano de ação</div></div>
        <div class="stat" style="border-color:var(--gold)"><div class="label">Itens SWOT</div><div class="value">${swot.length}</div><div class="sub">mapeados</div></div>
      </div>
      <div class="card"><div class="section-head"><div><h3>Desempenho</h3><p class="desc">Meta × realizado por mês (${dyear})</p></div></div>
        ${goals.length?`<div class="field" style="margin:0 0 12px;max-width:520px"><label>Meta SMART</label><select onchange="App.dashSetGoal(this.value)">${goals.map(g=>`<option value="${g.id}" ${g.id==dashGoal?'selected':''}>${esc(g.smart_text)}${g.unit?' — '+esc(g.unit):''}</option>`).join('')}</select></div><canvas id="ch-perf" height="110"></canvas>`:'<div class="empty">Cadastre metas para ver o desempenho.</div>'}</div>
      <div class="card"><h3>Top 5 prioridades (Matriz GUT)</h3>
        <table><thead><tr><th>Item</th><th>Classificação</th><th>GUT</th></tr></thead><tbody>
        ${topGut.map(t=>`<tr><td>${esc(t.item)}</td><td>${esc(t.classification)}</td><td class="gut-num">${t.gut}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem dados</td></tr>'}
        </tbody></table></div>`;
    if(goals.length) mkChart('ch-perf','bar',{ labels:DMESH, datasets:[
      {label:'Meta',data:DMESH.map((_,m)=>(mAgg[m]||{}).m||0),backgroundColor:'#cdd8e6'},
      {label:'Realizado',data:DMESH.map((_,m)=>(mAgg[m]||{}).r||0),backgroundColor:'#2E8BC0'}]});

  /* ---------- Painel de Indicadores ---------- */
  VIEWS.indicadores = async (v) => {
    const year = window.__indYear || new Date().getFullYear(); window.__indYear=year;
    const [persp, objs, goals, depts, weekly, profs, gdep, gasg] = await Promise.all([
      tList('bsc_perspectives','ord'), tList('objectives','ord'), tList('goals'), tList('departments','ord'),
      sb.from('goal_weekly').select('*').eq('year',year).then(r=>r.data||[]), tList('profiles','name'),
      sb.from('goal_departments').select('goal_id,department_id').then(r=>r.data||[]),
      sb.from('goal_assignees').select('goal_id,profile_id').then(r=>r.data||[])]);
    const [secs, gsec] = await Promise.all([tList('department_processes','ord'), tList('goal_sectors')]);
    const mode = window.__indMode || 'mensal'; window.__indMode=mode;
    const secFilter = window.__indSector || '';
    const deptFilter = window.__indDept || ''; const respFilter = window.__indResp || ''; const quarterFilter = window.__indQuarter || '';
    let weeks = weeksOfYear(year);
    if(mode==='semanal' && quarterFilter){ weeks = weeks.filter(wk=> (Math.floor(wk.start.getMonth()/3)+1) === +quarterFilter); }
    const aggW={};
    weekly.forEach(row=>{ const b=(aggW[row.goal_id]=aggW[row.goal_id]||{}); const yy=(b[row.week]=b[row.week]||{m:0,r:0}); yy.m+=Number(row.meta)||0; yy.r+=Number(row.realizado)||0; });
    const monthAgg=(gid,month,calcType)=>{ const ws=weeksOfYear(year).filter(wk=>wk.start.getMonth()===month); const vals=ws.map(wk=>(aggW[gid]||{})[wk.week]).filter(Boolean); return periodAgg(vals,calcType); };
    const yearAgg=(gid,calcType)=>{ const vals=weeksOfYear(year).map(wk=>(aggW[gid]||{})[wk.week]).filter(Boolean); return periodAgg(vals,calcType); };
    const perspName=(id)=>{const p=persp.find(x=>x.id===id);return p?p.name:'';};
    const deptName2=(id)=>{const d=depts.find(x=>x.id===id);return d?d.name:'';};
    const gdMap={}; gdep.forEach(x=>{ (gdMap[x.goal_id]=gdMap[x.goal_id]||[]).push(x.department_id); });
    const gaMap={}; gasg.forEach(x=>{ (gaMap[x.goal_id]=gaMap[x.goal_id]||[]).push(x.profile_id); });
    let yearGoals = goals.filter(g=> g.year==year || g.year==null);
    if(deptFilter) yearGoals = yearGoals.filter(g=> (gdMap[g.id]||[]).includes(+deptFilter));
    if(respFilter) yearGoals = yearGoals.filter(g=> (gaMap[g.id]||[]).includes(respFilter));
    if(secFilter) yearGoals = yearGoals.filter(g=> gsec.some(x=>x.goal_id===g.id && x.sector_id===+secFilter));
    const secOpts = secs.filter(x=> !deptFilter || x.department_id===+deptFilter);
    const objWithGoals = objs.filter(o=> yearGoals.some(g=>g.objective_id===o.id));
    window.__indWeekly=weekly; window.__indGoals=yearGoals; window.__indProfs=profs;
    const yopts=[]; for(let y=year-2;y<=year+3;y++) yopts.push(y);
    const MESH=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const col=(m,r)=>{ if(!m && !r) return '#eef2f7'; if(!m) return '#cdd8e6'; const p=r/m*100; if(p>=100) return 'var(--green)'; if(p>=70) return 'var(--accent)'; if(p>=40) return 'var(--amber)'; return 'var(--red)'; };
    let cols; if(mode==='mensal') cols=MESH.map((lb,i)=>({key:i,label:lb})); else if(mode==='semanal') cols=weeks.map(wk=>({key:wk.week,label:'S'+wk.week})); else cols=[{key:'ano',label:String(year)}];
    const cellOf=(gid,key,calcType)=>{ if(mode==='mensal') return monthAgg(gid,key,calcType); if(mode==='semanal') return (aggW[gid]||{})[key]||{m:0,r:0}; return yearAgg(gid,calcType); };
    const qopts=[{v:'',t:'Todos'},{v:'1',t:'T1'},{v:'2',t:'T2'},{v:'3',t:'T3'},{v:'4',t:'T4'}];
    let html = `<div class="card"><div class="section-head"><div><h3>Painel de Metas</h3><p class="desc">Acompanhamento das metas, agrupadas por perspectiva › objetivo › departamento.</p></div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
          <div class="toggle-group"><button class="${mode==='semanal'?'active':''}" onclick="App.indSetMode('semanal')">Semanal</button><button class="${mode==='mensal'?'active':''}" onclick="App.indSetMode('mensal')">Mensal</button><button class="${mode==='anual'?'active':''}" onclick="App.indSetMode('anual')">Anual</button></div>
          <div class="field" style="margin:0;min-width:100px"><label>Ano</label><select onchange="App.indSetYear(this.value)">${yopts.map(y=>`<option value="${y}" ${y==year?'selected':''}>${y}</option>`).join('')}</select></div>
          <div class="field" style="margin:0;min-width:140px"><label>Departamento</label><select onchange="App.indSetDept(this.value)"><option value="">Todos</option>${depts.map(d=>`<option value="${d.id}" ${String(d.id)===String(deptFilter)?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
          <div class="field" style="margin:0;min-width:150px"><label>Setor</label><select onchange="App.indSetSector(this.value)"><option value="">Todos</option>${secOpts.map(x=>`<option value="${x.id}" ${String(x.id)===String(secFilter)?'selected':''}>${deptFilter?'':esc(((depts.find(d=>d.id===x.department_id)||{}).name||'')+' › ')}${esc(x.name)}</option>`).join('')}</select></div>
          <div class="field" style="margin:0;min-width:160px"><label>Responsável</label><select onchange="App.indSetResp(this.value)"><option value="">Todos</option>${profs.map(p=>`<option value="${p.id}" ${String(p.id)===String(respFilter)?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
          ${mode==='semanal'?`<div class="field" style="margin:0;min-width:100px"><label>Trimestre</label><select onchange="App.indSetQuarter(this.value)">${qopts.map(q=>`<option value="${q.v}" ${q.v===quarterFilter?'selected':''}>${q.t}</option>`).join('')}</select></div>`:''}
          ${can('manager')?`<button class="btn btn-accent btn-sm" onclick="App.go('okr')">+ Nova meta</button>`:''}</div></div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)">
          <span><span class="ind-key" style="background:var(--green)"></span>≥100%</span><span><span class="ind-key" style="background:var(--accent)"></span>70–99%</span><span><span class="ind-key" style="background:var(--amber)"></span>40–69%</span><span><span class="ind-key" style="background:var(--red)"></span>&lt;40%</span><span><span class="ind-key" style="background:#eef2f7"></span>sem dados</span></div>
        ${mode==='semanal'?'<p class="desc" style="margin-top:6px">Clique no cabeçalho de uma semana para ver o resumo detalhado.</p>':''}</div>`;
    if(!objWithGoals.length){ html += '<div class="empty">Nenhuma meta para '+year+' com os filtros selecionados.</div>'; }
    objWithGoals.forEach(o=>{
      const gs = yearGoals.filter(g=>g.objective_id===o.id);
      html += `<div class="card" style="padding:0;overflow:hidden">
        <div class="ind-group">${esc(perspName(o.perspective_id)||'—')} <span>›</span> <b>${esc(o.title)}</b>${o.department_id?` <span>›</span> Divisão: ${esc(deptName2(o.department_id))}`:''}</div>
        <div style="overflow-x:auto"><table class="ind-table"><thead><tr><th class="ind-name">Indicador</th>${cols.map(c=>`<th${mode==='semanal'?` onclick="App.indWeekSummary(${c.key})" style="cursor:pointer" title="Ver resumo da semana"`:''}>${c.label}</th>`).join('')}${mode==='anual'?'':`<th>${year}</th>`}</tr></thead><tbody>
        ${gs.map(g=>{ const calcType=g.calc_type||'soma'; const cells=cols.map(c=>{ const x=cellOf(g.id,c.key,calcType); const tip=`${c.label}: meta ${fmtByUnit(x.m,g.unit)} · resultado ${fmtByUnit(x.r,g.unit)} · ${pct(x.r,x.m)}%`; return `<td title="${tip}"><span class="ind-cell" style="background:${col(x.m,x.r)}"></span></td>`; }).join('');
          const {m:ym,r:yr} = yearAgg(g.id,calcType);
          return `<tr><td class="ind-name" title="${esc(g.smart_text)}" onclick="App.indGoto(${g.id})" style="cursor:pointer">${esc(g.smart_text)}${calcType==='media'?' <span class="pill pill-gray">média</span>':''}</td>${cells}${mode==='anual'?'':`<td><b>${pct(yr,ym)}%</b></td>`}</tr>`;
        }).join('')}
        </tbody></table></div></div>`;
    });
    v.innerHTML = html;
  };
  App_indSetYear=(y)=>{ window.__indYear=+y; go('indicadores'); };
  App_indSetMode=(m)=>{ window.__indMode=m; go('indicadores'); };
  App_indSetDept=(d)=>{ window.__indDept=d; window.__indSector=''; go('indicadores'); };
  App_indSetSector=(s)=>{ window.__indSector=s; go('indicadores'); };
  App_indSetResp=(p)=>{ window.__indResp=p; go('indicadores'); };
  App_indSetQuarter=(q)=>{ window.__indQuarter=q; go('indicadores'); };
  App_indGoto=(gid)=>{ window.__pfGoal=gid; window.__pfYear=window.__indYear; go('desempenho'); };
  App_indWeekSummary=(week)=>{
    const year = window.__indYear; const weekly = window.__indWeekly||[]; const goals = window.__indGoals||[]; const profs = window.__indProfs||[];
    const profName=(id)=>{ if(!id) return ''; const p=profs.find(x=>x.id===id); return p?p.name:''; };
    const rowsForWeek = weekly.filter(w=>w.week===week);
    const wk = weeksOfYear(year).find(w=>w.week===week)||{};
    const body = goals.map(g=>{
      const rows = rowsForWeek.filter(r=>r.goal_id===g.id);
      if(!rows.length) return '';
      const m = rows.reduce((a,b)=>a+(Number(b.meta)||0),0), r = rows.reduce((a,b)=>a+(Number(b.realizado)||0),0);
      const notes = rows.filter(x=>x.causa||x.acao).map(x=>`<li><b>${esc(profName(x.profile_id)||'—')}:</b> ${x.causa?('Causa: '+esc(x.causa)+' '):''}${x.acao?('Ação: '+esc(x.acao)):''}</li>`).join('');
      return `<div class="card" style="padding:12px;margin-bottom:8px"><b style="color:var(--navy)">${esc(g.smart_text)}</b>
        <p class="desc" style="margin-top:4px">Meta: <b>${fmtByUnit(m,g.unit)}</b> · Resultado: <b>${fmtByUnit(r,g.unit)}</b> · ${pct(r,m)}%</p>
        ${notes?`<ul style="margin:6px 0 0 18px;font-size:12.5px;color:var(--muted)">${notes}</ul>`:''}</div>`;
    }).filter(Boolean).join('');
    modal('Resumo da Semana '+week+(wk.start?(' · '+dm(wk.start)+'–'+dm(wk.end)):''), body || '<div class="empty">Nenhum lançamento nesta semana (com os filtros atuais).</div>');
  };

  function resizeOrgImg(file, cb){
    const reader=new FileReader();
    reader.onload=()=>{ const img=new Image(); img.onload=()=>{ const maxW=1100,maxH=1500; let w=img.width,h=img.height; const r=Math.min(maxW/w,maxH/h,1); w=Math.round(w*r); h=Math.round(h*r); const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.82)); }; img.src=reader.result; };
    reader.readAsDataURL(file);

      ${group(cls).length?group(cls).map(r=>`<tr><td>${esc(r.item)}${tagOf(r)}</td><td>${r.gravidade}</td><td>${r.urgencia}</td><td>${r.tendencia}</td><td class="gut-num">${r.gut}</td>
        ${can('contributor')?`<td>${actionsCol(`App.editSwot(${JSON.stringify(r).replace(/"/g,'&quot;')})`,`App.delSwot(${r.id})`)}</td>`:''}</tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhum item</td></tr>`}
      </tbody></table></div>`;
    const viewLabel = view==='geral' ? 'Geral da organização' : (view[0]==='d' ? (((depts.find(d=>d.id==+view.slice(1))||{}).name||'')+' — consolidado (departamento + setores)') : (()=>{ const s=secOf(+view.slice(1))||{}; const d=depts.find(x=>x.id===s.department_id)||{}; return (d.name?d.name+' › ':'')+(s.name||''); })());

    const yopts=[]; for(let y=yr-3;y<=yr+2;y++) yopts.push(y);
    v.innerHTML=`<div class="card"><div class="section-head"><div><h3>Análise SWOT — priorização GUT (Gravidade/Impacto × Urgência × Tendência)</h3>

    ['Processos e Operações','Medimos produtividade, prazos e qualidade das entregas.'],

  const diagLevel=(m)=> m>=4?'Avançado':(m>=2.5?'Intermediário':'Básico');
  VIEWS.diag = async (v) => {
    const tab = window.__diagTab||'responder'; window.__diagTab=tab;
    const year = window.__diagPeriod || new Date().getFullYear(); window.__diagPeriod=year;
    const [qs, resp] = await Promise.all([ tList('diag_questions','ord'),
      sb.from('diag_responses').select('*').eq('period',String(year)).then(r=>r.data||[]) ]);
    const yopts=[]; for(let y=year-2;y<=year+2;y++) yopts.push(y);
    const byArea=(a)=>qs.filter(q=>q.area===a);
    const tabs=`<div class="toggle-group"><button class="${tab==='responder'?'active':''}" onclick="App.diagTab('responder')">Responder</button>${can('manager')?`<button class="${tab==='resultados'?'active':''}" onclick="App.diagTab('resultados')">Resultados</button>`:''}${can('admin')?`<button class="${tab==='perguntas'?'active':''}" onclick="App.diagTab('perguntas')">Perguntas</button>`:''}</div>`;
    const headerCard=`<div class="card"><div class="section-head"><div><h3>Diagnóstico 360</h3><p class="desc">Maturidade da gestão por área (escala 1 a 5). Vários respondentes — a média forma o radar.</p></div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">${tabs}<div class="field" style="margin:0;min-width:100px"><label>Período</label><select onchange="App.diagSetPeriod(this.value)">${yopts.map(y=>`<option value="${y}" ${y==year?'selected':''}>${y}</option>`).join('')}</select></div></div></div></div>`;
    if(!qs.length){ v.innerHTML = headerCard + `<div class="card"><p class="desc">Ainda não há perguntas cadastradas para esta organização.</p>${can('admin')?`<button class="btn btn-accent btn-sm" onclick="App.diagSeedDefault()">Carregar perguntas padrão</button>`:''}</div>`; return; }
    if(tab==='responder'){
      const mine={}; resp.filter(r=>r.respondent===me.id).forEach(r=>mine[r.question_id]=r.score);
      const body = DIAG_AREAS.filter(a=>byArea(a).length).map(a=>`<div class="card"><div class="section-head"><h3 style="font-size:15px">${esc(a)}</h3></div>
        ${byArea(a).map(q=>`<div class="diag-q"><div class="diag-ql">${esc(q.question)}</div><div class="scale">${[1,2,3,4,5].map(n=>`<label class="opt"><input type="radio" name="dq-${q.id}" value="${n}" ${mine[q.id]==n?'checked':''}><span>${n}</span></label>`).join('')}</div></div>`).join('')}</div>`).join('');
      v.innerHTML = headerCard + `<div class="card"><p class="desc" style="margin:0">Escala: <b>1</b> Não fazemos · <b>2</b> Início/informal · <b>3</b> Parcial · <b>4</b> Estruturado · <b>5</b> Otimizado</p></div>${body}<div style="max-width:760px"><button class="btn btn-primary btn-block" onclick="App.diagSaveMine()">Salvar minhas respostas</button></div>`;
    } else if(tab==='resultados'){
      const areasUsadas=DIAG_AREAS.filter(a=>byArea(a).length);
      const respondents=[...new Set(resp.map(r=>r.respondent))].length;
      const avgOf=(a)=>{ const qids=byArea(a).map(q=>q.id); const sc=resp.filter(r=>qids.indexOf(r.question_id)>=0 && r.score!=null).map(r=>r.score); return sc.length? sc.reduce((x,y)=>x+y,0)/sc.length : 0; };
      const areaAvg={}; areasUsadas.forEach(a=>areaAvg[a]=avgOf(a));
      const overall = areasUsadas.length? areasUsadas.reduce((s,a)=>s+areaAvg[a],0)/areasUsadas.length : 0;
      const ranked = areasUsadas.map(a=>({a,m:areaAvg[a]})).sort((p,q2)=>p.m-q2.m);
      v.innerHTML = headerCard + `<div class="card"><div class="cards">
          <div class="stat"><div class="label">Respondentes</div><div class="value">${respondents}</div><div class="sub">no período ${year}</div></div>

        ${respondents?'<canvas id="ch-diag" height="170"></canvas>':'<div class="empty">Nenhuma resposta registrada neste período.</div>'}</div>
        ${respondents?`<div class="card"><h3>Notas por área</h3><table><thead><tr><th>Área</th><th>Média</th><th>Nível</th></tr></thead><tbody>
        ${areasUsadas.map(a=>`<tr><td>${esc(a)}</td><td><b>${areaAvg[a].toFixed(1)}</b> / 5</td><td>${diagLevel(areaAvg[a])}</td></tr>`).join('')}</tbody></table></div>
        <div class="card"><h3>Prioridades (áreas mais frágeis)</h3><ol>${ranked.slice(0,3).map(x=>`<li><b>${esc(x.a)}</b> — média ${x.m.toFixed(1)} (${diagLevel(x.m)})</li>`).join('')}</ol><p class="desc">Considere transformar essas áreas em objetivos e iniciativas no planejamento.</p></div>`:''}`;
      if(respondents) mkChart('ch-diag','radar',{ labels:areasUsadas, datasets:[{ label:'Maturidade média', data:areasUsadas.map(a=>+areaAvg[a].toFixed(2)), borderColor:'#2E8BC0', backgroundColor:'rgba(46,139,192,.18)', pointBackgroundColor:'#1F3A5F' }] }, { scales:{ r:{ min:0, max:5, ticks:{stepSize:1} } } });
    } else {
      v.innerHTML = headerCard + `<div class="card"><div class="section-head"><h3>Banco de perguntas</h3><button class="btn btn-light btn-sm" onclick="App.diagAddQ()">+ Pergunta</button></div></div>` +
        DIAG_AREAS.filter(a=>byArea(a).length).map(a=>`<div class="card"><h3 style="font-size:14px">${esc(a)}</h3><table><tbody>
        ${byArea(a).map(q=>`<tr><td>${esc(q.question)}</td><td style="width:70px;text-align:right"><a href="#" onclick="App.diagDelQ(${q.id});return false;" style="color:var(--red)">excluir</a></td></tr>`).join('')}</tbody></table></div>`).join('');
    }
  };

  /* ---------- OKR ---------- */
  VIEWS.okr = async (v) => {
    const [persp, objs, goals, profs, asg, depts, gdep, gsec, secs] = await Promise.all([tList('bsc_perspectives','ord'), tList('objectives','ord'), tList('goals'),
      tList('profiles','name'), tList('goal_assignees'), tList('departments','ord'), tList('goal_departments'), tList('goal_sectors'), tList('department_processes','ord')]);
    window.__bsc={persp,objs}; window.__profs=profs; window.__deptsAll=depts;
    window.__okrData={persp,objs,goals,profs,asg,depts,gdep,gsec,secs};
    const F=window.__okrF=window.__okrF||{year:'',q:'',persp:'',dept:'',sec:'',resp:'',text:''};
    const years=[...new Set(goals.map(g=>g.year).filter(Boolean))].sort();
    const sel=(k,label,opts,minw)=>`<div class="field" style="margin:0;min-width:${minw||130}px"><label>${label}</label><select id="okrf-${k}" onchange="App.okrFilter('${k}',this.value)"><option value="">Todos</option>${opts.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(F[k])?'selected':''}>${esc(o.t)}</option>`).join('')}</select></div>`;
    v.innerHTML=`<div class="section-head"><h3>Detalhamento OKR / BSC</h3>${can('manager')?`<button class="btn btn-accent" onclick="App.editGoal()">+ Meta SMART</button>`:''}</div>
      <div class="card okr-filters" style="padding:16px 18px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div class="field" style="margin:0;flex:1;min-width:200px"><label>Buscar meta ou objetivo</label><input id="okrf-text" value="${esc(F.text)}" placeholder="Digite uma palavra…" oninput="App.okrFilter('text',this.value)"></div>
          ${sel('year','Ano',years.map(y=>({v:y,t:y})),95)}
          ${sel('q','Trimestre',[1,2,3,4].map(q=>({v:q,t:'T'+q})),100)}
          ${sel('persp','Perspectiva',persp.map(p=>({v:p.id,t:p.name})),150)}
          ${sel('dept','Departamento',depts.map(d=>({v:d.id,t:d.name})),160)}
          <span id="okrf-sec-wrap">${okrSecSelect()}</span>
          ${sel('resp','Responsável',profs.map(p=>({v:p.id,t:p.name})),160)}
          <button class="btn btn-light btn-sm" onclick="App.okrClear()" style="margin-bottom:2px">Limpar filtros</button>
        </div>
        <p class="desc" id="okr-count" style="margin:10px 0 0"></p>
      </div>
      <div id="okr-list"></div>`;
    okrRender();
  };
  function okrSecSelect(){
    const D=window.__okrData, F=window.__okrF; const secs=D.secs.filter(x=>!F.dept || x.department_id===+F.dept);
    return `<div class="field" style="margin:0;min-width:150px;display:inline-block"><label>Setor</label><select id="okrf-sec" onchange="App.okrFilter('sec',this.value)"><option value="">Todos</option>${secs.map(x=>`<option value="${x.id}" ${String(x.id)===String(F.sec)?'selected':''}>${F.dept?'':esc(((D.depts.find(d=>d.id===x.department_id)||{}).name||'')+' › ')}${esc(x.name)}</option>`).join('')}</select></div>`;
  }
  function okrRender(){
    const D=window.__okrData, F=window.__okrF; const box=document.getElementById('okr-list'); if(!D||!box) return;
    const {persp,objs,goals,profs,asg,depts,gdep,gsec,secs}=D;
    const pName=(id)=>(profs.find(p=>p.id===id)||{}).name||'';
    const dName=(id)=>(depts.find(d=>d.id===id)||{}).name||'';
    const owners=(gid)=>asg.filter(a=>a.goal_id===gid);
    const goalDepts=(gid)=>gdep.filter(a=>a.goal_id===gid);
    const goalSecs=(gid)=>gsec.filter(a=>a.goal_id===gid).map(a=>secs.find(x=>x.id===a.sector_id)).filter(Boolean);
    const perLabel=(g)=> g.year? ('T'+(g.quarter||1)+' '+g.year) : (g.period||'');
    const norm=(t)=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const q=norm(F.text).trim();
    const active = !!(F.year||F.q||F.persp||F.dept||F.sec||F.resp||q);
    const objOk=(o)=> !F.persp || o.perspective_id===+F.persp;
    const goalOk=(g,o)=>{
      if(F.year && g.year!==+F.year) return false;
      if(F.q && g.quarter!==+F.q) return false;
      if(F.dept && !goalDepts(g.id).some(a=>a.department_id===+F.dept)) return false;
      if(F.sec && !gsec.some(a=>a.goal_id===g.id && a.sector_id===+F.sec)) return false;
      if(F.resp && !owners(g.id).some(a=>a.profile_id===F.resp)) return false;
      if(q && norm(g.smart_text).indexOf(q)<0 && norm(o.title).indexOf(q)<0) return false;
      return true; };
    let nGoals=0, nObjs=0;
    const persOrd=(o)=>{ const i=persp.findIndex(p=>p.id===o.perspective_id); return i<0?99:i; };
    const html=objs.filter(objOk).slice().sort((a,b)=>persOrd(a)-persOrd(b)||(a.ord||0)-(b.ord||0)).map(o=>{
      const gs=goals.filter(g=>g.objective_id===o.id && goalOk(g,o));
      if(active && !gs.length) return '';
      nObjs++; nGoals+=gs.length;
      const p=persp.find(x=>x.id===o.perspective_id);
      return `<div class="card"><div class="section-head"><div>${p?`<span class="pill" style="background:${esc(p.color||'#eef2f7')}22;color:${esc(p.color||'var(--navy)')};margin-bottom:4px">${esc(p.name)}</span>`:''}<h3>${esc(o.title)}</h3></div>${can('manager')?`<button class="btn btn-light btn-sm" onclick='App.editObj(${JSON.stringify(o).replace(/'/g,"&#39;")})'>Editar objetivo</button>`:''}</div>
        <table><thead><tr><th>Meta SMART</th><th>Período</th><th>Departamento(s) / Setor(es)</th><th>Responsáveis</th>${can('manager')?'<th></th>':''}</tr></thead><tbody>
        ${gs.map(g=>`<tr><td>${esc(g.smart_text)}${g.unit?` <span class="pill pill-gray" style="margin-left:6px">${esc(g.unit)}</span>`:''}</td><td style="white-space:nowrap">${esc(perLabel(g))}</td>
          <td>${goalDepts(g.id).map(a=>`<span class="owner-chip">${esc(dName(a.department_id))}</span>`).join('')}${goalSecs(g.id).map(x=>`<span class="sec-chip" title="Setor">${esc(x.name)}</span>`).join('')}${(!goalDepts(g.id).length&&!goalSecs(g.id).length)?'<span style="color:var(--muted)">—</span>':''}</td>
          <td>${owners(g.id).map(a=>`<span class="owner-chip">${esc(pName(a.profile_id))}</span>`).join('')||'<span style="color:var(--muted)">—</span>'}</td>
          ${can('manager')?`<td><div class="inline-actions"><button class="btn btn-light btn-sm" onclick="App.manageDepts(${g.id})">Deptos/Setores</button><button class="btn btn-light btn-sm" onclick="App.manageOwners(${g.id})">Responsáveis</button><button class="btn btn-light btn-sm" onclick='App.editGoal(${JSON.stringify(g).replace(/"/g,'&quot;').replace(/'/g,"&#39;")})'>Editar</button><button class="btn btn-danger btn-sm" onclick="App.delGoal(${g.id})">Excluir</button></div></td>`:''}</tr>`).join('')||'<tr><td colspan="5" class="empty">Sem metas</td></tr>'}
        </tbody></table></div>`; }).join('');
    box.innerHTML = html || '<div class="card"><div class="empty">Nenhuma meta encontrada com esses filtros.</div></div>';
    const c=document.getElementById('okr-count');
    if(c) c.innerHTML = active ? `<b>${nGoals}</b> meta(s) em <b>${nObjs}</b> objetivo(s) com os filtros aplicados.` : `${goals.length} metas em ${objs.length} objetivos. Use os filtros para encontrar metas por período, perspectiva, departamento, setor ou responsável.`;
  }
  App_okrFilter = (k, val) => {
    const F=window.__okrF; F[k]=val;
    if(k==='dept'){ const D=window.__okrData; const s=D.secs.find(x=>x.id===+F.sec); if(val && s && s.department_id!==+val) F.sec=''; const w=document.getElementById('okrf-sec-wrap'); if(w) w.innerHTML=okrSecSelect(); }
    okrRender();
  };
  App_okrClear = () => { window.__okrF={year:'',q:'',persp:'',dept:'',sec:'',resp:'',text:''}; go('okr'); };
  function yearOptions(){ const y0=new Date().getFullYear(); let o=[]; for(let y=y0-1;y<=y0+5;y++) o.push({v:y,t:y}); return o; }
  const UNIT_OPTS=[{v:'',t:'— Não definida —'},{v:'R$',t:'Monetário (R$)'},{v:'%',t:'Percentual (%)'},{v:'un',t:'Unitário (un)'},{v:'h',t:'Horas (h)'},{v:'outro',t:'Outro (personalizado)'}];
  function fmtByUnit(n, unit){ const num=Number(n)||0; if(unit==='R$') return 'R$ '+money(num); if(unit==='%') return money(num)+'%'; if(!unit) return money(num); return money(num)+' '+unit; }
  const CALC_OPTS=[{v:'soma',t:'Soma'},{v:'media',t:'Média'}];
  function periodAgg(vals, calcType){ if(!vals.length) return {m:0,r:0}; const sm=vals.reduce((a,b)=>a+b.m,0), sr=vals.reduce((a,b)=>a+b.r,0); return calcType==='media' ? {m:sm/vals.length, r:sr/vals.length} : {m:sm, r:sr}; }
  App_editGoal = (g={}) => {
    const objs=(window.__bsc.objs||[]).map(o=>({v:o.id,t:o.title}));
    const qopts=[1,2,3,4].map(q=>({v:q,t:'Trimestre '+q}));
    const presets=['','R$','%','un','h'];
    const unitSel = g.unit && !presets.includes(g.unit) ? 'outro' : (g.unit||'');
    modal(g.id?'Editar meta':'Nova meta SMART', form([
      f.sel('gl-obj','Objetivo',objs,g.objective_id), f.area('gl-smart','Meta SMART',g.smart_text),
      `<div class="field-row">${f.sel('gl-year','Ano',yearOptions(),g.year||new Date().getFullYear())}${f.sel('gl-q','Trimestre',qopts,g.quarter||1)}</div>`,
      f.sel('gl-unit','Unidade de medida da meta',UNIT_OPTS,unitSel),
      f.text('gl-unit-custom','Rótulo personalizado (só se escolher "Outro", ex: clientes, pontos)', unitSel==='outro'?g.unit:''),
      f.sel('gl-calc','Fórmula de cálculo do período (mês/trimestre/ano)',CALC_OPTS,g.calc_type||'soma'),
      `<button class="btn btn-primary btn-block" onclick="App.saveGoal(${g.id||0})">Salvar</button>`]));
  };
  App_saveGoal = async (id) => { const y=+val('gl-year'),q=+val('gl-q'); const uSel=val('gl-unit'); const unit = uSel==='outro' ? (val('gl-unit-custom').trim()||null) : (uSel||null); const row={objective_id:+val('gl-obj'),smart_text:val('gl-smart'),year:y,quarter:q,period:'T'+q+' '+y,unit,calc_type:val('gl-calc')||'soma'}; try{ id?await tUpdate('goals',id,row):await tInsert('goals',row);}catch(e){return toast(e.message);} closeModal(); toast('Salvo'); go('okr'); };
  App_delGoal = async (id) => { if(await delRow('goals',id)) go('okr'); };
  App_manageDepts = async (gid) => {
    const [depts, secs] = await Promise.all([window.__deptsAll || tList('departments','ord'), tList('department_processes','ord')]); window.__deptsAll=depts; window.__sectors=secs;
    const [{ data:cur }, { data:curS }] = await Promise.all([sb.from('goal_departments').select('department_id').eq('goal_id',gid), sb.from('goal_sectors').select('sector_id').eq('goal_id',gid)]);
    const set=new Set((cur||[]).map(x=>x.department_id)), setS=new Set((curS||[]).map(x=>x.sector_id));
    modal('Departamentos e setores da meta', form([
      `<p class="desc">Marque o(s) departamento(s) e, se quiser detalhar, o(s) setor(es) responsáveis pela meta. Ao marcar um setor, o departamento dele entra automaticamente.</p>`,
      `<div class="check-list" style="max-height:380px">${depts.map(d=>{ const ss=secs.filter(x=>x.department_id===d.id); return `<div class="dep-block"><label><input type="checkbox" class="gd-dep" value="${d.id}" ${set.has(d.id)?'checked':''}> <b>${esc(d.name)}</b></label>
        ${ss.length?`<div class="secs">${ss.map(x=>`<label><input type="checkbox" class="gd-sec" data-dep="${d.id}" value="${x.id}" ${setS.has(x.id)?'checked':''} onchange="if(this.checked){ const c=document.querySelector('.gd-dep[value=&quot;${d.id}&quot;]'); if(c) c.checked=true; }"> Setor: ${esc(x.name)}</label>`).join('')}</div>`:''}</div>`; }).join('')||'<span class="empty">Nenhum departamento cadastrado</span>'}</div>`,
      `<button class="btn btn-primary btn-block" onclick="App.saveDepts(${gid})">Salvar</button>`]));
  };
  App_saveDepts = async (gid) => {
    const secIds=[...document.querySelectorAll('.gd-sec:checked')].map(i=>+i.value);
    const depIds=[...new Set([...document.querySelectorAll('.gd-dep:checked')].map(i=>+i.value).concat([...document.querySelectorAll('.gd-sec:checked')].map(i=>+i.dataset.dep)))];
    try{ let r=await sb.from('goal_departments').delete().eq('goal_id',gid); if(r.error) throw r.error;
      if(depIds.length){ r=await sb.from('goal_departments').insert(depIds.map(did=>({goal_id:gid,department_id:did}))); if(r.error) throw r.error; }
      r=await sb.from('goal_sectors').delete().eq('goal_id',gid); if(r.error) throw r.error;
      if(secIds.length){ r=await sb.from('goal_sectors').insert(secIds.map(sid=>({goal_id:gid,sector_id:sid}))); if(r.error) throw r.error; } }
    catch(e){ return toast(e.message); }
    closeModal(); toast('Departamentos e setores salvos'); go('okr');
  };

      `<button class="btn btn-primary btn-block" onclick="App.saveOwners(${gid})">Salvar</button>`]));
  };
  App_saveOwners = async (gid) => {
    const ids=[...document.querySelectorAll('.check-list input:checked')].map(i=>i.value);

    catch(e){ return toast(e.message); }
    closeModal(); toast('Responsáveis salvos'); go('okr');
  };

  /* ---------- Iniciativas 5W2H ---------- */
  VIEWS.iniciativas = async (v) => {

      tList('initiatives','ord'), tList('objectives','ord'), tList('departments','ord'),
      tList('profiles','name'), tList('initiative_actions','ord'),
      sb.from('initiative_assignees').select('initiative_id, profile_id, profiles(name)').then(r=>r.data||[])]);
    window.__bsc={objs}; window.__depts=depts; window.__profs=profs;
    const objTitle=(id)=>{ const o=objs.find(x=>x.id===id); return o?o.title:null; };
    const deptN=(id)=>{ const d=depts.find(x=>x.id===id); return d?d.name:null; };
    const profN=(id)=>{ const p=profs.find(x=>x.id===id); return p?p.name:'—'; };
    const actsOf=(id)=>acts.filter(a=>a.initiative_id===id);
    const ownersOf=(id)=>iasg.filter(a=>a.initiative_id===id);
    const prog=(i)=>{ const l=actsOf(i.id); return l.length?Math.round(l.filter(x=>x.status==='Concluído').length/l.length*100):0; };
    v.innerHTML=`<div class="section-head"><h3>Plano de Ação — Iniciativas</h3>${can('contributor')?`<button class="btn btn-accent" onclick="App.editIni()">+ Nova iniciativa</button>`:''}</div>
      ${rows.length?rows.map(i=>{ const l=actsOf(i.id); const p=prog(i); const owns=ownersOf(i.id); return `<div class="card" style="border-left:4px solid var(--accent)">
        <div class="section-head"><div><h3>${esc(i.name)}</h3>
          <p class="desc" style="margin:2px 0 0">${objTitle(i.objective_id)?`🎯 ${esc(objTitle(i.objective_id))}`:'<span style="color:var(--red)">sem objetivo</span>'}${deptN(i.department_id)?` · 🏢 ${esc(deptN(i.department_id))}`:''}</p></div>
          ${can('contributor')?`<div class="inline-actions"><button class="btn btn-light btn-sm" onclick="App.manageIniOwners(${i.id})">Responsáveis</button><button class="btn btn-light btn-sm" onclick='App.editIni(${JSON.stringify(i).replace(/"/g,'&quot;')})'>Editar</button><button class="btn btn-danger btn-sm" onclick="App.delIni(${i.id})">Excluir</button></div>`:''}</div>
        <div style="margin:2px 0 10px">${owns.length?owns.map(a=>`<span class="owner-chip">${esc((a.profiles&&a.profiles.name)||'')}</span>`).join(''):'<span class="desc">Nenhum responsável definido</span>'}</div>
        <div style="display:flex;align-items:center;gap:10px;margin:6px 0 12px">${bar(p)}<small>${p}% · ${l.filter(x=>x.status==='Concluído').length}/${l.length} ações concluídas</small></div>

  function weeksOfYear(year){
    const weeks=[]; let d=new Date(year,0,1);
    const dow=d.getDay(); d.setDate(d.getDate()+(dow===0?1:(dow===1?0:8-dow))); // primeira segunda-feira
    let w=1;
    while(d.getFullYear()<=year && w<=53){
      const start=new Date(d), end=new Date(d); end.setDate(end.getDate()+6);
      if(start.getFullYear()>year) break;
      weeks.push({week:w,start:new Date(start),end:new Date(end)});
      d.setDate(d.getDate()+7); w++;
    }
    return weeks;
  }
  const dm=(d)=>('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
  const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  function lastCompletedWeek(){
    const today=new Date(); const year=today.getFullYear(); const ws=weeksOfYear(year);
    const idx=ws.findIndex(w=> today>=w.start && today<=w.end);
    if(idx>0) return { year, week: ws[idx-1].week };
    if(idx===0){ const py=year-1; const pws=weeksOfYear(py); return { year:py, week: pws.length?pws[pws.length-1].week:1 }; }
    return { year, week: ws.length?ws[ws.length-1].week:1 };
  }

  /* ---------- Desempenho de Iniciativas (status semanal das ações 3Q1C) ---------- */
  function currentWeekOf(year){
    const today=new Date(); const ws=weeksOfYear(year);
    const wk=ws.find(w=> today>=w.start && today<=w.end);
    return wk?wk.week:(today.getFullYear()>year?ws.length:1);
  }

    M.fill.forEach((f,i)=>{ const o=g('rel-obs-'+i); if(o!=null) f.obs=o; });
    M.depts.forEach(d=>{ const v=g('rel-rep-'+d.code.replace(/[^A-Za-z0-9]/g,'_')); if(v!=null) M.rep[d.code]=v; });
    const map={synth:'rel-synth',pos:'rel-pos',neg:'rel-neg',leitura:'rel-leitura',fillNote:'rel-fillnote',flags:'rel-flags',rec:'rel-rec'};

  App_relExport = async (kind) => {
    const M=relCollect(); if(!M) return; const msg=document.getElementById('rel-msg');
    try{
      if(msg) msg.textContent='Gerando arquivo…';
      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', ()=>typeof JSZip!=='undefined');
      const tpl = kind==='docx' ? 'modelos/A4_MODELO.docx' : 'modelos/Modelo_Daexe.pptx';
      const r=await fetch(tpl, { cache:'no-cache' }); if(!r.ok) throw new Error('Modelo não encontrado ('+tpl+'). Abra o sistema pelo endereço on-line.');
      const buf=await r.arrayBuffer();
      const blob = kind==='docx' ? await RelMetas.buildDocx(M, buf) : await RelMetas.buildPptx(M, buf);
      const org=(me.org_name||'Org').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
      const name = (kind==='docx'?'Relatorio_Resultados_Metas_':'Apresentacao_Resultados_Metas_')+`T${M.quarter}_${M.year}_${org}.${kind}`;
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
      if(msg) msg.textContent='Arquivo gerado: '+name; toast('Arquivo gerado');
    }catch(e){ if(msg) msg.textContent=''; toast(e.message); }
  };

   'doRecovery','backToLogin','manageSector','saveSector','indSetSector','okrFilter','okrClear','relLoad','relSave','relExport','relCount','tutOpen','tutFilter','help']
   .forEach(n=>{ pub[n]=(...a)=>eval('App_'+n)(...a); });
  return Object.assign(pub,{ init });
})();
function captureAuthLink(){
  if (window.__authCaptured) return; window.__authCaptured = true;
  var h = (location.hash || '').replace(/^#/, ''), q = (location.search || '').replace(/^\?/, '');
  var hp = new URLSearchParams(h), qp = new URLSearchParams(q);
  if (hp.get('type') === 'recovery' || qp.get('type') === 'recovery') window.__recovery = true;
  var err = hp.get('error_description') || qp.get('error_description');
  if (err) {
    var code = hp.get('error_code') || qp.get('error_code') || '';
    window.__authErr = (code === 'otp_expired' || /expired|invalid/i.test(err))
      ? 'Este link de redefinição expirou ou já foi usado. Volte ao login e peça um novo em "Esqueci minha senha" — e use sempre o e-mail mais recente.'
      : 'Não foi possível validar o link: ' + err.replace(/\+/g, ' ');
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
}
function startApp(){
  captureAuthLink();
  if (typeof supabase === 'undefined' || !supabase.createClient) return false;
  try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){ return false; }
  App.init();
  return true;
}
function loadSbFallback(){
  if (window.__sbFb) return; window.__sbFb = true;
  var s=document.createElement('script');
  s.src='https://unpkg.com/@supabase/supabase-js@2';
  s.onerror=function(){ var s2=document.createElement('script'); s2.src='https://esm.sh/@supabase/supabase-js@2?bundle&target=es2019&exports=createClient'; document.head.appendChild(s2); };
  document.head.appendChild(s);
}
window.addEventListener('DOMContentLoaded', function(){
  var tries=0;
  (function wait(){
    if (startApp()) return;
    if (tries===20) loadSbFallback();
    if (++tries > 150){ var b=document.getElementById('boot'); if(b) b.innerHTML='Nao foi possivel carregar a biblioteca de conexao.<br>Tente recarregar a pagina (F5). Se persistir, tente em outra rede ou navegador.'; return; }
    setTimeout(wait, 200);
  })();
});
