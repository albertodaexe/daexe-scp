<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAEXE · Planejamento Estratégico (online)</title>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#1F3A5F; --navy-d:#162a45; --accent:#2E8BC0; --gold:#E6A817;
  --bg:#f4f6f9; --card:#fff; --line:#e4e8ee; --text:#22303f; --muted:#6b7a8d;
  --green:#2e9e6b; --red:#d9534f; --amber:#e6a817;
  --radius:12px; --shadow:0 1px 3px rgba(20,40,70,.08),0 4px 16px rgba(20,40,70,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.hidden{display:none!important}
a{color:var(--accent)}
code{background:#eef2f7;padding:1px 6px;border-radius:5px;font-size:.85em}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-d)}
.btn-accent{background:var(--accent);color:#fff}
.btn-light{background:#eef2f7;color:var(--navy)}.btn-light:hover{background:#e2e9f1}
.btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover{color:var(--navy)}
.btn-danger{background:#fbeaea;color:var(--red)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-block{width:100%;justify-content:center;margin-top:10px}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--accent))}
.login-card{background:#fff;border-radius:18px;padding:38px 34px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-brand{text-align:center;margin-bottom:22px}
.login-brand h1{color:var(--navy);font-size:28px;letter-spacing:2px;margin-top:10px}
.login-brand p{color:var(--muted);font-size:13px}
.logo-badge{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto}
.logo-badge.sm{width:38px;height:38px;font-size:15px;border-radius:10px}
#login-form label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
#login-form input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px}
#login-form input:focus{outline:none;border-color:var(--accent)}
.login-error{color:var(--red);font-size:13px;margin-top:10px;text-align:center}
.login-hint{margin-top:22px;padding:14px;background:#f4f6f9;border-radius:10px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7}
.link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline;margin-top:10px;width:100%}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#cdd8e6;display:flex;flex-direction:column;position:fixed;height:100vh}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand strong{color:#fff;display:block;font-size:16px;letter-spacing:1px}
.sidebar-brand span{font-size:11px;color:#8fa3bd}
#nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6f86a3;margin:16px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:8px;cursor:pointer;color:#cdd8e6;font-size:13.5px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .ico{width:18px;text-align:center}
.sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.user-chip{font-size:12.5px}.user-chip strong{color:#fff;display:block}
.user-chip span{color:#8fa3bd;font-size:11px}
.content{flex:1;margin-left:248px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h2{font-size:19px;color:var(--navy)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.role-badge{background:#eef2f7;color:var(--navy);padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700}
.view{padding:26px 28px;max-width:1180px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.stat .label{font-size:12px;color:var(--muted);font-weight:600}
.stat .value{font-size:28px;font-weight:800;color:var(--navy);margin-top:4px}
.stat .sub{font-size:11.5px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:20px}
.card h3{color:var(--navy);font-size:16px;margin-bottom:4px}
.card .desc{color:var(--muted);font-size:13px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}.sidebar{width:64px}.content{margin-left:64px}.sidebar-brand span,.sidebar-brand strong,.nav-item span:not(.ico),.nav-section,.user-chip{display:none}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#f7f9fc;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafbfd}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-head h3{color:var(--navy);font-size:17px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill-green{background:#e3f3ec;color:var(--green)}.pill-amber{background:#fcf3da;color:#b9860f}
.pill-red{background:#fbeaea;color:var(--red)}.pill-blue{background:#e6f1f8;color:var(--accent)}.pill-gray{background:#eef2f7;color:var(--muted)}
.swot-Força{border-left:4px solid var(--green)}
.swot-Fraqueza{border-left:4px solid var(--red)}
.swot-Oportunidade{border-left:4px solid var(--accent)}
.swot-Ameaça{border-left:4px solid var(--gold)}
.progress{background:#eef2f7;border-radius:20px;height:8px;overflow:hidden;min-width:90px}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:20px}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,30,45,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:14px;width:560px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{color:var(--navy)}
.modal-x{background:none;border:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.bsc-row{display:grid;grid-template-columns:210px 1fr;gap:14px;margin-bottom:14px;align-items:stretch}
.bsc-persp{color:#fff;border-radius:10px;padding:14px;font-weight:700;font-size:14px;display:flex;align-items:center}
.bsc-objs{display:flex;flex-wrap:wrap;gap:10px}
.bsc-obj{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;flex:1;min-width:200px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
.bsc-obj b{color:var(--navy);font-size:13.5px}
.bsc-obj ul{margin:8px 0 0 16px;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:90;font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
.philo-box{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;border-radius:14px;padding:26px;margin-bottom:20px}
.philo-box h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.8}
.philo-box p{font-size:17px;margin-top:6px;font-weight:500}
.value-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.value-item{background:#fff;border-radius:10px;padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--gold)}
.value-item b{color:var(--navy)}.value-item p{color:var(--muted);font-size:12.5px;margin-top:4px}
.inline-actions{display:flex;gap:6px;flex-wrap:wrap}
.gut-num{font-weight:800;color:var(--navy)}
.dept-card{border-left:4px solid var(--accent)}
.dept-sub{margin-top:14px}
.dept-sub h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;flex-direction:column;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin:0 6px 6px 0;font-size:12.5px}
.chip b{color:var(--navy)}.chip span{color:var(--muted);font-size:11px}
.chip-row{display:flex;flex-wrap:wrap}
.wk-input{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.wk-input:focus{outline:none;border-color:var(--accent)}
.color-dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:middle}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:42px!important}
.pass-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:var(--muted);padding:4px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#cdd8e6;display:inline-block;vertical-align:middle}
.avatar.lg{width:96px;height:96px}
.avatar-fallback{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;font-weight:800}
.q-group{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.q-head{background:var(--navy);color:#fff;padding:10px 14px;font-weight:700;font-size:13.5px}
.m-head{background:#eef2f7;color:var(--navy);padding:7px 14px;font-weight:700;font-size:12.5px}
.toggle-group{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle-group button{border:none;background:#fff;padding:7px 14px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.toggle-group button.active{background:var(--accent);color:#fff}
.wk-card{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.wk-card:hover{border-color:var(--accent);background:#fafbfd}
.wk-card .wk-meta{font-size:12px;color:var(--muted)}
.tag-ok{color:var(--green);font-weight:700}.tag-no{color:var(--red);font-weight:700}
.owner-chip{display:inline-block;background:#e6f1f8;color:var(--accent);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;margin:0 4px 4px 0}
.check-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.check-list label{display:flex;align-items:center;gap:8px;padding:6px;font-weight:500;cursor:pointer}
.check-list input{width:auto}
.goal-select{width:100%;font-size:14px}
.goal-full{font-weight:600;color:var(--navy);margin-top:10px;font-size:14.5px;line-height:1.4}
.ms-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line)}
.ms-row input[type=checkbox]{width:auto}
.ms-row.done label{text-decoration:line-through;color:var(--muted)}
.ms-row label{flex:1;cursor:pointer}
.ms-add{display:flex;gap:8px;margin-top:10px}
.ms-add input{flex:1}
.sidebar{transition:transform .2s ease}
.content{transition:margin-left .2s ease}
body.nav-collapsed .sidebar{transform:translateX(-100%)}
body.nav-collapsed .content{margin-left:0}
.topbar-left{display:flex;align-items:center;gap:12px}
#nav-toggle{font-size:16px;line-height:1;padding:7px 11px}
/* Organograma */
.org-chart{padding:10px 0;text-align:center;overflow-x:auto}
.org-node{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 16px;display:inline-block}
.org-company{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;border:none;min-width:240px}
.org-company b{font-size:16px}.org-company span{display:block;font-size:11.5px;opacity:.85}
.org-trunk{width:2px;height:22px;background:var(--line);margin:0 auto}
.org-cols{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:22px}
.org-branch{position:relative}
.org-branch::before{content:'';position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--line)}
.org-dept{border-top:4px solid var(--accent);min-width:210px;max-width:250px;text-align:left;vertical-align:top}
.org-dept b{color:var(--navy);font-size:14px}.org-dept>span{display:block;color:var(--muted);font-size:11.5px;margin-bottom:8px}
.org-people{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.org-person{background:#f7f9fc;border-radius:7px;padding:6px 9px}
.org-person b{color:var(--navy);font-size:12.5px}.org-person span{color:var(--muted);font-size:11px;display:block}
.org-procs{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.org-proc{background:#eef2f7;color:var(--navy);border-radius:6px;padding:2px 7px;font-size:10.5px}
.org-tree{list-style:none;margin:6px 0 0;padding-left:18px;border-left:2px solid var(--line)}
.org-tree li{margin:6px 0}
.org-person2{display:inline-block;background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:6px 10px;border-left:3px solid var(--accent)}
.org-person2 b{color:var(--navy);font-size:12.5px} .org-person2 span{display:block;color:var(--muted);font-size:11px}
.org-imgwrap{text-align:center;padding:10px} .org-imgwrap img{max-width:100%;border:1px solid var(--line);border-radius:10px}
.stk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stk-q{border:1px solid var(--line);border-radius:10px;padding:12px;min-height:130px}
.stk-q h4{margin:0;color:var(--navy);font-size:13.5px} .stk-q .sub{color:var(--muted);font-size:11px;margin:2px 0 8px}
.stk-chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 9px;font-size:11.5px;margin:0 4px 4px 0}
.stk-q.q-key{background:#eaf6ef;border-color:var(--green)}
.stk-q.q-sat{background:#eaf1f8;border-color:var(--accent)}
.stk-q.q-inf{background:#fcf6e6;border-color:var(--gold)}
.stk-q.q-mon{background:#f7f9fc}
.bmc-wrap{overflow-x:auto}
.bmc{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;min-width:860px}
.bmc-block{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;font-size:11.5px}
.bmc-block h5{margin:0 0 5px;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);padding-bottom:3px}
.bmc-block ul{margin:0;padding-left:15px} .bmc-block li{margin:3px 0;line-height:1.35}
.bmc-block.bmc-pp{background:#eaf1f8;border-color:var(--accent)}
.diag-q{padding:9px 0;border-bottom:1px solid var(--line)}
.diag-ql{font-weight:500;margin-bottom:6px;font-size:13.5px}
.diag-q .scale{display:flex;gap:6px;flex-wrap:wrap}
.diag-q .opt{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 0;min-width:38px;cursor:pointer;font-weight:600;color:var(--navy)}
.diag-q .opt:hover{border-color:var(--accent)} .diag-q .opt input{margin-bottom:2px}
.wk-grid{min-width:520px}
.wk-grid th,.wk-grid td{text-align:center;white-space:nowrap}
.wk-grid th:first-child,.wk-grid td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.wk-grid thead th{cursor:default}
.wk-grid thead th.wk-col{cursor:pointer;color:var(--accent)}
.wk-grid thead th.wk-col:hover{text-decoration:underline}
.wk-grid .wk-total{background:#f7f9fc;font-weight:700}
.ind-key{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
.ind-group{background:#eef2f7;padding:10px 16px;font-size:13px;color:var(--muted)}
.ind-group b{color:var(--navy)} .ind-group span{color:var(--muted);margin:0 2px}
.ind-table{width:100%;border-collapse:collapse;font-size:12px}
.ind-table th{background:#fff;text-align:center;padding:7px 6px;font-size:11px;color:var(--muted)}
.ind-table td{text-align:center;padding:5px 6px;border-bottom:1px solid var(--line)}
.ind-table .ind-name{text-align:left;min-width:220px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--navy);font-weight:500}
.ind-cell{display:inline-block;width:24px;height:16px;border-radius:3px}
</style>
</head>
<body>
  <div id="boot" class="loading">Conectando…</div>

  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo-badge">DX</div>
        <h1>DAEXE</h1>
        <p>Sistema de Planejamento Estratégico</p>
      </div>
      <form id="login-form">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com.br" required />
        <label>Senha</label>
        <div class="pass-wrap">
          <input type="password" id="login-password" placeholder="••••••••" required />
          <button type="button" class="pass-eye" id="toggle-pass" title="Mostrar/ocultar senha" aria-label="Mostrar ou ocultar senha">👁</button>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <button type="button" class="link-btn" onclick="App.forgotPassword()">Esqueci minha senha</button>
        <p id="login-error" class="login-error"></p>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand" id="sidebar-brand">
        <div class="logo-badge sm">DX</div>
        <div><strong id="brand-name">DAEXE</strong><span>Planejamento</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="user-chip" class="user-chip"></div>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Sair</button>
      </div>
    </aside>
    <main class="content">
      <header class="topbar">
        <div class="topbar-left">
          <button id="nav-toggle" class="btn btn-light btn-sm" title="Esconder/mostrar menu" aria-label="Esconder ou mostrar o menu">☰</button>
          <h2 id="page-title">Painel</h2>
        </div>
        <div class="topbar-actions">
          <span id="role-badge" class="role-badge"></span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head"><h3 id="modal-title"></h3><button onclick="App.closeModal()" class="modal-x">×</button></div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  App_orgImg = (input) => { const file=input.files&&input.files[0]; if(!file) return; resizeOrgImg(file, async (data)=>{ try{ const { error }=await sb.from('organizations').update({org_chart_image:data}).eq('id',me.org_id); if(error) throw error; me.org_chart_image=data; toast('Imagem salva'); go('organograma'); }catch(e){ toast(e.message); } }); };

  function resizeOrgImg(file, cb){
    const reader=new FileReader();
    reader.onload=()=>{ const img=new Image(); img.onload=()=>{ const maxW=1100,maxH=1500; let w=img.width,h=img.height; const r=Math.min(maxW/w,maxH/h,1); w=Math.round(w*r); h=Math.round(h*r); const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.82)); }; img.src=reader.result; };
    reader.readAsDataURL(file);
  }

  VIEWS.swot = async (v) => {
    const [rows, depts] = await Promise.all([tList('swot_items'), tList('departments','ord')]);
    window.__depts=depts;
    const view = window.__swotView==null ? 'geral' : window.__swotView; window.__swotView=view;
    const now=new Date();
    const yr = window.__swotYear || now.getFullYear(); window.__swotYear=yr;
    const qt = window.__swotQuarter || (Math.floor(now.getMonth()/3)+1); window.__swotQuarter=qt;
    rows.forEach(r=>r.gut=r.gravidade*r.urgencia*r.tendencia);
    const inView=(r)=> (view==='geral' ? (r.department_id==null) : (r.department_id==Number(view))) && (r.year==yr && r.quarter==qt);
    const items=rows.filter(inView);
    const group=(cls)=>items.filter(r=>r.classification===cls).sort((a,b)=>b.gut-a.gut);
    const tbl=(cls)=>`<div class="card swot-${cls}"><div class="section-head"><h3>${cls}s</h3></div>
      <table><thead><tr><th>Item</th><th title="${(cls==='Força'||cls==='Oportunidade')?'Impacto':'Gravidade'}">${(cls==='Força'||cls==='Oportunidade')?'I':'G'}</th><th title="Urgência">U</th><th title="Tendência">T</th><th>${(cls==='Força'||cls==='Oportunidade')?'IUT':'GUT'}</th>${can('contributor')?'<th></th>':''}</tr></thead><tbody>
      ${group(cls).length?group(cls).map(r=>`<tr><td>${esc(r.item)}</td><td>${r.gravidade}</td><td>${r.urgencia}</td><td>${r.tendencia}</td><td class="gut-num">${r.gut}</td>
        ${can('contributor')?`<td>${actionsCol(`App.editSwot(${JSON.stringify(r).replace(/"/g,'&quot;')})`,`App.delSwot(${r.id})`)}</td>`:''}</tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhum item</td></tr>`}
      </tbody></table></div>`;
    const viewLabel = view==='geral'?'Geral da organização':((depts.find(d=>d.id==view)||{}).name||'');
    const yopts=[]; for(let y=yr-3;y<=yr+2;y++) yopts.push(y);
    v.innerHTML=`<div class="card"><div class="section-head"><div><h3>Análise SWOT — priorização GUT (Gravidade/Impacto × Urgência × Tendência)</h3>
        <p class="desc">SWOT por período (mantém histórico) — geral da organização e/ou por departamento.</p></div>
        ${can('contributor')?`<button class="btn btn-accent" onclick="App.editSwot()">+ Novo item</button>`:''}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div class="field" style="margin:0;min-width:240px"><label>Visão da SWOT</label>
          <select onchange="App.swotSetView(this.value)"><option value="geral" ${view==='geral'?'selected':''}>Geral da organização</option>${depts.map(d=>`<option value="${d.id}" ${view==d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
        <div class="field" style="margin:0;min-width:110px"><label>Ano</label><select onchange="App.swotSetPeriod('y',this.value)">${yopts.map(y=>`<option value="${y}" ${y==yr?'selected':''}>${y}</option>`).join('')}</select></div>
        <div class="field" style="margin:0;min-width:120px"><label>Trimestre</label><select onchange="App.swotSetPeriod('q',this.value)">${[1,2,3,4].map(q=>`<option value="${q}" ${q==qt?'selected':''}>T${q}</option>`).join('')}</select></div>
        ${can('contributor')&&!items.length?`<button class="btn btn-light btn-sm" onclick="App.swotCopyPrev()">Copiar do trimestre anterior</button>`:''}</div>
      <p class="desc" style="margin:10px 0 0">Mostrando: <b>${esc(viewLabel)}</b> · T${qt} ${yr} · ${items.length} itens</p></div>
      <div class="grid-2">${tbl('Força')}${tbl('Fraqueza')}${tbl('Oportunidade')}${tbl('Ameaça')}</div>`;
  };
  App_swotSetView = (val) => { window.__swotView = (val==='geral'?'geral':Number(val)); go('swot'); };
  App_swotSetPeriod = (k,val) => { if(k==='y') window.__swotYear=+val; else window.__swotQuarter=+val; go('swot'); };
  App_swotCopyPrev = async () => {
    const view=window.__swotView, yr=window.__swotYear, qt=window.__swotQuarter;

    const { data:prev } = await sb.from('swot_items').select('*').eq('year',py).eq('quarter',pq);

    const inQ=(p,i)=>{ if(p>=3&&i>=3) return 'key'; if(p>=3&&i<3) return 'sat'; if(p<3&&i>=3) return 'inf'; return 'mon'; };

    const matrix = `<div class="card"><div class="section-head"><div><h3>Matriz Poder × Interesse</h3><p class="desc">Eixo vertical: Poder/Influência · horizontal: Interesse. Estratégia de engajamento por quadrante (modelo de Mendelow).</p></div>${can('contributor')?`<button class="btn btn-accent" onclick="App.editStk()">+ Stakeholder</button>`:''}</div>

        <div class="stk-q q-mon"><h4>Monitorar</h4><div class="sub">Baixo poder · baixo interesse</div>${chips(q('mon'))}</div>
        <div class="stk-q q-inf"><h4>Manter informado</h4><div class="sub">Baixo poder · alto interesse</div>${chips(q('inf'))}</div>
      </div>
      <div style="text-align:right;font-size:11px;color:var(--muted);margin-top:4px">Maior INTERESSE ▶</div></div>`;
    const table = `<div class="card"><div class="section-head"><h3>Lista de stakeholders (${rows.length})</h3></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Stakeholder</th><th>Grupo</th><th>Poder</th><th>Interesse</th><th>Estratégia</th>${can('contributor')?'<th></th>':''}</tr></thead><tbody>
      ${rows.length?rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td style="font-size:12px">${esc(r.grupo||'')}</td><td>${lvl(r.power)}</td><td>${lvl(r.interest)}</td><td>${esc(strat(r.power,r.interest))}</td>
        ${can('contributor')?`<td>${actionsCol(`App.editStk(${JSON.stringify(r).replace(/"/g,'&quot;')})`,`App.delStk(${r.id})`)}</td>`:''}</tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhum stakeholder cadastrado.</td></tr>`}
      </tbody></table></div></div>`;
    v.innerHTML = matrix + table;
  };
  App_editStk = (r={}) => {

  /* ---------- Canvas de Negócio ---------- */

  /* ---------- Diagnóstico 360 ---------- */
  const DIAG_AREAS=['Estratégia e Planejamento','Liderança e Governança','Comercial e Marketing','Clientes e Atendimento','Financeiro','Processos e Operações','Pessoas e Cultura','Tecnologia e Inovação'];
  const DIAG_DEFAULT=[
    ['Estratégia e Planejamento','Temos missão, visão, valores e objetivos estratégicos definidos e conhecidos pela equipe.'],
    ['Estratégia e Planejamento','Acompanhamos indicadores e metas periodicamente em reuniões de gestão.'],
    ['Estratégia e Planejamento','Revisamos a estratégia considerando o mercado e a concorrência.'],
    ['Liderança e Governança','Papéis, responsabilidades e alçadas de decisão estão claros.'],
    ['Liderança e Governança','As decisões são tomadas com base em dados e em rotina de reuniões.'],
    ['Liderança e Governança','Existem políticas, controles e transparência (governança).'],
    ['Comercial e Marketing','Temos um processo de vendas e funil estruturado.'],
    ['Comercial e Marketing','Acompanhamos indicadores comerciais (conversão, CAC, ticket médio).'],
    ['Comercial e Marketing','Temos posicionamento de marca e ações de marketing planejadas.'],
    ['Clientes e Atendimento','Medimos a satisfação dos clientes (NPS ou pesquisas).'],
    ['Clientes e Atendimento','Temos processo estruturado de pós-venda e relacionamento.'],
    ['Clientes e Atendimento','Tratamos reclamações e usamos o feedback para melhorar.'],
    ['Financeiro','Separamos contas PF e PJ e mantemos o fluxo de caixa atualizado.'],
    ['Financeiro','Conhecemos a margem, os custos e o ponto de equilíbrio do negócio.'],
    ['Financeiro','Fazemos planejamento e controle orçamentário.'],
    ['Processos e Operações','Os processos críticos estão mapeados e padronizados (POPs).'],
    ['Processos e Operações','Medimos produtividade, prazos e qualidade das entregas.'],
    ['Processos e Operações','Buscamos melhoria contínua e redução de retrabalho.'],
    ['Pessoas e Cultura','Temos descrições de cargo, metas e avaliações de desempenho.'],
    ['Pessoas e Cultura','Há plano de desenvolvimento e capacitação da equipe.'],
    ['Pessoas e Cultura','A cultura e o clima organizacional são acompanhados e valorizados.'],
    ['Tecnologia e Inovação','Usamos sistemas e ferramentas adequados para gerir o negócio.'],
    ['Tecnologia e Inovação','Os dados são integrados e usados para a tomada de decisão.'],
    ['Tecnologia e Inovação','Há abertura e processos estruturados para inovação.']
  ];
  const diagLevel=(m)=> m>=4?'Avançado':(m>=2.5?'Intermediário':'Básico');
  VIEWS.diag = async (v) => {
    const tab = window.__diagTab||'responder'; window.__diagTab=tab;
    const year = window.__diagPeriod || new Date().getFullYear(); window.__diagPeriod=year;
    const [qs, resp] = await Promise.all([ tList('diag_questions','ord'),
      sb.from('diag_responses').select('*').eq('period',String(year)).then(r=>r.data||[]) ]);
    const yopts=[]; for(let y=year-2;y<=year+2;y++) yopts.push(y);
    const byArea=(a)=>qs.filter(q=>q.area===a);
    const tabs=`<div class="toggle-group"><button class="${tab==='responder'?'active':''}" onclick="App.diagTab('responder')">Responder</button>${can('manager')?`<button class="${tab==='resultados'?'active':''}" onclick="App.diagTab('resultados')">Resultados</button>`:''}${can('admin')?`<button class="${tab==='perguntas'?'active':''}" onclick="App.diagTab('perguntas')">Perguntas</button>`:''}</div>`;
    const headerCard=`<div class="card"><div class="section-head"><div><h3>Diagnóstico 360</h3><p class="desc">Maturidade da gestão por área (escala 1 a 5). Vários respondentes — a média forma o radar.</p></div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">${tabs}<div class="field" style="margin:0;min-width:100px"><label>Período</label><select onchange="App.diagSetPeriod(this.value)">${yopts.map(y=>`<option value="${y}" ${y==year?'selected':''}>${y}</option>`).join('')}</select></div></div></div></div>`;
    if(!qs.length){ v.innerHTML = headerCard + `<div class="card"><p class="desc">Ainda não há perguntas cadastradas para esta organização.</p>${can('admin')?`<button class="btn btn-accent btn-sm" onclick="App.diagSeedDefault()">Carregar perguntas padrão</button>`:''}</div>`; return; }
    if(tab==='responder'){
      const mine={}; resp.filter(r=>r.respondent===me.id).forEach(r=>mine[r.question_id]=r.score);
      const body = DIAG_AREAS.filter(a=>byArea(a).length).map(a=>`<div class="card"><div class="section-head"><h3 style="font-size:15px">${esc(a)}</h3></div>
        ${byArea(a).map(q=>`<div class="diag-q"><div class="diag-ql">${esc(q.question)}</div><div class="scale">${[1,2,3,4,5].map(n=>`<label class="opt"><input type="radio" name="dq-${q.id}" value="${n}" ${mine[q.id]==n?'checked':''}><span>${n}</span></label>`).join('')}</div></div>`).join('')}</div>`).join('');
      v.innerHTML = headerCard + `<div class="card"><p class="desc" style="margin:0">Escala: <b>1</b> Não fazemos · <b>2</b> Início/informal · <b>3</b> Parcial · <b>4</b> Estruturado · <b>5</b> Otimizado</p></div>${body}<div style="max-width:760px"><button class="btn btn-primary btn-block" onclick="App.diagSaveMine()">Salvar minhas respostas</button></div>`;
    } else if(tab==='resultados'){
      const areasUsadas=DIAG_AREAS.filter(a=>byArea(a).length);
      const respondents=[...new Set(resp.map(r=>r.respondent))].length;
      const avgOf=(a)=>{ const qids=byArea(a).map(q=>q.id); const sc=resp.filter(r=>qids.indexOf(r.question_id)>=0 && r.score!=null).map(r=>r.score); return sc.length? sc.reduce((x,y)=>x+y,0)/sc.length : 0; };
      const areaAvg={}; areasUsadas.forEach(a=>areaAvg[a]=avgOf(a));
      const overall = areasUsadas.length? areasUsadas.reduce((s,a)=>s+areaAvg[a],0)/areasUsadas.length : 0;
      const ranked = areasUsadas.map(a=>({a,m:areaAvg[a]})).sort((p,q2)=>p.m-q2.m);
      v.innerHTML = headerCard + `<div class="card"><div class="cards">
          <div class="stat"><div class="label">Respondentes</div><div class="value">${respondents}</div><div class="sub">no período ${year}</div></div>
          <div class="stat" style="border-color:var(--green)"><div class="label">Maturidade geral</div><div class="value">${overall.toFixed(1)}</div><div class="sub">${diagLevel(overall)}</div></div></div>
        ${respondents?'<canvas id="ch-diag" height="170"></canvas>':'<div class="empty">Nenhuma resposta registrada neste período.</div>'}</div>
        ${respondents?`<div class="card"><h3>Notas por área</h3><table><thead><tr><th>Área</th><th>Média</th><th>Nível</th></tr></thead><tbody>
        ${areasUsadas.map(a=>`<tr><td>${esc(a)}</td><td><b>${areaAvg[a].toFixed(1)}</b> / 5</td><td>${diagLevel(areaAvg[a])}</td></tr>`).join('')}</tbody></table></div>
        <div class="card"><h3>Prioridades (áreas mais frágeis)</h3><ol>${ranked.slice(0,3).map(x=>`<li><b>${esc(x.a)}</b> — média ${x.m.toFixed(1)} (${diagLevel(x.m)})</li>`).join('')}</ol><p class="desc">Considere transformar essas áreas em objetivos e iniciativas no planejamento.</p></div>`:''}`;
      if(respondents) mkChart('ch-diag','radar',{ labels:areasUsadas, datasets:[{ label:'Maturidade média', data:areasUsadas.map(a=>+areaAvg[a].toFixed(2)), borderColor:'#2E8BC0', backgroundColor:'rgba(46,139,192,.18)', pointBackgroundColor:'#1F3A5F' }] }, { scales:{ r:{ min:0, max:5, ticks:{stepSize:1} } } });
    } else {
      v.innerHTML = headerCard + `<div class="card"><div class="section-head"><h3>Banco de perguntas</h3><button class="btn btn-light btn-sm" onclick="App.diagAddQ()">+ Pergunta</button></div></div>` +
        DIAG_AREAS.filter(a=>byArea(a).length).map(a=>`<div class="card"><h3 style="font-size:14px">${esc(a)}</h3><table><tbody>
        ${byArea(a).map(q=>`<tr><td>${esc(q.question)}</td><td style="width:70px;text-align:right"><a href="#" onclick="App.diagDelQ(${q.id});return false;" style="color:var(--red)">excluir</a></td></tr>`).join('')}</tbody></table></div>`).join('');
    }
  };
  App_diagTab=(t)=>{ window.__diagTab=t; go('diag'); };
  App_diagSetPeriod=(y)=>{ window.__diagPeriod=+y; go('diag'); };
  App_diagSaveMine=async()=>{
    const year=String(window.__diagPeriod); const rows=[];
    document.querySelectorAll('input[type=radio]:checked').forEach(inp=>{ if(inp.name.indexOf('dq-')===0){ rows.push({ question_id:+inp.name.slice(3), respondent:me.id, score:+inp.value, period:year }); } });
    if(!rows.length){ toast('Responda ao menos uma pergunta.'); return; }
    const { error } = await sb.from('diag_responses').upsert(rows,{onConflict:'question_id,respondent,period'});
    if(error){ toast(error.message); return; } toast('Respostas salvas. Obrigado!'); if(can('manager')) window.__diagTab='resultados'; go('diag');
  };
  App_diagSeedDefault=async()=>{ try{ await sb.from('diag_questions').insert(DIAG_DEFAULT.map((x,i)=>({area:x[0],question:x[1],ord:i+1}))); }catch(e){return toast(e.message);} toast('Perguntas padrão carregadas'); go('diag'); };
  App_diagAddQ=()=>{ const areas=DIAG_AREAS.map(a=>({v:a,t:a})); modal('Nova pergunta', form([f.sel('dq-area','Área',areas,'Estratégia e Planejamento'),f.area('dq-text','Pergunta',''),`<button class="btn btn-primary btn-block" onclick="App.diagSaveQ()">Salvar</button>`])); };
  App_diagSaveQ=async()=>{ if(!val('dq-text')){ toast('Informe a pergunta.'); return; } try{ await tInsert('diag_questions',{area:val('dq-area'),question:val('dq-text'),ord:999}); }catch(e){return toast(e.message);} closeModal(); toast('Adicionada'); go('diag'); };
  App_diagDelQ=async(id)=>{ if(await delRow('diag_questions',id,'Excluir esta pergunta?')) go('diag'); };

  /* ---------- Curva de Valor ---------- */
  VIEWS.curva = async (v) => {
    const rows = await tList('value_curve','ord');
    const nm = me.org_name || 'Empresa';
    v.innerHTML=`<div class="card"><div class="section-head"><h3>Curva de Valor</h3>${can('manager')?`<button class="btn btn-accent btn-sm" onclick="App.editCurve()">+ Atributo</button>`:''}</div>
      <p class="desc">Comparação ${esc(nm)} × concorrência (0 a 10)</p><canvas id="ch-curve" height="120"></canvas></div>
      <div class="card"><table><thead><tr><th>Atributo</th><th>${esc(nm)}</th><th>Concorrência</th>${can('manager')?'<th></th>':''}</tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.attribute)}</td><td><b>${r.daexe_score}</b></td><td>${r.competitor_score}</td>${can('manager')?`<td>${actionsCol(`App.editCurve(${JSON.stringify(r).replace(/"/g,'&quot;')})`,`App.delCurve(${r.id})`,'manager')}</td>`:''}</tr>`).join('')}</tbody></table></div>`;
    mkChart('ch-curve','line',{labels:rows.map(r=>r.attribute),datasets:[
      {label:nm,data:rows.map(r=>r.daexe_score),borderColor:'#2E8BC0',backgroundColor:'rgba(46,139,192,.1)',tension:.3,fill:true},
      {label:'Concorrência',data:rows.map(r=>r.competitor_score),borderColor:'#E6A817',tension:.3}]},{scales:{y:{min:0,max:10}}});

  App_editCurve = (r={}) => modal(r.id?'Editar atributo':'Novo atributo', form([f.text('cv-at','Atributo',r.attribute),`<div class="field-row">${f.num('cv-d','DAEXE (0-10)',r.daexe_score)}${f.num('cv-c','Concorrência (0-10)',r.competitor_score)}</div>`,`<button class="btn btn-primary btn-block" onclick="App.saveCurve(${r.id||0})">Salvar</button>`]));
  App_saveCurve = async (id) => { const row={attribute:val('cv-at'),daexe_score:+val('cv-d'),competitor_score:+val('cv-c')}; try{ id?await tUpdate('value_curve',id,row):await tInsert('value_curve',row);}catch(e){return toast(e.message);} closeModal(); toast('Salvo'); go('curva'); };
  App_delCurve = async (id) => { if(await delRow('value_curve',id)) go('curva'); };

  /* ---------- Mapa BSC (cores por perspectiva, objetivos sem código) ---------- */

  /* ---------- Desempenho Semanal (vários anos) ---------- */
  function weeksOfYear(year){
    const weeks=[]; let d=new Date(year,0,1);
    const dow=d.getDay(); d.setDate(d.getDate()+(dow===0?1:(dow===1?0:8-dow))); // primeira segunda-feira
    let w=1;
    while(d.getFullYear()<=year && w<=53){
      const start=new Date(d), end=new Date(d); end.setDate(end.getDate()+6);
      if(start.getFullYear()>year) break;
      weeks.push({week:w,start:new Date(start),end:new Date(end)});
      d.setDate(d.getDate()+7); w++;
    }
    return weeks;
  }
  const dm=(d)=>('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
  const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  VIEWS.desempenho = async (v) => {

    const assigned=new Set((asg||[]).map(a=>a.goal_id)); window.__assigned=assigned;
    const goalId = window.__pfGoal || goals[0].id; window.__pfGoal=goalId;
    const year = window.__pfYear || new Date().getFullYear(); window.__pfYear=year;
    const mode = window.__pfMode || 'semana'; window.__pfMode=mode;
    const editable = can('manager') || assigned.has(goalId); window.__pfEditable=editable;
    const yearOpts=[]; for(let y=year-2;y<=year+4;y++) yearOpts.push(y);
    const { data:rows } = await sb.from('goal_weekly').select('*').eq('goal_id',goalId).eq('year',year);
    const map={}; (rows||[]).forEach(r=>map[r.week]=r); window.__wkMap=map;
    const weeks=weeksOfYear(year);
    const totMeta=(rows||[]).reduce((a,b)=>a+(Number(b.meta)||0),0), totReal=(rows||[]).reduce((a,b)=>a+(Number(b.realizado)||0),0);
    const selGoal = goals.find(g=>g.id==goalId)||{};
    const head=`
      <div class="card"><div class="section-head"><div><h3>Preenchimento de Metas</h3>
        <p class="desc">${editable?'Clique em uma semana para preencher meta, resultado, causa e ação.':'Você pode visualizar; o preenchimento é feito pelos responsáveis desta meta.'}</p></div>
        <div class="toggle-group"><button class="${mode==='semana'?'active':''}" onclick="App.pfSetMode('semana')">Semanal</button><button class="${mode==='trimestre'?'active':''}" onclick="App.pfSetMode('trimestre')">Por trimestre</button></div></div>
        <div class="field"><label>Selecione a meta</label>
          <select class="goal-select" onchange="App.pfSetGoal(this.value)">${goals.map(g=>`<option value="${g.id}" ${g.id==goalId?'selected':''}>${assigned.has(g.id)?'★ ':''}${esc(g.smart_text)}${g.unit?' — '+esc(g.unit):''}</option>`).join('')}</select></div>
        <div class="goal-full">${selGoal.smart_text?esc(selGoal.smart_text):''} ${selGoal.year?`<span class="pill pill-gray">T${selGoal.quarter||1} ${selGoal.year}</span>`:''} ${selGoal.unit?`<span class="pill pill-gray">${esc(selGoal.unit)}</span>`:''} ${assigned.has(goalId)?'<span class="pill pill-blue">Sua meta</span>':(editable?'<span class="pill pill-gray">Edição liberada</span>':'<span class="pill pill-gray">Somente leitura</span>')}</div>
        <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:12px">
          <div class="field" style="margin-bottom:0;min-width:140px"><label>Ano</label><select onchange="App.pfSetYear(this.value)">${yearOpts.map(y=>`<option value="${y}" ${y==year?'selected':''}>${y}</option>`).join('')}</select></div>
          <div class="desc" style="margin:0 0 8px">Acumulado ${year}: meta <b>${fmtByUnit(totMeta,selGoal.unit)}</b> · realizado <b>${fmtByUnit(totReal,selGoal.unit)}</b> · atingido <b>${pct(totReal,totMeta)}%</b></div>
        </div>
      </div>`;
    if(mode==='semana'){
      const byM={};
      weeks.forEach(wk=>{ const m=wk.start.getMonth(); (byM[m]=byM[m]||[]).push(wk); });
      let html='';
      Object.keys(byM).sort((a,b)=>a-b).forEach(m=>{ const mw=byM[m];
        const mm=mw.reduce((a,wk)=>a+(Number((map[wk.week]||{}).meta)||0),0);

        html+=`<div class="q-group"><div class="m-head">${MES[m]}</div>
          <div style="overflow-x:auto"><table class="wk-grid"><thead><tr><th>Semana</th>${mw.map(wk=>`<th class="wk-col" onclick="App.openWeek(${wk.week})" title="Preencher esta semana">S${wk.week}</th>`).join('')}<th>Total do mês</th></tr></thead><tbody>

          <tr><td>Meta</td>${mw.map(wk=>cell(wk,r=>r.meta!=null?fmtByUnit(r.meta,selGoal.unit):'<span style="color:var(--muted)">—</span>')).join('')}<td class="wk-total">${fmtByUnit(mm,selGoal.unit)}</td></tr>
          <tr><td>Resultado</td>${mw.map(wk=>cell(wk,r=>r.realizado!=null?fmtByUnit(r.realizado,selGoal.unit):'<span style="color:var(--muted)">—</span>')).join('')}<td class="wk-total">${fmtByUnit(mr,selGoal.unit)}</td></tr>
          <tr><td>%</td>${mw.map(wk=>cell(wk,r=>{ const has=(r.meta!=null||r.realizado!=null); const p=pct(Number(r.realizado)||0,Number(r.meta)||0); return has?`<b class="${p>=100?'tag-ok':'tag-no'}">${p}%</b>`:''; })).join('')}<td class="wk-total">${pct(mr,mm)}%</td></tr>

      const byQ={};
      weeks.forEach(wk=>{ const m=wk.start.getMonth(); const q=Math.floor(m/3)+1; (byQ[q]=byQ[q]||{}); (byQ[q][m]=byQ[q][m]||[]).push(wk); });
      let html='';
      [1,2,3,4].forEach(q=>{ if(!byQ[q]) return; const qWeeks=Object.values(byQ[q]).reduce((a,b)=>a.concat(b),[]);
        const qm=qWeeks.reduce((a,wk)=>a+(Number((map[wk.week]||{}).meta)||0),0), qr=qWeeks.reduce((a,wk)=>a+(Number((map[wk.week]||{}).realizado)||0),0);
        html+=`<div class="q-group"><div class="q-head">${q}º Trimestre — meta ${fmtByUnit(qm,selGoal.unit)} · realizado ${fmtByUnit(qr,selGoal.unit)} · ${pct(qr,qm)}%</div>`;
        Object.keys(byQ[q]).sort((a,b)=>a-b).forEach(m=>{ const mw=byQ[q][m];
          html+=`<div class="m-head">${MES[m]}</div><table><thead><tr><th>Semana</th><th>Período</th><th>Meta</th><th>Realizado</th><th>%</th></tr></thead><tbody>`;
          mw.forEach(wk=>{ const r=map[wk.week]||{}; const p=pct(Number(r.realizado)||0,Number(r.meta)||0);
            html+=`<tr onclick="App.openWeek(${wk.week})" style="cursor:pointer"><td><b>S${wk.week}</b></td><td style="font-size:12px;color:var(--muted)">${dm(wk.start)}–${dm(wk.end)}</td><td>${fmtByUnit(r.meta||0,selGoal.unit)}</td><td>${fmtByUnit(r.realizado||0,selGoal.unit)}</td><td>${p}%</td></tr>`; });
          html+='</tbody></table>';
        });
        html+='</div>';
      });
      v.innerHTML = head + `<div class="card">${html||'<div class="empty">Sem semanas</div>'}</div>`;
    }
  };

  function currentWeekOf(year){
    const today=new Date(); const ws=weeksOfYear(year);
    const wk=ws.find(w=> today>=w.start && today<=w.end);
    return wk?wk.week:(today.getFullYear()>year?ws.length:1);
  }

      </div>
      ${f.text('pf-name','Nome',p.name)}
      <div class="field-row">${f.text('pf-title','Cargo',p.title)}${f.text('pf-phone','Telefone',p.phone)}</div>

      <div class="field"><label>E-mail</label><input value="${esc(p.email||'')}" disabled></div>
      <button class="btn btn-primary btn-block" onclick="App.saveProfile()">Salvar</button>
    </div>`;
    document.getElementById('pf-file').addEventListener('change',(e)=>{ const file=e.target.files[0]; if(!file) return; resizeAvatar(file,(d)=>{ window.__newAvatar=d; document.getElementById('pf-avatar-wrap').innerHTML=`<img src="${d}" class="avatar lg">`; }); });
  };
  function resizeAvatar(file, cb){
    const reader=new FileReader();
    reader.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=256, min=Math.min(img.width,img.height); const c=document.createElement('canvas'); c.width=s;c.height=s; c.getContext('2d').drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,s,s); cb(c.toDataURL('image/jpeg',0.85)); }; img.src=reader.result; };
    reader.readAsDataURL(file);
  }

  /* ---------- Exportações ---------- */
  async function exportFile(type){ if(!can('admin')){ toast('Exportação disponível apenas para administradores.'); return; } try{ if(type==='excel') await exportExcel(); else await exportPdf(); }catch(e){ toast(e.message); } }
  async function loadAll(){
    const [company,values,depts,procs,mems,persp,objs,goals,inis,swot,curve,weekly]=await Promise.all([
      sb.from('company').select('*').limit(1).single().then(r=>r.data),
      tList('company_values','ord'),tList('departments','ord'),tList('department_processes','ord'),tList('department_members','ord'),
      tList('bsc_perspectives','ord'),tList('objectives','ord'),tList('goals'),tList('initiatives','ord'),tList('swot_items'),
      tList('value_curve','ord'),tList('goal_weekly')]);
    return {company,values,depts,procs,mems,persp,objs,goals,inis,swot,curve,weekly};
  }
  async function exportExcel(){
    toast('Gerando Excel…'); const D=await loadAll();
    const objT=(id)=>{const o=D.objs.find(x=>x.id===id);return o?o.title:'';};
    const goalT=(id)=>{const g=D.goals.find(x=>x.id===id);return g?g.smart_text:'';};
    const wb=XLSX.utils.book_new(); const add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
    const c=D.company;
    add('Empresa',[['Campo','Valor'],['Empresa',c.name],['Missão',c.mission],['Visão',c.vision],['Vigência',`${c.plan_start} a ${c.plan_end}`],['Posicionamento',c.positioning]]);
    add('Valores',[['Valor','Descrição'],...D.values.map(v=>[v.title,v.description])]);
    add('Departamentos',[['Departamento','Atuação'],...D.depts.map(d=>[d.name,d.atuacao])]);
    add('Macroprocessos',[['Departamento','Macroprocesso','Descrição'],...D.procs.map(p=>[(D.depts.find(d=>d.id===p.department_id)||{}).name||'',p.name,p.description])]);
    add('Responsáveis',[['Departamento','Nome','Cargo'],...D.mems.map(m=>[(D.depts.find(d=>d.id===m.department_id)||{}).name||'',m.name,m.cargo])]);
    add('SWOT (GUT)',[['Classificação','Item','Departamento','G','U','T','GUT'],...D.swot.map(s=>[s.classification,s.item,(D.depts.find(d=>d.id===s.department_id)||{}).name||'Geral',s.gravidade,s.urgencia,s.tendencia,s.gravidade*s.urgencia*s.tendencia])]);
    add('Curva de Valor',[['Atributo',(c.name||'Empresa'),'Concorrência'],...D.curve.map(r=>[r.attribute,r.daexe_score,r.competitor_score])]);
    add('Objetivos e Metas',[['Objetivo','Meta SMART','Unidade','Ano','Trimestre'],...D.goals.map(g=>[objT(g.objective_id),g.smart_text,g.unit||'',g.year,g.quarter])]);
    add('Iniciativas 5W2H',[['Quê','Quem','Início','Fim','Como','Quanto','Onde','Porquê','Medida','Status','Progresso %'],...D.inis.map(i=>[i.name,i.who,i.date_start,i.date_end,i.how,i.how_much,i.where_,i.why,i.measure,i.status,i.progress])]);
    const goalUnit=(id)=>{const g=D.goals.find(x=>x.id===id);return g?(g.unit||''):'';};
    add('Desempenho Semanal',[['Meta','Unidade','Ano','Semana','Meta (alvo)','Realizado','% Atingido','Causa','Ação'],...D.weekly.map(w=>[goalT(w.goal_id),goalUnit(w.goal_id),w.year,w.week,w.meta,w.realizado,pct(Number(w.realizado),Number(w.meta)),w.causa,w.acao])]);
    XLSX.writeFile(wb,'Planejamento_DAEXE.xlsx');
  }
  async function exportPdf(){
    toast('Gerando PDF…'); const D=await loadAll();
    const objT=(id)=>{const o=D.objs.find(x=>x.id===id);return o?o.title:'';};
    const row=(cells,h)=>'<tr>'+cells.map(x=>`<${h||'td'}>${x==null?'':x}</${h||'td'}>`).join('')+'</tr>';
    const tbl=(head,rows)=>`<table><thead>${row(head,'th')}</thead><tbody>${rows.map(r=>row(r)).join('')}</tbody></table>`;
    const c=D.company;
    const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Planejamento ${esc(c.name||'')}</title>
      <style>body{font-family:'Segoe UI',Arial,sans-serif;color:#22303f;padding:24px;font-size:12px}h1{color:#1F3A5F;border-bottom:3px solid #2E8BC0;padding-bottom:6px}h2{color:#1F3A5F;margin-top:22px;font-size:15px}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}th{background:#1F3A5F;color:#fff;text-align:left;padding:6px 8px}td{border-bottom:1px solid #e4e8ee;padding:5px 8px}.meta{color:#6b7a8d}</style></head><body>
      <h1>${esc(c.name||'Planejamento')} · Planejamento Estratégico</h1><p class="meta">${esc(c.positioning||'')} — vigência ${esc(c.plan_start||'')} a ${esc(c.plan_end||'')}</p>
      <h2>Filosofia</h2>${tbl(['Campo','Valor'],[['Missão',esc(c.mission)],['Visão',esc(c.vision)]])}
      <h2>Valores</h2>${tbl(['Valor','Descrição'],D.values.map(v=>[esc(v.title),esc(v.description)]))}
      <h2>Departamentos</h2>${tbl(['Departamento','Atuação'],D.depts.map(d=>[esc(d.name),esc(d.atuacao)]))}
      <h2>SWOT (GUT)</h2>${tbl(['Classificação','Item','GUT'],D.swot.slice().sort((a,b)=>(b.gravidade*b.urgencia*b.tendencia)-(a.gravidade*a.urgencia*a.tendencia)).map(s=>[esc(s.classification),esc(s.item),s.gravidade*s.urgencia*s.tendencia]))}
      <h2>Objetivos e Metas</h2>${tbl(['Objetivo','Meta SMART','Período'],D.goals.map(g=>[esc(objT(g.objective_id)),esc(g.smart_text),'T'+(g.quarter||'')+' '+(g.year||'')]))}
      <h2>Iniciativas</h2>${tbl(['Iniciativa','Objetivo'],D.inis.map(i=>[esc(i.name),esc(objT(i.objective_id))]))}
      <script>window.onload=function(){window.print();}<\/script></body></html>`;
    const w=window.open('','_blank'); if(!w){ toast('Permita pop-ups para gerar o PDF'); return; } w.document.write(html); w.document.close();
  }

  ['forgotPassword','dashSetGoal','editValue','saveValue','delValue','editCompany','saveCompany','editDept','saveDept','delDept',
   'editProc','saveProc','delProc','editProcOwner','saveProcOwner','delProcOwner','editMember','saveMember','delMember','orgSetMode','orgToggleDept','orgImg','orgImgDel','editSwot','saveSwot','delSwot','swotSetView','swotSetPeriod','swotCopyPrev','editPestel','savePestel','delPestel','editStk','saveStk','delStk','canvasSetMode','editCanvas','saveCanvas','delCanvas','diagTab','diagSetPeriod','diagSaveMine','diagSeedDefault','diagAddQ','diagSaveQ','diagDelQ',
   'editCurve','saveCurve','delCurve','editPersp','savePersp','delPersp','editObj','saveObj','delObj','editGoal','saveGoal','delGoal',
   'editIni','saveIni','delIni','editAction','saveAction','delAction','manageMs','addMs','toggleMs','delMs','manageOwners','saveOwners','manageIniOwners','saveIniOwners','pfSetGoal','pfSetYear','pfSetMode','openWeek','saveWeekPopup',
   'diYear','diWeek','diScope','openActWeek','saveActWeek',
   'indSetYear','indSetMode','indGoto','editUser','saveUser','inviteUser','doInvite','newNotif','notifToggleTarget','sendNotif','saveProfile','saveBranding','sendFeedback','fbSetStatus','delFb']
   .forEach(n=>{ pub[n]=(...a)=>eval('App_'+n)(...a); });
  return Object.assign(pub,{ init });
})();
function startApp(){
  if (typeof supabase === 'undefined' || !supabase.createClient) return false;
  try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){ return false; }
  App.init();
  return true;
}
function loadSbFallback(){
  if (window.__sbFb) return; window.__sbFb = true;
  var s=document.createElement('script');
  s.src='https://unpkg.com/@supabase/supabase-js@2';
  s.onerror=function(){ var s2=document.createElement('script'); s2.src='https://esm.sh/@supabase/supabase-js@2?bundle&target=es2019&exports=createClient'; document.head.appendChild(s2); };
  document.head.appendChild(s);
}
window.addEventListener('DOMContentLoaded', function(){
  var tries=0;
  (function wait(){
    if (startApp()) return;
    if (tries===20) loadSbFallback();
    if (++tries > 150){ var b=document.getElementById('boot'); if(b) b.innerHTML='Nao foi possivel carregar a biblioteca de conexao.<br>Tente recarregar a pagina (F5). Se persistir, tente em outra rede ou navegador.'; return; }
    setTimeout(wait, 200);
  })();
});
