<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cultura & Desempenho · DAEXE</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --marca:#1F3A5F; --marca-2:#2A4E7D; --marca-claro:#E8EEF6;
    --fundo:#F5F6F8; --superficie:#FFFFFF; --borda:#E2E5EA; --borda-forte:#CBD1D9;
    --tinta:#1A2230; --tinta-2:#4B5563; --tinta-3:#6B7280;
    --s-atual:#1D6FD1; --s-desejado:#D97706;
    --ok:#15803D; --ok-bg:#E7F6EC; --atencao:#A16207; --atencao-bg:#FEF6D8; --critico:#B91C1C; --critico-bg:#FDECEC;
    --raio:10px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--fundo); color:var(--tinta); font-family:Inter, system-ui, Arial, sans-serif; font-size:15px; line-height:1.45; }
  button, input, select { font:inherit; }
  a { color:var(--marca-2); }
  .oculto { display:none !important; }

  /* topo */
  .topo { background:var(--marca); color:#fff; }
  .topo .in { max-width:1120px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .marca { font-weight:700; letter-spacing:.2px; font-size:17px; }
  .marca small { font-weight:500; opacity:.75; margin-left:6px; font-size:13px; }
  nav.abas { display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
  nav.abas button { background:transparent; color:#fff; border:0; padding:8px 12px; border-radius:7px; cursor:pointer; opacity:.8; font-weight:500; }
  nav.abas button:hover { opacity:1; background:rgba(255,255,255,.08); }
  nav.abas button.ativa { opacity:1; background:rgba(255,255,255,.16); }
  .sair { background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:7px; padding:6px 10px; cursor:pointer; font-size:13px; }

  main { max-width:1120px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:16px; margin:0 0 12px; }
  .sub { color:var(--tinta-3); font-size:14px; margin:0 0 18px; }
  .card { background:var(--superficie); border:1px solid var(--borda); border-radius:var(--raio); padding:18px; margin-bottom:16px; }
  .grade { display:grid; gap:16px; margin-bottom:16px; }
  .grade > .card, .grade > div > .card:last-child { margin-bottom:0; }
  @media (min-width:860px) { .g2 { grid-template-columns:1fr 1fr; } .g3 { grid-template-columns:repeat(3,1fr); } }

  /* botões e campos */
  .btn { background:var(--marca); color:#fff; border:1px solid var(--marca); border-radius:8px; padding:9px 16px; cursor:pointer; font-weight:600; }
  .btn:hover { background:var(--marca-2); }
  .btn:disabled { background:#9CA3AF; border-color:#9CA3AF; cursor:not-allowed; }
  .btn.sec { background:#fff; color:var(--marca); border-color:var(--borda-forte); }
  .btn.sec:hover { background:var(--marca-claro); }
  .btn.perigo { background:#fff; color:var(--critico); border-color:#F3C4C4; }
  .btn.mini { padding:5px 10px; font-size:13px; font-weight:500; }
  .acoes { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  label.campo { display:block; font-size:13px; color:var(--tinta-2); font-weight:500; margin-bottom:12px; }
  label.campo input, label.campo select { display:block; width:100%; margin-top:4px; padding:9px 10px; border:1px solid var(--borda-forte); border-radius:8px; background:#fff; color:var(--tinta); }
  input:focus, select:focus, button:focus-visible { outline:2px solid var(--s-atual); outline-offset:1px; }
  .check { display:flex; gap:8px; align-items:center; font-size:14px; margin-bottom:10px; }

  /* tabelas */
  .tabela-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:600; color:var(--tinta-2); font-size:12px; text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; border-bottom:1px solid var(--borda); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid #F0F2F5; vertical-align:middle; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; }
  .tag { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .tag.ok { background:var(--ok-bg); color:var(--ok); }
  .tag.atencao { background:var(--atencao-bg); color:var(--atencao); }
  .tag.critico { background:var(--critico-bg); color:var(--critico); }
  .tag.neutro { background:#EEF0F3; color:var(--tinta-2); }

  /* KPIs */
  .kpi .rot { font-size:13px; color:var(--tinta-3); font-weight:500; }
  .kpi .val { font-size:34px; font-weight:700; letter-spacing:-.5px; color:var(--tinta); font-variant-numeric:tabular-nums; }
  .kpi .det { font-size:13px; color:var(--tinta-2); }

  /* mapa de quadrantes */
  .mapa { display:grid; grid-template-columns:28px 1fr 1fr; grid-template-rows:auto 1fr 1fr; gap:6px; }
  .mapa .eixo-x { font-size:11px; letter-spacing:.6px; color:var(--tinta-3); text-align:center; font-weight:600; }
  .mapa .eixo-y { writing-mode:vertical-rl; transform:rotate(180deg); font-size:11px; letter-spacing:.6px; color:var(--tinta-3); text-align:center; font-weight:600; }
  .quad { border:1px solid var(--borda); border-radius:10px; padding:14px; background:#FBFCFD; min-height:132px; }
  .quad .nome { font-weight:700; font-size:15px; }
  .quad .desc { font-size:12px; color:var(--tinta-3); margin-bottom:8px; }
  .quad .linha { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .quad .atual { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .quad .des { font-size:13px; color:var(--tinta-2); }
  .quad .tag { margin-top:8px; }

  /* gráficos */
  .grafico { position:relative; }
  .grafico svg { width:100%; height:auto; display:block; }
  .legenda { display:flex; gap:16px; font-size:13px; color:var(--tinta-2); margin-top:6px; flex-wrap:wrap; }
  .legenda i { display:inline-block; width:18px; height:0; border-top:2px solid; vertical-align:middle; margin-right:6px; }
  .dica { position:absolute; pointer-events:none; background:var(--tinta); color:#fff; font-size:12px; padding:6px 9px; border-radius:6px; white-space:nowrap; transform:translate(-50%, calc(-100% - 10px)); z-index:5; }
  .dica b { font-weight:600; }

  /* avisos */
  .aviso { padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:14px; }
  .aviso.info { background:var(--marca-claro); color:var(--marca); }
  .aviso.erro { background:var(--critico-bg); color:var(--critico); }
  .aviso.ok { background:var(--ok-bg); color:var(--ok); }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--tinta); color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; z-index:50; max-width:90vw; }

  /* barra de progresso */
  .barra { height:8px; background:#EEF0F3; border-radius:999px; overflow:hidden; }
  .barra > div { height:100%; background:var(--s-atual); border-radius:999px; }

  /* login e formulário */
  .centro { max-width:440px; margin:8vh auto; padding:0 16px; }
  .form-pesq { max-width:760px; margin:0 auto; padding:16px; }
  .opcao { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid #F0F2F5; }
  .opcao:first-of-type { border-top:0; }
  .opcao label { flex:1; font-size:14px; }
  .opcao input { width:78px; padding:8px; font-size:16px; text-align:center; border:1px solid var(--borda-forte); border-radius:8px; }
  .soma { margin-top:10px; padding:8px 12px; border-radius:8px; font-weight:600; font-size:14px; background:var(--critico-bg); color:var(--critico); }
  .soma.ok { background:var(--ok-bg); color:var(--ok); }
  .rodape-fixo { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--borda); padding:12px 16px; }
  .rodape-fixo .in { max-width:760px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  @media (max-width:520px) { .opcao { flex-direction:column; align-items:stretch; gap:6px; } .opcao input { width:100%; } }

  /* desempenho */
  .subabas { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--borda); margin-bottom:16px; }
  .subabas button { background:transparent; border:0; border-bottom:2px solid transparent; padding:9px 12px; cursor:pointer; color:var(--tinta-2); font-weight:500; margin-bottom:-1px; }
  .subabas button.ativa { color:var(--marca); border-bottom-color:var(--marca); font-weight:600; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--borda-forte); background:#fff; border-radius:999px; padding:5px 12px; cursor:pointer; font-size:13px; color:var(--tinta-2); }
  .chip.ativa { background:var(--marca); border-color:var(--marca); color:#fff; }
  @media (min-width:860px) { .g4 { grid-template-columns:repeat(4,1fr); } }
  @media (min-width:600px) and (max-width:859px) { .g4 { grid-template-columns:1fr 1fr; } }
  .g4 .kpi .val { font-size:30px; }
  .tag.info { background:var(--marca-claro); color:var(--s-atual); }
  .mat { display:flex; align-items:center; gap:8px; min-width:170px; }
  .mat .barra { position:relative; flex:1; overflow:visible; }
  .mat .barra i { position:absolute; left:66.7%; top:-3px; bottom:-3px; border-left:1px dashed var(--tinta-3); }
  .mat b { font-variant-numeric:tabular-nums; min-width:52px; text-align:right; font-weight:600; }
  .bar-p { height:7px; background:#EEF0F3; border-radius:999px; margin:3px 0; }
  .bar-p > div { height:100%; border-radius:999px; }
  .rot-p { font-size:12px; color:var(--tinta-3); } .val-p { font-size:24px; font-weight:700; }
  .cols { columns:2 260px; column-gap:24px; }
  .cols .check { break-inside:avoid; }
  select.filtro { padding:8px 10px; border:1px solid var(--borda-forte); border-radius:8px; background:#fff; }
  label.campo textarea { display:block; width:100%; margin-top:4px; padding:9px 10px; border:1px solid var(--borda-forte); border-radius:8px; font:inherit; resize:vertical; }
  .escala { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--tinta-2); }
  .escala b { display:inline-flex; width:22px; height:22px; border-radius:6px; background:var(--marca-claro); color:var(--marca); align-items:center; justify-content:center; margin-right:4px; }
  .item { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid #F0F2F5; }
  .item:first-of-type { border-top:0; }
  .item .txt { flex:1; font-size:14px; }
  .notas, .nps { display:flex; gap:6px; flex-wrap:wrap; }
  .nota { width:42px; height:40px; border:1px solid var(--borda-forte); background:#fff; border-radius:8px; cursor:pointer; font-weight:600; color:var(--tinta-2); }
  .nota:hover { background:var(--marca-claro); }
  .nota[aria-pressed="true"] { background:var(--marca); border-color:var(--marca); color:#fff; }
  .nps .nota { width:40px; }
  .nps-leg { display:flex; justify-content:space-between; font-size:12px; color:var(--tinta-3); margin-top:6px; max-width:480px; }
  @media (max-width:520px) { .item { flex-direction:column; align-items:stretch; } .nota { flex:1; } .nps .nota { width:auto; min-width:36px; } }

  dialog { border:0; border-radius:12px; padding:0; width:min(520px, 94vw); box-shadow:0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(17,24,39,.45); }
  dialog .cab { padding:16px 18px; border-bottom:1px solid var(--borda); font-weight:700; }
  dialog .corpo { padding:16px 18px; }
  dialog .pe { padding:12px 18px; border-top:1px solid var(--borda); display:flex; justify-content:flex-end; gap:8px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="oculto"></div>

<script>
/* ================== CONFIGURAÇÃO ================== */
const SUPABASE_URL = 'https://qgkelrlftxqpoyspxmsf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFna2VscmxmdHhxcG95c3B4bXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjczNTUsImV4cCI6MjA5NTkwMzM1NX0.dvEPOWwBLbrJJdYtXnhfjTsWvH4MxCDj3mxq9Yit7B0';
// Mesma chave de sessão do SisPlano: quem entrou no SisPlano já está logado aqui.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const SISPLANO = '../';

const QUADS = [
  { k:'cla', nome:'Clã', desc:'Colaboração, pessoas' },
  { k:'adocracia', nome:'Adocracia', desc:'Inovação, autonomia' },
  { k:'mercado', nome:'Mercado', desc:'Resultado, performance' },
  { k:'hierarquia', nome:'Hierarquia', desc:'Processos, controle' },
];
const AFIRMATIVAS = [
  ['Características da organização', ['A empresa é um ambiente colaborativo, com relações de confiança e proximidade entre as pessoas','A empresa é dinâmica, inovadora e incentiva autonomia e iniciativa','A empresa é orientada a resultados, metas e alta performance','A empresa é estruturada, organizada e guiada por processos bem definidos']],
  ['Estilo de liderança', ['Líderes atuam como mentores, desenvolvendo pessoas e promovendo engajamento','Líderes incentivam autonomia, inovação e tomada de decisão baseada em dados','Líderes são exigentes, focados em metas, resultados e excelência','Líderes priorizam organização, controle e previsibilidade']],
  ['Gestão de pessoas', ['Existe forte colaboração, espírito de equipe e desenvolvimento contínuo','As pessoas têm liberdade com responsabilidade e são incentivadas a experimentar','Há cobrança por desempenho e entrega de resultados consistentes','As pessoas seguem processos claros e padrões definidos']],
  ['Coesão organizacional', ['A empresa é unida por confiança e relacionamento entre as pessoas','A empresa é unida por inovação e crescimento','A empresa é unida pelo foco em resultados e sucesso do cliente','A empresa é unida por regras, processos e estrutura']],
  ['Ênfase estratégica', ['O foco está nas pessoas, desenvolvimento e engajamento','O foco está em inovação, autonomia e adaptação rápida','O foco está em resultados, competitividade e excelência','O foco está em eficiência, organização e previsibilidade']],
  ['Critérios de sucesso', ['Sucesso é medido pelo engajamento, desenvolvimento e satisfação das pessoas','Sucesso é medido pela inovação, autonomia e capacidade de adaptação','Sucesso é medido por resultados consistentes, performance e satisfação do cliente','Sucesso é medido pela qualidade dos processos, organização e eficiência']],
];

/* ================== UTILITÁRIOS ================== */
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const n1 = v => (v === null || v === undefined || v === '') ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits:1, maximumFractionDigits:1 });
const sinal = v => v === null || v === undefined ? '—' : (Number(v) > 0 ? '+' : '') + n1(v);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('oculto'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('oculto'), 3800); }
function msgErro(e) { return (e && (e.message || e.msg)) ? (e.message || e.msg).replace(/^.*?ERROR:\s*/,'') : 'Algo deu errado.'; }
function statusGap(g) {
  const a = Math.abs(Number(g));
  if (a <= 2) return { cls:'ok', txt:'✓ Alinhado' };
  if (a <= 5) return { cls:'atencao', txt:'! Atenção' };
  return { cls:'critico', txt:'✕ Distante' };
}

/* ================== ROTEADOR ================== */
const params = new URLSearchParams(location.search);
if (params.get('t')) telaFormulario(params.get('t'));
else if (params.get('d')) telaDesempenho(params.get('d'));
else iniciarPainel();

/* =========================================================
   FORMULÁRIO OCAI (quem recebe o link)
   ========================================================= */
async function telaFormulario(token) {
  document.title = 'Pesquisa de Cultura DAEXE';
  app.innerHTML = `<div class="topo"><div class="in"><span class="marca">Pesquisa de Cultura DAEXE</span></div></div>
    <div class="form-pesq"><div class="card">Carregando…</div></div>`;
  const { data, error } = await sb.rpc('gpp_ocai_convite', { p_token: token });
  const box = $('.form-pesq');
  if (error) { box.innerHTML = `<div class="card"><h2>Não foi possível abrir a pesquisa</h2><p>Tente novamente em instantes.</p></div>`; return; }
  const msgs = {
    invalido: ['Link inválido', 'Use o link pessoal que chegou no seu e-mail.'],
    respondido: ['Resposta já registrada', 'Este link já foi usado. Obrigado pela participação!'],
    encerrado: ['Pesquisa encerrada', 'O prazo deste trimestre terminou.'],
  };
  if (data.estado !== 'ok') {
    const [t, p] = msgs[data.estado] || msgs.invalido;
    box.innerHTML = `<div class="card" style="text-align:center;padding:48px 18px"><h2>${esc(t)}</h2><p>${esc(p)}</p></div>`;
    return;
  }

  $('.marca').innerHTML = `Pesquisa de Cultura DAEXE <small>${esc(data.trimestre)}</small>`;
  box.innerHTML = `
    <div class="card">
      <p><span class="tag ok">100% anônima</span></p>
      <p>O objetivo é entender como a cultura da empresa é percebida <b>hoje</b>, no dia a dia.</p>
      <p>Em cada afirmativa, <b>distribua 100 pontos</b> entre as 4 alternativas, como quiser (ex.: 40 / 30 / 20 / 10). Se uma alternativa não representa a empresa, dê 0. Não há resposta certa ou errada.</p>
      <p style="color:var(--tinta-3);font-size:13px;margin-bottom:0">O sistema registra apenas que você respondeu. Suas notas são gravadas sem nome e sem horário, separadas do seu convite. Prazo: <b>${esc(data.prazo)}</b>.</p>
    </div>
    ${AFIRMATIVAS.map(([titulo, ops], a) => `
      <div class="card">
        <h2 style="margin-bottom:2px">Afirmativa ${a + 1} · ${esc(titulo)}</h2>
        <div class="sub" style="margin-bottom:8px">Distribua 100 pontos</div>
        ${ops.map((o, i) => `<div class="opcao"><label for="v${a}_${i}">${'ABCD'[i]}) ${esc(o)}</label>
          <input id="v${a}_${i}" type="number" inputmode="numeric" min="0" max="100" step="1" placeholder="0" data-a="${a}"></div>`).join('')}
        <div class="soma" id="soma${a}">Soma: 0 de 100 — faltam 100</div>
      </div>`).join('')}`;
  app.insertAdjacentHTML('beforeend', `<div class="rodape-fixo" id="rodape"><div class="in">
      <span id="progresso" style="color:var(--tinta-3);font-size:14px">0 de 6 afirmativas completas</span>
      <button class="btn" id="enviar" disabled>Enviar respostas</button></div>
      <div id="erroEnvio" style="max-width:760px;margin:6px auto 0;color:var(--critico);font-size:14px"></div></div>`);

  const val = (a, i) => { const v = $(`#v${a}_${i}`).value; return v === '' ? 0 : Number(v); };
  function atualizar() {
    let completas = 0, valido = true;
    for (let a = 0; a < 6; a++) {
      let soma = 0, ruim = false;
      for (let i = 0; i < 4; i++) { const v = val(a, i); if (!Number.isInteger(v) || v < 0 || v > 100) ruim = true; soma += v; }
      const el = $(`#soma${a}`);
      if (ruim) { el.className = 'soma'; el.textContent = 'Use números inteiros de 0 a 100'; valido = false; continue; }
      if (soma === 100) { el.className = 'soma ok'; el.textContent = 'Soma: 100 ✓'; completas++; }
      else { el.className = 'soma'; el.textContent = `Soma: ${soma} de 100 — ${soma < 100 ? 'faltam ' + (100 - soma) : 'passou ' + (soma - 100)}`; valido = false; }
    }
    $('#progresso').textContent = `${completas} de 6 afirmativas completas`;
    $('#enviar').disabled = !(valido && completas === 6);
  }
  box.addEventListener('input', atualizar);
  $('#enviar').addEventListener('click', async () => {
    const b = $('#enviar'); const valores = [];
    for (let a = 0; a < 6; a++) for (let i = 0; i < 4; i++) valores.push(val(a, i));
    b.disabled = true; b.textContent = 'Enviando…'; $('#erroEnvio').textContent = '';
    const { data: r, error: e } = await sb.rpc('gpp_ocai_responder', { p_token: token, p_valores: valores });
    if (!e && r && r.ok) {
      box.innerHTML = `<div class="card" style="text-align:center;padding:48px 18px"><h2>Obrigado!</h2><p>Sua resposta foi registrada de forma anônima.</p></div>`;
      $('#rodape').remove(); scrollTo(0, 0);
    } else {
      $('#erroEnvio').textContent = e ? 'Falha de conexão. Tente de novo.' : (r && r.msg) || 'Não foi possível registrar.';
      b.textContent = 'Enviar respostas'; atualizar();
    }
  });
}

/* =========================================================
   FORMULÁRIO DE DESEMPENHO (link pessoal ?d=)
   ========================================================= */
const ESCALA = [[1, 'Ainda não pratica'], [2, 'Faz sem consistência'], [3, 'Pratica consistentemente'], [4, 'Acima do esperado']];
const escalaHtml = () => `<div class="escala">${ESCALA.map(([n, t]) => `<span><b>${n}</b> ${t}</span>`).join('')}</div>`;

async function telaDesempenho(token) {
  document.title = 'Avaliação de Desempenho DAEXE';
  app.innerHTML = `<div class="topo"><div class="in"><span class="marca">Avaliação de Desempenho DAEXE</span></div></div>
    <div class="form-pesq" id="fd"><div class="card">Carregando…</div></div>`;
  const box = $('#fd');
  const { data: L, error } = await sb.rpc('gpp_des_link', { p_token: token });
  if (error) { box.innerHTML = `<div class="card"><h2>Não foi possível abrir a avaliação</h2><p>Tente novamente em instantes.</p></div>`; return; }
  const msgs = {
    invalido: ['Link inválido', 'Use o link pessoal que chegou no seu e-mail.'],
    encerrado: ['Avaliação encerrada', 'O prazo deste trimestre terminou. Se ainda precisa responder, fale com a GPP.'],
  };
  if (L.estado !== 'ok') {
    const [t, p] = msgs[L.estado] || msgs.invalido;
    box.innerHTML = `<div class="card" style="text-align:center;padding:48px 18px"><h2>${esc(t)}</h2><p>${esc(p)}</p></div>`;
    return;
  }
  $('.marca').innerHTML = `Avaliação de Desempenho DAEXE <small>${esc(L.trimestre)}</small>`;

  function lista() {
    const rod = $('#rodape'); if (rod) rod.remove();
    const pend = L.tarefas.filter(t => !t.respondida).length;
    box.innerHTML = `
      <div class="card">
        <h2 style="margin-bottom:6px">Olá, ${esc(L.nome.split(' ')[0])}!</h2>
        <p style="margin:0 0 10px">${pend ? `Você tem <b>${pend}</b> avaliação(ões) para responder até <b>${esc(L.prazo)}</b>.` : '<b>Tudo respondido.</b> Obrigado pela participação!'}</p>
        ${escalaHtml()}
        <p class="sub" style="margin:10px 0 0">A nota 3 é o esperado. Use 4 só quando a prática vai claramente além do esperado.</p>
      </div>
      ${L.tarefas.map(t => `
        <div class="card"><div class="acoes" style="justify-content:space-between">
          <div><div style="font-weight:700">${t.tipo === 'auto' ? 'Minha autoavaliação' : 'Avaliar ' + esc(t.avaliado)}</div>
            <div class="sub" style="margin:2px 0 0">${t.tipo === 'auto'
              ? 'Como você percebe a sua prática no trimestre' + (t.pede_nps ? ' · inclui a Percepção da Liderança (anônima)' : '')
              : [t.area, t.e_lider ? 'líder' : ''].filter(Boolean).map(esc).join(' · ') || 'Liderado(a)'}</div></div>
          ${t.respondida ? '<span class="tag ok">✓ Enviada</span>' : `<button class="btn" data-t="${t.id}">Responder</button>`}
        </div></div>`).join('')}`;
    box.querySelectorAll('[data-t]').forEach(b => b.onclick = () => formulario(L.tarefas.find(t => t.id === b.dataset.t)));
    scrollTo(0, 0);
  }

  function formulario(t) {
    const auto = t.tipo === 'auto';
    const itens = L.itens.filter(i => !i.so_lideres || t.e_lider);
    const grupos = [];
    itens.forEach(i => {
      let g = grupos.find(x => x.id === i.competencia_id);
      if (!g) grupos.push(g = { id: i.competencia_id, nome: i.competencia, desc: i.descricao, itens: [] });
      g.itens.push(i);
    });
    const notas = {}; let nps = null;
    const primeiro = (t.avaliado || '').split(' ')[0];
    box.innerHTML = `
      <button class="btn sec mini" id="voltar">← Voltar</button>
      <div class="card" style="margin-top:12px">
        <h2 style="margin-bottom:4px">${auto ? 'Minha autoavaliação' : 'Avaliação de ' + esc(t.avaliado)}</h2>
        <p style="margin:0 0 10px">${auto ? 'Marque o quanto cada afirmativa descreve a <b>sua</b> prática neste trimestre.'
          : `Marque o quanto cada afirmativa descreve a prática de <b>${esc(t.avaliado)}</b> neste trimestre.`}</p>
        ${escalaHtml()}
      </div>
      ${grupos.map(g => `
        <div class="card">
          <h2 style="margin-bottom:2px">${esc(g.nome)}</h2>
          <div class="sub" style="margin-bottom:4px">${esc(g.desc || '')}</div>
          ${g.itens.map(i => `
            <div class="item"><div class="txt">${esc(i.texto)}</div>
              <div class="notas" role="group" aria-label="${esc(i.texto)}">
                ${[1, 2, 3, 4].map(n => `<button type="button" class="nota" data-i="${i.id}" data-n="${n}" aria-pressed="false" title="${n} · ${ESCALA[n - 1][1]}">${n}</button>`).join('')}
              </div></div>`).join('')}
        </div>`).join('')}
      ${auto && t.pede_nps ? `
        <div class="card">
          <h2 style="margin-bottom:2px">Percepção da Liderança</h2>
          <p class="sub" style="margin-bottom:10px"><span class="tag ok">Anônima</span> Esta nota é gravada sem nome e sem ligação com a sua autoavaliação. O resultado por gestor só aparece quando há respostas suficientes.</p>
          <p style="margin:0 0 10px">De 0 a 10, quanto você recomendaria a liderança de <b>${esc(t.gestor)}</b> a um colega?</p>
          <div class="nps">${[...Array(11).keys()].map(n => `<button type="button" class="nota" data-nps="${n}" aria-pressed="false">${n}</button>`).join('')}</div>
          <div class="nps-leg"><span>0 · nada provável</span><span>10 · muito provável</span></div>
        </div>` : ''}
      ${!auto ? `
        <div class="card">
          <h2 style="margin-bottom:2px">Prioridades de desenvolvimento</h2>
          <p class="sub" style="margin-bottom:10px">Marque até 2 competências para ${esc(primeiro)} desenvolver no próximo trimestre. Elas entram no PDI.</p>
          ${grupos.map(g => `<label class="check"><input type="checkbox" class="prio" value="${g.id}"> ${esc(g.nome)}</label>`).join('')}
          <label class="campo" style="margin:12px 0 0">Comentário / feedback (opcional)<textarea id="coment" rows="3" maxlength="2000"></textarea></label>
        </div>` : ''}`;
    app.insertAdjacentHTML('beforeend', `<div class="rodape-fixo" id="rodape"><div class="in">
        <span id="progresso" style="color:var(--tinta-3);font-size:14px"></span>
        <button class="btn" id="enviar" disabled>Enviar avaliação</button></div>
        <div id="erroEnvio" style="max-width:760px;margin:6px auto 0;color:var(--critico);font-size:14px"></div></div>`);
    scrollTo(0, 0);

    const precisaNps = auto && t.pede_nps;
    function atualizar() {
      const feitas = itens.filter(i => notas[i.id]).length;
      const faltaNps = precisaNps && nps === null;
      $('#progresso').textContent = `${feitas} de ${itens.length} afirmativas${precisaNps ? (faltaNps ? ' · falta a Percepção da Liderança' : ' · liderança ✓') : ''}`;
      $('#enviar').disabled = feitas < itens.length || faltaNps;
    }
    box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      notas[b.dataset.i] = Number(b.dataset.n);
      box.querySelectorAll(`[data-i="${b.dataset.i}"]`).forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      atualizar();
    });
    box.querySelectorAll('[data-nps]').forEach(b => b.onclick = () => {
      nps = Number(b.dataset.nps);
      box.querySelectorAll('[data-nps]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      atualizar();
    });
    box.querySelectorAll('.prio').forEach(cb => cb.onchange = () => {
      const marcadas = box.querySelectorAll('.prio:checked').length;
      box.querySelectorAll('.prio').forEach(x => { if (!x.checked) x.disabled = marcadas >= 2; });
    });
    $('#voltar').onclick = () => {
      if (Object.keys(notas).length && !confirm('Sair sem enviar? As notas marcadas nesta tela serão perdidas.')) return;
      lista();
    };
    $('#enviar').onclick = async () => {
      const b = $('#enviar'); b.disabled = true; b.textContent = 'Enviando…'; $('#erroEnvio').textContent = '';
      const args = { p_token: token, p_avaliacao: t.id, p_notas: notas, p_nps: precisaNps ? nps : null,
        p_prioridades: auto ? null : [...box.querySelectorAll('.prio:checked')].map(x => Number(x.value)),
        p_comentario: auto ? null : ($('#coment').value || null) };
      const { data: r, error: e } = await sb.rpc('gpp_des_responder', args);
      if (!e && r && r.ok) { t.respondida = true; t.pede_nps = false; toast('Avaliação enviada. Obrigado!'); lista(); }
      else { $('#erroEnvio').textContent = e ? 'Falha de conexão. Tente de novo.' : (r && r.msg) || 'Não foi possível registrar.'; b.textContent = 'Enviar avaliação'; atualizar(); }
    };
    atualizar();
  }
  lista();
}

  const { data, error } = await sb.rpc(nome, args);

function cfg(chave) { const c = D.config.find(x => x.chave === chave); return c ? c.valor : ''; }

function quad(r, k) {
  const q = QUADS.find(x => x.k === k), g = r['gap_' + k], s = statusGap(g);
  return `<div class="quad"><div class="nome">${q.nome}</div><div class="desc">${q.desc}</div>
    <div class="linha"><span class="atual">${n1(r[k])}</span><span class="des">desejado ${n1(r['des_' + k])}</span></div>
    <span class="tag ${s.cls}">${s.txt} · gap ${sinal(g)}</span></div>`;
}

/* Radar em losango: Clã ↖, Adocracia ↗, Mercado ↘, Hierarquia ↙ (mesma posição do mapa) */
function radar(el, r) {
  const W = 440, H = 340, cx = W / 2, cy = H / 2, R = 165;
  const vals = [...QUADS.map(q => Number(r[q.k])), ...QUADS.map(q => Number(r['des_' + q.k]))];
  const max = Math.max(40, Math.ceil(Math.max(...vals) / 10) * 10);
  const ang = [-135, -45, 45, 135].map(a => a * Math.PI / 180);
  const pt = (i, v) => [cx + Math.cos(ang[i]) * R * v / max, cy + Math.sin(ang[i]) * R * v / max];
  const poly = key => QUADS.map((q, i) => pt(i, Number(r[key(q)])).join(',')).join(' ');
  let grid = '';
  for (let v = 10; v <= max; v += 10) {
    grid += `<polygon points="${QUADS.map((_, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="#E5E7EB" stroke-width="1"/>`;
    grid += `<text x="${cx}" y="${cy - R * v / max * Math.SQRT1_2 - 3}" text-anchor="middle" font-size="10" fill="#9CA3AF" stroke="#fff" stroke-width="3" paint-order="stroke">${v}</text>`;
  }
  const eixos = QUADS.map((q, i) => { const [x, y] = pt(i, max); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E5E7EB"/>`; }).join('');
  const rotulos = QUADS.map((q, i) => { const [x, y] = pt(i, max * 1.13); return `<text x="${x}" y="${y}" text-anchor="${i === 0 || i === 3 ? 'end' : 'start'}" font-size="13" font-weight="600" fill="#1A2230">${q.nome}</text>`; }).join('');
  const pontos = (key, cor, nomeSerie) => QUADS.map((q, i) => { const [x, y] = pt(i, Number(r[key(q)]));
    return `<circle cx="${x}" cy="${y}" r="5" fill="${cor}" stroke="#fff" stroke-width="2"/>
      <circle cx="${x}" cy="${y}" r="14" fill="transparent" data-tip="<b>${q.nome}</b> · ${nomeSerie}: ${n1(r[key(q)])}"/>`; }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar da cultura atual comparada à desejada">
    ${grid}${eixos}
    <polygon points="${poly(q => 'des_' + q.k)}" fill="none" stroke="var(--s-desejado)" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="${poly(q => q.k)}" fill="rgba(29,111,209,.12)" stroke="var(--s-atual)" stroke-width="2"/>
    ${pontos(q => 'des_' + q.k, 'var(--s-desejado)', 'desejado')}${pontos(q => q.k, 'var(--s-atual)', 'atual')}
    ${rotulos}</svg>`;
  dicas(el);
}

function linha(el, R) {
  const W = 900, H = 260, m = { l:44, r:24, t:22, b:36 };
  const ys = R.map(x => Number(x.indice));
  const max = 100, min = Math.min(90, Math.floor((Math.min(...ys) - 1) / 5) * 5), passo = max - min > 10 ? 5 : 2;
  const x = i => R.length === 1 ? (m.l + W - m.r) / 2 : m.l + i * (W - m.l - m.r) / (R.length - 1);
  const y = v => m.t + (max - v) * (H - m.t - m.b) / (max - min);
  let grid = '';
  for (let v = min; v <= max; v += passo) grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF0F3"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#6B7280">${v}</text>`;
  const path = R.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.indice)}`).join(' ');
  const ult = R.length - 1;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do índice de aderência por trimestre">
    ${grid}
    <path d="${path}" fill="none" stroke="var(--s-atual)" stroke-width="2"/>
    ${R.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.indice)}" r="5" fill="var(--s-atual)" stroke="#fff" stroke-width="2"/>
      <text x="${x(i)}" y="${H - 12}" text-anchor="middle" font-size="12" fill="#4B5563">${esc(p.trimestre)}</text>
      <rect x="${x(i) - 30}" y="${m.t}" width="60" height="${H - m.t - m.b}" fill="transparent" data-tip="<b>${esc(p.trimestre)}</b> · índice ${n1(p.indice)}% · ${p.respondentes ?? '—'} resp."/>`).join('')}
    <text x="${x(ult)}" y="${y(R[ult].indice) - 12}" text-anchor="middle" font-size="12" font-weight="600" fill="#1A2230">${n1(R[ult].indice)}%</text>
  </svg>`;
  dicas(el);
}

function dicas(el) {
  let d = null;
  el.querySelectorAll('[data-tip]').forEach(n => {
    n.addEventListener('mouseenter', () => {
      d = document.createElement('div'); d.className = 'dica'; d.innerHTML = n.dataset.tip; el.appendChild(d);
      const b = n.getBoundingClientRect(), e = el.getBoundingClientRect();
      d.style.left = (b.left + b.width / 2 - e.left) + 'px'; d.style.top = (b.top + b.height / 2 - e.top) + 'px';
    });
    n.addEventListener('mouseleave', () => { if (d) d.remove(); d = null; });
  });
}

// botoes: [{ t:'Salvar', cls:'', fn: async (dlg) => true/false }]  — retornar false mantém o diálogo aberto
function dialogo(titulo, corpo, botoes, largura) {
  const dlg = document.createElement('dialog');
  if (largura) dlg.style.width = `min(${largura}px, 94vw)`;
  dlg.innerHTML = `<div class="cab">${titulo}</div><div class="corpo">${corpo}</div><div class="pe"></div>`;
  const pe = $('.pe', dlg);
  [{ t:'Cancelar', cls:'sec', fn:() => true }].concat(botoes || []).forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.t;
    el.onclick = async () => { el.disabled = true; let ok; try { ok = await b.fn(dlg); } finally { el.disabled = false; } if (ok !== false) dlg.remove(); };
    pe.appendChild(el);
  });
  dlg.addEventListener('cancel', e => { e.preventDefault(); dlg.remove(); });
  document.body.appendChild(dlg); dlg.showModal();
  return dlg;
}
const ok = r => !r.erro;

function tabelaConvidados(ciclo, comAcoes) {
  const podeAgir = comAcoes && ciclo.status === 'aberto' && !ciclo.vencido;
  if (!ciclo.convites.length) return `<p class="sub" style="margin:12px 0 0">Nenhum convidado neste ciclo.</p>`;
  return `<div class="tabela-wrap" style="margin-top:14px"><table><thead><tr><th>Organizador</th><th>E-mail</th><th>Situação</th>${podeAgir ? '<th></th>' : ''}</tr></thead>
    <tbody>${ciclo.convites.map(p => `<tr><td>${esc(p.nome)}</td><td>${esc(p.email || '—')}</td>
      <td>${p.respondeu ? '<span class="tag ok">✓ Respondeu</span>' : '<span class="tag neutro">Pendente</span>'}</td>
      ${podeAgir ? `<td>${p.respondeu ? '' : `<div class="acoes" style="justify-content:flex-end;flex-wrap:nowrap">
        <button class="btn sec mini" data-reenviar="${p.id}" data-nome="${esc(p.nome)}">Reenviar convite</button>

function incluirOrganizadores(ciclo) {
  const ja = new Set(ciclo.convites.map(p => p.organizador_id));
  const lista = D.organizadores.map(o => {
    const motivo = ja.has(o.id) ? 'já convidado' : !o.email ? 'sem e-mail' : !o.ativo ? 'inativo' : '';
    return `<label class="check" style="${motivo ? 'opacity:.55' : ''}"><input type="checkbox" class="inc_org" value="${o.id}" ${motivo && motivo !== 'inativo' ? 'disabled' : ''}>
      ${esc(o.nome)} <span style="color:var(--tinta-3);font-size:12px">${esc(o.email || '')}${motivo ? ' · ' + motivo : ''}</span></label>`;

  dialogo(`Incluir Organizadores no ciclo ${esc(ciclo.trimestre)}`, `
    <p class="sub" style="margin-top:0">Quem for marcado recebe agora o convite por e-mail, com prazo até ${esc(ciclo.prazo)}. Organizadores sem e-mail precisam ser editados antes.</p>

function abaCenario() {
  const c = $('#conteudo');
  const apurados = new Set(D.resultados.map(r => r.trimestre));
  const emUso = new Set(D.ciclos.map(x => x.trimestre).concat(D.historico.map(h => h.trimestre)));
  c.innerHTML = `
    <h1>Cenário desejado</h1>
    <p class="sub">Pesos de cada quadrante definidos pela direção conforme a estratégia. Devem somar 100. Trimestres já apurados ficam congelados para preservar o histórico; se um trimestre não tiver pesos na abertura, o sistema repete os do anterior.</p>
    <div class="card"><div class="tabela-wrap"><table>
      <thead><tr><th>Trimestre</th>${QUADS.map(q => `<th class="num">${q.nome}</th>`).join('')}<th class="num">Soma</th><th>Observação</th><th></th></tr></thead>
      <tbody>${D.cenarios.map(d => linhaCenario(d, apurados.has(d.trimestre), false, !emUso.has(d.trimestre))).join('')}
        ${linhaCenario({ trimestre:'', cla:'', adocracia:'', mercado:'', hierarquia:'', observacao:'' }, false, true, false)}</tbody></table></div>
      <p style="font-size:12px;color:var(--tinta-3);margin:10px 0 0">Só dá para excluir o cenário de um trimestre que ainda não tem ciclo nem resultado histórico.</p></div>`;
  c.querySelectorAll('tr[data-tri]').forEach(tr => {
    const soma = () => { const s = QUADS.reduce((a, q) => a + Number($(`[data-k="${q.k}"]`, tr).value || 0), 0); const el = $('.soma-c', tr); el.textContent = s; el.style.color = s === 100 ? 'var(--ok)' : 'var(--critico)'; };
    tr.addEventListener('input', soma); soma();
    const b = $('[data-salvar-c]', tr);
    if (b) b.onclick = async () => {

function linhaCenario(d, congelado, novo, excluivel) {

/* ---------------- ABA: DESEMPENHO ---------------- */
let DD = null;               // dados do painel de desempenho
let subDes = 'geral';        // geral | pessoas | pessoa | ciclos | matriz | pdi
let triDes = null;           // trimestre selecionado nos resultados
let pessoaSel = null;        // organizador aberto no detalhe
let triMatriz = null;        // trimestre aberto na matriz
let filtroPdi = { tri: '', pessoa: '', status: 'abertos' };

const ordTri = t => (2000 + Number(String(t).slice(3))) * 10 + Number(String(t)[0]);
const porTri = (a, b) => ordTri(a) - ordTri(b);
const n2 = v => (v === null || v === undefined || v === '') ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pc = v => (v === null || v === undefined) ? '—' : n1(v) + '%';
const sinal2 = v => v === null || v === undefined ? '—' : (Number(v) > 0 ? '+' : '') + n2(v);
const org = id => D.organizadores.find(o => o.id === id) || { nome: '—' };
const comp = id => DD.competencias.find(c => c.id === id) || { nome: '—', ordem: 999 };
const STATUS_PDI = { 'a definir': 'A definir', planejada: 'Planejada', 'em andamento': 'Em andamento', concluida: 'Concluída', cancelada: 'Cancelada' };
const TIPOS_COMP = { comportamental: 'Comportamental', estrategica: 'Estratégica', tecnica: 'Técnica' };

function trisDes() { return [...new Set([...DD.itens.map(i => i.trimestre), ...DD.avaliacoes.map(a => a.trimestre)])].sort(porTri); }
function trisResultado() { return DD.org.map(o => o.trimestre).sort(porTri); }
function triAnterior(t) { const l = trisResultado(); const i = l.indexOf(t); return i > 0 ? l[i - 1] : null; }

function gapTag(g) {
  if (g === null || g === undefined) return '<span class="tag neutro">—</span>';
  const v = Number(g);
  if (v > 0.5) return `<span class="tag atencao" title="Autoavaliação acima da avaliação do gestor">▲ ${sinal2(v)}</span>`;
  if (v < -0.5) return `<span class="tag info" title="Autoavaliação abaixo da avaliação do gestor">▼ ${sinal2(v)}</span>`;
  return `<span class="tag ok" title="Autoavaliação alinhada à do gestor">${sinal2(v)}</span>`;
}
function matBar(m) {
  if (m === null || m === undefined) return '—';
  const w = Math.max(0, Math.min(100, Number(m) / 150 * 100));
  const cor = Number(m) >= 100 ? 'var(--ok)' : Number(m) >= 75 ? 'var(--s-atual)' : 'var(--atencao)';
  return `<div class="mat"><div class="barra"><div style="width:${w}%;background:${cor}"></div><i></i></div><b>${pc(m)}</b></div>`;
}

async function carregarDes() {
  const { data, error } = await sb.rpc('gpp_admin_des_painel');
  if (error) { $('#conteudo').innerHTML = `<div class="aviso erro">Erro ao carregar o Desempenho: ${esc(msgErro(error))}</div>`; return false; }
  DD = data;
  const tr = trisResultado();
  if (!triDes || !tr.includes(triDes)) triDes = tr.length ? tr[tr.length - 1] : null;
  return true;
}

async function rpcDes(nome, args, okMsg) {
  const { data, error } = await sb.rpc(nome, args);
  if (error) {
    if (error.code === 'PGRST202') toast('Esta exclusão ainda não foi habilitada: rode o arquivo supabase/gpp_09d_exclusoes.sql no SQL Editor do Supabase.');
    else toast(msgErro(error));
    return { erro: true };
  }
  if (okMsg) toast(typeof okMsg === 'function' ? okMsg(data) : okMsg);
  await carregarDes(); desenharDes();
  return { data };
}

function desenharDes() {

function seletorTri(lista, atual, attr) {
  return `<div class="chips">${lista.map(t => `<button class="chip ${t === atual ? 'ativa' : ''}" data-${attr}="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
}
function ligarSeletor(el, attr, fn) { el.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = () => fn(b.getAttribute('data-' + attr))); }

/* ----- dados derivados de um trimestre ----- */
function resumoTri(t) {
  const pes = DD.pessoas.filter(p => p.trimestre === t);
  const comGestor = pes.filter(p => p.indice_gestor !== null);
  const media = comGestor.length ? comGestor.reduce((a, p) => a + Number(p.indice_gestor), 0) / comGestor.length : null;
  const o = DD.org.find(x => x.trimestre === t);
  const nps = DD.nps.find(x => x.trimestre === t && x.geral);
  const oc = DD.org_comp.filter(x => x.trimestre === t).sort((a, b) => comp(a.competencia_id).ordem - comp(b.competencia_id).ordem);
  const gaps = pes.filter(p => p.gap !== null);
  return { pes, comGestor, media, mat: o ? o.maturidade : null, nps, oc, gaps,
    acima: gaps.filter(p => p.gap > 0.5).length, abaixo: gaps.filter(p => p.gap < -0.5).length, alinhados: gaps.filter(p => Math.abs(p.gap) <= 0.5).length,
    autos: pes.filter(p => p.nota_auto !== null).length };
}

      <div class="card kpi"><div class="rot">NPS de Liderança</div><div class="val">${R.nps ? n1(R.nps.nps) : '—'}</div><div class="det">${R.nps ? `${R.nps.n} resposta(s) · ${R.nps.promotores} promotores, ${R.nps.detratores} detratores` : 'não medido neste trimestre'}</div></div>
      <div class="card kpi"><div class="rot">Avaliados pelo gestor</div><div class="val">${R.comGestor.length}</div><div class="det">${R.autos} autoavaliação(ões)</div></div>
    </div>
    <div class="card"><h2>Evolução da Maturidade Organizacional</h2><div class="grafico" id="gMat"></div>
      <p style="font-size:12px;color:var(--tinta-3);margin:6px 0 0">Linha tracejada: 100% = todos praticam consistentemente (nota 3). Régua: 1 = 0%, 2 = 50%, 3 = 100%, 4 = 150%.</p></div>
    <div class="card"><h2>Maturidade por competência · ${esc(t)}</h2>

      <tbody>${R.oc.map(x => { const a = ant ? DD.org_comp.find(y => y.trimestre === ant && y.competencia_id === x.competencia_id) : null; const d = a ? x.maturidade - a.maturidade : null;
        return `<tr><td><b>${esc(comp(x.competencia_id).nome)}</b></td><td>${comp(x.competencia_id).so_lideres ? 'Líderes' : 'Todos'}</td><td class="num">${x.n}</td><td class="num">${n2(x.media)}</td>
          <td>${matBar(x.maturidade)}</td><td class="num">${pc(x.pct_3)}</td><td class="num">${pc(x.pct_4)}</td>${ant ? `<td class="num" style="color:${d === null ? 'inherit' : d >= 0 ? 'var(--ok)' : 'var(--critico)'}">${d === null ? '—' : (d >= 0 ? '+' : '') + n1(d)}</td>` : ''}</tr>`; }).join('')}</tbody></table></div></div>
    <div class="grade g2">
      <div class="card"><h2>Autoavaliação × gestor</h2>
        <div class="grade g3" style="margin-bottom:10px;gap:10px">

          <div><div class="rot-p">Alinhados (±0,5)</div><div class="val-p" style="color:var(--ok)">${R.alinhados}</div></div>

  graficoLinha($('#gMat'), DD.org.map(o => ({ x: o.trimestre, v: Number(o.maturidade) })).sort((a, b) => porTri(a.x, b.x)), 'Maturidade');

function graficoLinha(el, pts, nome) {
  if (!pts.length) { el.innerHTML = '<p class="sub">Sem dados.</p>'; return; }
  const W = 900, H = 240, m = { l: 44, r: 24, t: 24, b: 34 };
  const vs = pts.map(p => p.v);
  const min = Math.max(0, Math.floor(Math.min(...vs, 60) / 10) * 10), max = Math.ceil(Math.max(...vs, 110) / 10) * 10;
  const x = i => pts.length === 1 ? (m.l + W - m.r) / 2 : m.l + 40 + i * (W - m.l - m.r - 80) / (pts.length - 1);
  const y = v => m.t + (max - v) * (H - m.t - m.b) / (max - min);
  let grid = '';
  for (let v = min; v <= max; v += 10) grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF0F3"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#6B7280">${v}</text>`;
  const ref = `<line x1="${m.l}" x2="${W - m.r}" y1="${y(100)}" y2="${y(100)}" stroke="#9CA3AF" stroke-dasharray="5 4"/>`;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.v)}`).join(' ');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(nome)} por trimestre">${grid}${ref}
    <path d="${path}" fill="none" stroke="var(--s-atual)" stroke-width="2"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="var(--s-atual)" stroke="#fff" stroke-width="2"/>
      <text x="${x(i)}" y="${y(p.v) - 12}" text-anchor="middle" font-size="12" font-weight="600" fill="#1A2230">${n1(p.v)}%</text>
      <text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="12" fill="#4B5563">${esc(p.x)}</text>
      <rect x="${x(i) - 30}" y="${m.t}" width="60" height="${H - m.t - m.b}" fill="transparent" data-tip="<b>${esc(p.x)}</b> · ${esc(nome)} ${n1(p.v)}%"/>`).join('')}
  </svg>`;
  dicas(el);
}

/* ----- Por Organizador ----- */
function desPessoas() {
  const el = $('#des');
  const tris = trisResultado();
  if (!tris.length) { el.innerHTML = `<div class="card">Ainda não há resultados.</div>`; return; }

            <td class="num">${n2(p.nota_auto)}</td><td class="num">${n2(p.nota_gestor)}</td><td class="num">${pc(p.indice_auto)}</td><td class="num"><b>${pc(p.indice_gestor)}</b></td>
            <td>${gapTag(p.gap)}</td>${ant ? `<td class="num" style="color:${d === null ? 'inherit' : d >= 0 ? 'var(--ok)' : 'var(--critico)'}">${d === null ? '—' : (d >= 0 ? '+' : '') + n1(d)}</td>` : ''}
            <td><button class="btn sec mini" data-ver="${p.avaliado_id}">Ver</button></td></tr>`; }).join('')
        || `<tr><td colspan="10" style="color:var(--tinta-3)">Nenhuma avaliação respondida em ${esc(t)}.</td></tr>`}</tbody></table></div>
      <p style="font-size:12px;color:var(--tinta-3);margin:10px 0 0">Índice de Desempenho = nota geral ÷ 3 (3 = 100%, o esperado). O índice oficial é o do gestor; a autoavaliação dá a autopercepção. Gap = auto − gestor: ▲ acima de +0,5, ▼ abaixo de −0,5.</p></div>`;
