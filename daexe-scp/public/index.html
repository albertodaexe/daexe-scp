<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAEXE · Planejamento Estratégico</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo-badge">DX</div>
        <h1>DAEXE</h1>
        <p>Sistema de Planejamento Estratégico</p>
      </div>
      <form id="login-form">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com.br" required />
        <label>Senha</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <p id="login-error" class="login-error"></p>
      </form>
      <div class="login-hint">
        <strong>Acesso de demonstração</strong><br/>
        admin@daexe.com.br · gestor@daexe.com.br<br/>
        colaborador@daexe.com.br · visual@daexe.com.br<br/>
        senha: <code>daexe123</code>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-badge sm">DX</div>
        <div><strong>DAEXE</strong><span>Planejamento</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="user-chip" class="user-chip"></div>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Sair</button>
      </div>
    </aside>
    <main class="content">
      <header class="topbar">
        <h2 id="page-title">Painel</h2>
        <div class="topbar-actions">
          <button class="btn btn-light btn-sm" onclick="App.exportFile('pdf')">⤓ PDF</button>
          <button class="btn btn-light btn-sm" onclick="App.exportFile('excel')">⤓ Excel</button>
          <span id="role-badge" class="role-badge"></span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- MODAL -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head"><h3 id="modal-title"></h3><button onclick="App.closeModal()" class="modal-x">×</button></div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
</body>
</html>
