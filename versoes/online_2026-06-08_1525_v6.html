<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAEXE · Planejamento Estratégico (online)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#1F3A5F; --navy-d:#162a45; --accent:#2E8BC0; --gold:#E6A817;
  --bg:#f4f6f9; --card:#fff; --line:#e4e8ee; --text:#22303f; --muted:#6b7a8d;
  --green:#2e9e6b; --red:#d9534f; --amber:#e6a817;
  --radius:12px; --shadow:0 1px 3px rgba(20,40,70,.08),0 4px 16px rgba(20,40,70,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.hidden{display:none!important}
a{color:var(--accent)}
code{background:#eef2f7;padding:1px 6px;border-radius:5px;font-size:.85em}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-d)}
.btn-accent{background:var(--accent);color:#fff}
.btn-light{background:#eef2f7;color:var(--navy)}.btn-light:hover{background:#e2e9f1}
.btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover{color:var(--navy)}
.btn-danger{background:#fbeaea;color:var(--red)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-block{width:100%;justify-content:center;margin-top:10px}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--accent))}
.login-card{background:#fff;border-radius:18px;padding:38px 34px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-brand{text-align:center;margin-bottom:22px}
.login-brand h1{color:var(--navy);font-size:28px;letter-spacing:2px;margin-top:10px}
.login-brand p{color:var(--muted);font-size:13px}
.logo-badge{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto}
.logo-badge.sm{width:38px;height:38px;font-size:15px;border-radius:10px}
#login-form label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
#login-form input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px}
#login-form input:focus{outline:none;border-color:var(--accent)}
.login-error{color:var(--red);font-size:13px;margin-top:10px;text-align:center}
.login-hint{margin-top:22px;padding:14px;background:#f4f6f9;border-radius:10px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7}
.link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline;margin-top:10px;width:100%}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#cdd8e6;display:flex;flex-direction:column;position:fixed;height:100vh}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand strong{color:#fff;display:block;font-size:16px;letter-spacing:1px}
.sidebar-brand span{font-size:11px;color:#8fa3bd}
#nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6f86a3;margin:16px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:8px;cursor:pointer;color:#cdd8e6;font-size:13.5px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .ico{width:18px;text-align:center}
.sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.user-chip{font-size:12.5px}.user-chip strong{color:#fff;display:block}
.user-chip span{color:#8fa3bd;font-size:11px}
.content{flex:1;margin-left:248px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h2{font-size:19px;color:var(--navy)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.role-badge{background:#eef2f7;color:var(--navy);padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700}
.view{padding:26px 28px;max-width:1180px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.stat .label{font-size:12px;color:var(--muted);font-weight:600}
.stat .value{font-size:28px;font-weight:800;color:var(--navy);margin-top:4px}
.stat .sub{font-size:11.5px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:20px}
.card h3{color:var(--navy);font-size:16px;margin-bottom:4px}
.card .desc{color:var(--muted);font-size:13px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}.sidebar{width:64px}.content{margin-left:64px}.sidebar-brand span,.sidebar-brand strong,.nav-item span:not(.ico),.nav-section,.user-chip{display:none}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#f7f9fc;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafbfd}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-head h3{color:var(--navy);font-size:17px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill-green{background:#e3f3ec;color:var(--green)}.pill-amber{background:#fcf3da;color:#b9860f}
.pill-red{background:#fbeaea;color:var(--red)}.pill-blue{background:#e6f1f8;color:var(--accent)}.pill-gray{background:#eef2f7;color:var(--muted)}
.swot-Força{border-left:4px solid var(--green)}
.swot-Fraqueza{border-left:4px solid var(--red)}
.swot-Oportunidade{border-left:4px solid var(--accent)}
.swot-Ameaça{border-left:4px solid var(--gold)}
.progress{background:#eef2f7;border-radius:20px;height:8px;overflow:hidden;min-width:90px}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:20px}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,30,45,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:14px;width:560px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{color:var(--navy)}
.modal-x{background:none;border:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.bsc-row{display:grid;grid-template-columns:210px 1fr;gap:14px;margin-bottom:14px;align-items:stretch}
.bsc-persp{color:#fff;border-radius:10px;padding:14px;font-weight:700;font-size:14px;display:flex;align-items:center}
.bsc-objs{display:flex;flex-wrap:wrap;gap:10px}
.bsc-obj{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;flex:1;min-width:200px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
.bsc-obj b{color:var(--navy);font-size:13.5px}
.bsc-obj ul{margin:8px 0 0 16px;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;box-shadow:var(--shadow);z-index:90;font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
.philo-box{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;border-radius:14px;padding:26px;margin-bottom:20px}
.philo-box h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.8}
.philo-box p{font-size:17px;margin-top:6px;font-weight:500}
.value-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.value-item{background:#fff;border-radius:10px;padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--gold)}
.value-item b{color:var(--navy)}.value-item p{color:var(--muted);font-size:12.5px;margin-top:4px}
.inline-actions{display:flex;gap:6px;flex-wrap:wrap}
.gut-num{font-weight:800;color:var(--navy)}
.dept-card{border-left:4px solid var(--accent)}
.dept-sub{margin-top:14px}
.dept-sub h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;flex-direction:column;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin:0 6px 6px 0;font-size:12.5px}
.chip b{color:var(--navy)}.chip span{color:var(--muted);font-size:11px}
.chip-row{display:flex;flex-wrap:wrap}
.wk-input{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.wk-input:focus{outline:none;border-color:var(--accent)}
.color-dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:middle}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:42px!important}
.pass-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:var(--muted);padding:4px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#cdd8e6;display:inline-block;vertical-align:middle}
.avatar.lg{width:96px;height:96px}
.avatar-fallback{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;font-weight:800}
.q-group{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.q-head{background:var(--navy);color:#fff;padding:10px 14px;font-weight:700;font-size:13.5px}
.m-head{background:#eef2f7;color:var(--navy);padding:7px 14px;font-weight:700;font-size:12.5px}
.toggle-group{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle-group button{border:none;background:#fff;padding:7px 14px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.toggle-group button.active{background:var(--accent);color:#fff}
.wk-card{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.wk-card:hover{border-color:var(--accent);background:#fafbfd}
.wk-card .wk-meta{font-size:12px;color:var(--muted)}
.tag-ok{color:var(--green);font-weight:700}.tag-no{color:var(--red);font-weight:700}
.owner-chip{display:inline-block;background:#e6f1f8;color:var(--accent);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;margin:0 4px 4px 0}
.check-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.check-list label{display:flex;align-items:center;gap:8px;padding:6px;font-weight:500;cursor:pointer}
.check-list input{width:auto}
.goal-select{width:100%;font-size:14px}
.goal-full{font-weight:600;color:var(--navy);margin-top:10px;font-size:14.5px;line-height:1.4}
.ms-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line)}
.ms-row input[type=checkbox]{width:auto}
.ms-row.done label{text-decoration:line-through;color:var(--muted)}
.ms-row label{flex:1;cursor:pointer}
.ms-add{display:flex;gap:8px;margin-top:10px}
.ms-add input{flex:1}
.sidebar{transition:transform .2s ease}
.content{transition:margin-left .2s ease}
body.nav-collapsed .sidebar{transform:translateX(-100%)}
body.nav-collapsed .content{margin-left:0}
.topbar-left{display:flex;align-items:center;gap:12px}
#nav-toggle{font-size:16px;line-height:1;padding:7px 11px}
/* Organograma */
.org-chart{padding:10px 0;text-align:center;overflow-x:auto}
.org-node{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 16px;display:inline-block}
.org-company{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;border:none;min-width:240px}
.org-company b{font-size:16px}.org-company span{display:block;font-size:11.5px;opacity:.85}
.org-trunk{width:2px;height:22px;background:var(--line);margin:0 auto}
.org-cols{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:22px}
.org-branch{position:relative}
.org-branch::before{content:'';position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--line)}
.org-dept{border-top:4px solid var(--accent);min-width:210px;max-width:250px;text-align:left;vertical-align:top}
.org-dept b{color:var(--navy);font-size:14px}.org-dept>span{display:block;color:var(--muted);font-size:11.5px;margin-bottom:8px}
.org-people{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.org-person{background:#f7f9fc;border-radius:7px;padding:6px 9px}
.org-person b{color:var(--navy);font-size:12.5px}.org-person span{color:var(--muted);font-size:11px;display:block}
.org-procs{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.org-proc{background:#eef2f7;color:var(--navy);border-radius:6px;padding:2px 7px;font-size:10.5px}
</style>
</head>
<body>
  <div id="boot" class="loading">Conectando…</div>

  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo-badge">DX</div>
        <h1>DAEXE</h1>

          <input type="password" id="login-password" placeholder="••••••••" required />

<script>
/* ====== CONFIGURAÇÃO SUPABASE (banco/login na nuvem) ====== */
const SUPABASE_URL = 'https://qgkelrlftxqpoyspxmsf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFna2VscmxmdHhxcG95c3B4bXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjczNTUsImV4cCI6MjA5NTkwMzM1NX0.dvEPOWwBLbrJJdYtXnhfjTsWvH4MxCDj3mxq9Yit7B0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- helpers de banco ---------- */
async function tList(table, order, asc=true){
  let q = sb.from(table).select('*');
  if (order) q = q.order(order, { ascending: asc });
  const { data, error } = await q;
  if (error) throw error;
  return data || [];
}
async function tInsert(table, row){ const { data, error } = await sb.from(table).insert(row).select(); if(error) throw error; return data; }
async function tUpdate(table, id, row){ const { error } = await sb.from(table).update(row).eq('id', id); if(error) throw error; }
async function tDelete(table, id){ const { error } = await sb.from(table).delete().eq('id', id); if(error) throw error; }

const App = (() => {
  let me = null, charts = {};
  const RANK = { viewer: 0, contributor: 1, manager: 2, admin: 3 };
  const ROLE_LABEL = { admin: 'Administrador', manager: 'Gestor', contributor: 'Colaborador', viewer: 'Visualizador' };
  const can = (r) => me && RANK[me.role] >= RANK[r];

  const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])));
  const val = (id) => { const e = document.getElementById(id); return e ? e.value : ''; };
  const pct = (a, t) => t ? Math.round(a / t * 100) : 0;
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2800); }
  function modal(title, bodyHtml){ document.getElementById('modal-title').textContent=title; document.getElementById('modal-body').innerHTML=bodyHtml; document.getElementById('modal-backdrop').classList.remove('hidden'); }
  function closeModal(){ document.getElementById('modal-backdrop').classList.add('hidden'); }
  function form(fields){ return fields.join(''); }
  const f = {
    text:(id,label,v='',extra='')=>`<div class="field"><label>${label}</label><input id="${id}" value="${esc(v)}" ${extra}></div>`,
    num:(id,label,v='',extra='')=>`<div class="field"><label>${label}</label><input type="number" id="${id}" value="${v??''}" ${extra}></div>`,
    date:(id,label,v='')=>`<div class="field"><label>${label}</label><input type="date" id="${id}" value="${v?String(v).slice(0,10):''}"></div>`,
    area:(id,label,v='')=>`<div class="field"><label>${label}</label><textarea id="${id}">${esc(v)}</textarea></div>`,
    color:(id,label,v='#2E8BC0')=>`<div class="field"><label>${label}</label><input type="color" id="${id}" value="${v||'#2E8BC0'}" style="height:40px;padding:3px"></div>`,
    sel:(id,label,opts,v)=>`<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${o.v}" ${o.v==v?'selected':''}>${esc(o.t)}</option>`).join('')}</select></div>`
  };
  function bar(p){ const c=p>=80?'var(--green)':p>=40?'var(--accent)':'var(--amber)'; return `<div class="progress"><i style="width:${Math.min(p,100)}%;background:${c}"></i></div>`; }
  function statusPill(s){ const m={'Concluído':'pill-green','Em andamento':'pill-blue','Não iniciado':'pill-gray','Atrasado':'pill-red'}; return `<span class="pill ${m[s]||'pill-gray'}">${esc(s)}</span>`; }

  async function doLogin(email, password){
    const { error } = await sb.auth.signInWithPassword({ email:email.trim().toLowerCase(), password });

    await loadMeAndBoot();
  }
  async function loadMeAndBoot(){
    const { data:{ user } } = await sb.auth.getUser();
    if (!user) { showLogin(); return; }
    const { data:prof } = await sb.from('profiles').select('*').eq('id', user.id).single();
    me = prof || { id:user.id, name:user.email, email:user.email, role:'viewer' };
    if(me.org_id){ const { data:org } = await sb.from('organizations').select('name, logo_url, primary_color, accent_color').eq('id', me.org_id).single(); if(org){ me.org_name=org.name; me.org_logo=org.logo_url; me.org_primary=org.primary_color; me.org_accent=org.accent_color; } }
    boot();
  }
  function showLogin(){ document.getElementById('boot').classList.add('hidden'); document.getElementById('app').classList.add('hidden'); document.getElementById('login-screen').classList.remove('hidden'); }
  async function logout(){ await sb.auth.signOut(); me=null; location.reload(); }
  function boot(){
    document.getElementById('boot').classList.add('hidden');
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('user-chip').innerHTML = `<strong>${esc(me.name)}</strong><span>${esc(me.email)}</span>`;
    document.getElementById('role-badge').textContent = ROLE_LABEL[me.role] || me.role;
    applyBranding();
    renderNav(); go('dashboard');
  }
  function applyBranding(){
    const root=document.documentElement.style;
    if(me.org_primary) root.setProperty('--navy', me.org_primary);
    if(me.org_accent) root.setProperty('--accent', me.org_accent);
    const brand=document.getElementById('sidebar-brand');
    if(brand){
      if(me.org_logo){ brand.innerHTML=`<img src="${me.org_logo}" alt="logo" style="max-height:42px;max-width:185px;object-fit:contain">`; }
      else { const ini=(me.org_name||'DX').replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,2).toUpperCase()||'DX';
        brand.innerHTML=`<div class="logo-badge sm">${esc(ini)}</div><div><strong>${esc(me.org_name||'DAEXE')}</strong><span>Planejamento</span></div>`; }
    }
  }
  function resizeLogo(file, cb){
    const reader=new FileReader();
    reader.onload=()=>{ const img=new Image(); img.onload=()=>{ const maxW=360,maxH=120; let w=img.width,h=img.height; const r=Math.min(maxW/w,maxH/h,1); w=Math.round(w*r); h=Math.round(h*r); const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/png')); }; img.src=reader.result; };
    reader.readAsDataURL(file);
  }

  VIEWS.dashboard = async (v) => {
    const [objs, goals, inis, swot, weekly] = await Promise.all([
      tList('objectives'), tList('goals'), tList('initiatives'), tList('swot_items'), tList('goal_weekly')]);
    const avg = inis.length ? Math.round(inis.reduce((a,b)=>a+(b.progress||0),0)/inis.length) : 0;
    const conc = inis.filter(i=>i.status==='Concluído').length;
    const swMap={}; swot.forEach(s=>swMap[s.classification]=(swMap[s.classification]||0)+1);
    const swotByClass=Object.keys(swMap).map(k=>({classification:k,c:swMap[k]}));
    const topGut=swot.map(s=>({item:s.item,gut:s.gravidade*s.urgencia*s.tendencia,classification:s.classification})).sort((a,b)=>b.gut-a.gut).slice(0,5);
    // desempenho semanal acumulado por meta
    const gmap={}; weekly.forEach(w=>{ (gmap[w.goal_id]=gmap[w.goal_id]||{m:0,r:0}); gmap[w.goal_id].m+=Number(w.meta)||0; gmap[w.goal_id].r+=Number(w.realizado)||0; });
    const perf=Object.keys(gmap).map(gid=>{ const g=goals.find(x=>x.id==gid)||{}; return {smart:(g.smart_text||''),m:gmap[gid].m,r:gmap[gid].r}; });
    v.innerHTML = `
      <div class="cards">
        <div class="stat"><div class="label">Objetivos Estratégicos</div><div class="value">${objs.length}</div><div class="sub">${goals.length} metas SMART</div></div>
        <div class="stat"><div class="label">Iniciativas</div><div class="value">${inis.length}</div><div class="sub">${conc} concluídas</div></div>
        <div class="stat" style="border-color:var(--green)"><div class="label">Progresso médio</div><div class="value">${avg}%</div><div class="sub">do plano de ação</div></div>
        <div class="stat" style="border-color:var(--gold)"><div class="label">Itens SWOT</div><div class="value">${swot.length}</div><div class="sub">mapeados</div></div>
      </div>
      <div class="grid-2">
        <div class="card"><h3>Desempenho semanal (acumulado)</h3><p class="desc">Realizado vs. meta por objetivo-meta</p><canvas id="ch-perf" height="200"></canvas></div>
        <div class="card"><h3>SWOT por classificação</h3><p class="desc">Distribuição do diagnóstico</p><canvas id="ch-swot" height="200"></canvas></div>
      </div>
      <div class="card"><h3>Top 5 prioridades (Matriz GUT)</h3>
        <table><thead><tr><th>Item</th><th>Classificação</th><th>GUT</th></tr></thead><tbody>
        ${topGut.map(t=>`<tr><td>${esc(t.item)}</td><td>${esc(t.classification)}</td><td class="gut-num">${t.gut}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem dados</td></tr>'}
        </tbody></table></div>`;
    mkChart('ch-perf','bar',{ labels:perf.map(p=>p.smart.slice(0,22)+'…'), datasets:[
      {label:'Meta',data:perf.map(p=>p.m),backgroundColor:'#cdd8e6'},
      {label:'Realizado',data:perf.map(p=>p.r),backgroundColor:'#2E8BC0'}]});
    const colorMap={'Força':'#2e9e6b','Fraqueza':'#d9534f','Oportunidade':'#2E8BC0','Ameaça':'#E6A817'};
    mkChart('ch-swot','doughnut',{ labels:swotByClass.map(s=>s.classification), datasets:[{data:swotByClass.map(s=>s.c),backgroundColor:swotByClass.map(s=>colorMap[s.classification]||'#999')}]});

  /* ---------- Desempenho Semanal (vários anos) ---------- */
  function weeksOfYear(year){
    const weeks=[]; let d=new Date(year,0,1);
    const dow=d.getDay(); d.setDate(d.getDate()+(dow===0?1:(dow===1?0:8-dow))); // primeira segunda-feira
    let w=1;
    while(d.getFullYear()<=year && w<=53){
      const start=new Date(d), end=new Date(d); end.setDate(end.getDate()+6);
      if(start.getFullYear()>year) break;
      weeks.push({week:w,start:new Date(start),end:new Date(end)});
      d.setDate(d.getDate()+7); w++;
    }
    return weeks;
  }
  const dm=(d)=>('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
  const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  VIEWS.desempenho = async (v) => {
    const goals = await tList('goals'); window.__goals=goals;
    if(!goals.length){ v.innerHTML='<div class="empty">Cadastre metas primeiro (em Objetivos & Metas).</div>'; return; }
    const { data:asg } = await sb.from('goal_assignees').select('goal_id').eq('profile_id', me.id);
    const assigned=new Set((asg||[]).map(a=>a.goal_id)); window.__assigned=assigned;
    const goalId = window.__pfGoal || goals[0].id; window.__pfGoal=goalId;
    const year = window.__pfYear || new Date().getFullYear(); window.__pfYear=year;
    const mode = window.__pfMode || 'semana'; window.__pfMode=mode;
    const editable = can('manager') || assigned.has(goalId); window.__pfEditable=editable;
    const yearOpts=[]; for(let y=year-2;y<=year+4;y++) yearOpts.push(y);
    const { data:rows } = await sb.from('goal_weekly').select('*').eq('goal_id',goalId).eq('year',year);
    const map={}; (rows||[]).forEach(r=>map[r.week]=r); window.__wkMap=map;
    const weeks=weeksOfYear(year);
    const totMeta=(rows||[]).reduce((a,b)=>a+(Number(b.meta)||0),0), totReal=(rows||[]).reduce((a,b)=>a+(Number(b.realizado)||0),0);
    const selGoal = goals.find(g=>g.id==goalId)||{};
    const head=`
      <div class="card"><div class="section-head"><div><h3>Desempenho Semanal de Metas</h3>
        <p class="desc">${editable?'Clique em uma semana para preencher meta, resultado, causa e ação.':'Você pode visualizar; o preenchimento é feito pelos responsáveis desta meta.'}</p></div>
        <div class="toggle-group"><button class="${mode==='semana'?'active':''}" onclick="App.pfSetMode('semana')">Semanal</button><button class="${mode==='trimestre'?'active':''}" onclick="App.pfSetMode('trimestre')">Por trimestre</button></div></div>
        <div class="field"><label>Selecione a meta</label>
          <select class="goal-select" onchange="App.pfSetGoal(this.value)">${goals.map(g=>`<option value="${g.id}" ${g.id==goalId?'selected':''}>${assigned.has(g.id)?'★ ':''}${esc(g.smart_text)}</option>`).join('')}</select></div>
        <div class="goal-full">${selGoal.smart_text?esc(selGoal.smart_text):''} ${selGoal.year?`<span class="pill pill-gray">T${selGoal.quarter||1} ${selGoal.year}</span>`:''} ${assigned.has(goalId)?'<span class="pill pill-blue">Sua meta</span>':(editable?'<span class="pill pill-gray">Edição liberada</span>':'<span class="pill pill-gray">Somente leitura</span>')}</div>
        <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:12px">
          <div class="field" style="margin-bottom:0;min-width:140px"><label>Ano</label><select onchange="App.pfSetYear(this.value)">${yearOpts.map(y=>`<option value="${y}" ${y==year?'selected':''}>${y}</option>`).join('')}</select></div>
          <div class="desc" style="margin:0 0 8px">Acumulado ${year}: meta <b>${money(totMeta)}</b> · realizado <b>${money(totReal)}</b> · atingido <b>${pct(totReal,totMeta)}%</b></div>
        </div>
      </div>`;
    if(mode==='semana'){
      const byM={};
      weeks.forEach(wk=>{ const m=wk.start.getMonth(); (byM[m]=byM[m]||[]).push(wk); });
      let html='';
      Object.keys(byM).sort((a,b)=>a-b).forEach(m=>{ const mw=byM[m];
        const mm=mw.reduce((a,wk)=>a+(Number((map[wk.week]||{}).meta)||0),0);
        const mr=mw.reduce((a,wk)=>a+(Number((map[wk.week]||{}).realizado)||0),0);
        html+=`<div class="q-group"><div class="m-head" style="display:flex;justify-content:space-between;align-items:center"><span>${MES[m]}</span><span style="font-weight:600">Meta ${money(mm)} · Resultado ${money(mr)} · ${pct(mr,mm)}%</span></div>
          <table><thead><tr><th>Semana</th><th>Período</th><th>Meta</th><th>Resultado</th><th>%</th><th>Obs.</th></tr></thead><tbody>
          ${mw.map(wk=>{ const r=map[wk.week]||{}; const p=pct(Number(r.realizado)||0,Number(r.meta)||0); const has=(r.meta!=null||r.realizado!=null);
            return `<tr onclick="App.openWeek(${wk.week})" style="cursor:pointer"><td><b>S${wk.week}</b></td><td style="font-size:12px;color:var(--muted)">${dm(wk.start)}–${dm(wk.end)}</td>
              <td>${has?money(r.meta||0):'<span style="color:var(--muted)">—</span>'}</td><td>${has?money(r.realizado||0):'<span style="color:var(--muted)">—</span>'}</td>
              <td>${has?`<b class="${p>=100?'tag-ok':'tag-no'}">${p}%</b>`:''}</td><td>${(r.causa||r.acao)?'📝':''}</td></tr>`; }).join('')}
          <tr style="background:#f7f9fc;font-weight:700"><td colspan="2">Total de ${MES[m]}</td><td>${money(mm)}</td><td>${money(mr)}</td><td>${pct(mr,mm)}%</td><td></td></tr>
          </tbody></table></div>`;
      });
      v.innerHTML = head + `<div class="card">${html||'<div class="empty">Sem semanas</div>'}</div>`;
    } else {
      const byQ={};
      weeks.forEach(wk=>{ const m=wk.start.getMonth(); const q=Math.floor(m/3)+1; (byQ[q]=byQ[q]||{}); (byQ[q][m]=byQ[q][m]||[]).push(wk); });
      let html='';
      [1,2,3,4].forEach(q=>{ if(!byQ[q]) return; const qWeeks=Object.values(byQ[q]).reduce((a,b)=>a.concat(b),[]);
        const qm=qWeeks.reduce((a,wk)=>a+(Number((map[wk.week]||{}).meta)||0),0), qr=qWeeks.reduce((a,wk)=>a+(Number((map[wk.week]||{}).realizado)||0),0);
        html+=`<div class="q-group"><div class="q-head">${q}º Trimestre — meta ${money(qm)} · realizado ${money(qr)} · ${pct(qr,qm)}%</div>`;
        Object.keys(byQ[q]).sort((a,b)=>a-b).forEach(m=>{ const mw=byQ[q][m];
          html+=`<div class="m-head">${MES[m]}</div><table><thead><tr><th>Semana</th><th>Período</th><th>Meta</th><th>Realizado</th><th>%</th></tr></thead><tbody>`;
          mw.forEach(wk=>{ const r=map[wk.week]||{}; const p=pct(Number(r.realizado)||0,Number(r.meta)||0);
            html+=`<tr onclick="App.openWeek(${wk.week})" style="cursor:pointer"><td><b>S${wk.week}</b></td><td style="font-size:12px;color:var(--muted)">${dm(wk.start)}–${dm(wk.end)}</td><td>${money(r.meta||0)}</td><td>${money(r.realizado||0)}</td><td>${p}%</td></tr>`; });
          html+='</tbody></table>';
        });
        html+='</div>';
      });
      v.innerHTML = head + `<div class="card">${html||'<div class="empty">Sem semanas</div>'}</div>`;
    }
  };

  async function exportExcel(){
    toast('Gerando Excel…'); const D=await loadAll();
    const objT=(id)=>{const o=D.objs.find(x=>x.id===id);return o?o.title:'';};
    const goalT=(id)=>{const g=D.goals.find(x=>x.id===id);return g?g.smart_text:'';};
    const wb=XLSX.utils.book_new(); const add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
    const c=D.company;
    add('Empresa',[['Campo','Valor'],['Empresa',c.name],['Missão',c.mission],['Visão',c.vision],['Vigência',`${c.plan_start} a ${c.plan_end}`],['Posicionamento',c.positioning]]);
    add('Valores',[['Valor','Descrição'],...D.values.map(v=>[v.title,v.description])]);

    add('Macroprocessos',[['Departamento','Macroprocesso','Descrição'],...D.procs.map(p=>[(D.depts.find(d=>d.id===p.department_id)||{}).name||'',p.name,p.description])]);
    add('Responsáveis',[['Departamento','Nome','Cargo'],...D.mems.map(m=>[(D.depts.find(d=>d.id===m.department_id)||{}).name||'',m.name,m.cargo])]);

    add('Curva de Valor',[['Atributo','DAEXE','Concorrência'],...D.curve.map(r=>[r.attribute,r.daexe_score,r.competitor_score])]);
    add('Objetivos e Metas',[['Objetivo','Meta SMART','Ano','Trimestre'],...D.goals.map(g=>[objT(g.objective_id),g.smart_text,g.year,g.quarter])]);
    add('Iniciativas 5W2H',[['Quê','Quem','Início','Fim','Como','Quanto','Onde','Porquê','Medida','Status','Progresso %'],...D.inis.map(i=>[i.name,i.who,i.date_start,i.date_end,i.how,i.how_much,i.where_,i.why,i.measure,i.status,i.progress])]);

  async function exportPdf(){
    toast('Gerando PDF…'); const D=await loadAll();
    const objT=(id)=>{const o=D.objs.find(x=>x.id===id);return o?o.title:'';};
    const row=(cells,h)=>'<tr>'+cells.map(x=>`<${h||'td'}>${x==null?'':x}</${h||'td'}>`).join('')+'</tr>';
    const tbl=(head,rows)=>`<table><thead>${row(head,'th')}</thead><tbody>${rows.map(r=>row(r)).join('')}</tbody></table>`;
    const c=D.company;
    const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Planejamento ${esc(c.name||'')}</title>
      <style>body{font-family:'Segoe UI',Arial,sans-serif;color:#22303f;padding:24px;font-size:12px}h1{color:#1F3A5F;border-bottom:3px solid #2E8BC0;padding-bottom:6px}h2{color:#1F3A5F;margin-top:22px;font-size:15px}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}th{background:#1F3A5F;color:#fff;text-align:left;padding:6px 8px}td{border-bottom:1px solid #e4e8ee;padding:5px 8px}.meta{color:#6b7a8d}</style></head><body>
      <h1>${esc(c.name||'Planejamento')} · Planejamento Estratégico</h1><p class="meta">${esc(c.positioning||'')} — vigência ${esc(c.plan_start||'')} a ${esc(c.plan_end||'')}</p>
      <h2>Filosofia</h2>${tbl(['Campo','Valor'],[['Missão',esc(c.mission)],['Visão',esc(c.vision)]])}
      <h2>Valores</h2>${tbl(['Valor','Descrição'],D.values.map(v=>[esc(v.title),esc(v.description)]))}
      <h2>Departamentos</h2>${tbl(['Departamento','Atuação'],D.depts.map(d=>[esc(d.name),esc(d.atuacao)]))}
      <h2>SWOT (GUT)</h2>${tbl(['Classificação','Item','GUT'],D.swot.slice().sort((a,b)=>(b.gravidade*b.urgencia*b.tendencia)-(a.gravidade*a.urgencia*a.tendencia)).map(s=>[esc(s.classification),esc(s.item),s.gravidade*s.urgencia*s.tendencia]))}
      <h2>Objetivos e Metas</h2>${tbl(['Objetivo','Meta SMART','Período'],D.goals.map(g=>[esc(objT(g.objective_id)),esc(g.smart_text),'T'+(g.quarter||'')+' '+(g.year||'')]))}
      <h2>Iniciativas (5W2H)</h2>${tbl(['Quê','Quem','Status','%'],D.inis.map(i=>[esc(i.name),esc(i.who),esc(i.status),i.progress]))}
      <script>window.onload=function(){window.print();}<\/script></body></html>`;
    const w=window.open('','_blank'); if(!w){ toast('Permita pop-ups para gerar o PDF'); return; } w.document.write(html); w.document.close();
  }

  /* ---------- init ---------- */
  async function init(){
    document.getElementById('login-form').addEventListener('submit', async (e)=>{ e.preventDefault();
      document.getElementById('login-error').textContent='';
      try{ await doLogin(val('login-email'), val('login-password')); }catch(err){ document.getElementById('login-error').textContent=err.message; }});
    document.getElementById('logout-btn').onclick=logout;
    document.getElementById('toggle-pass').addEventListener('click',()=>{ const p=document.getElementById('login-password'); p.type = p.type==='password'?'text':'password'; });
    document.getElementById('nav-toggle').addEventListener('click',()=>{ document.body.classList.toggle('nav-collapsed'); });
    document.getElementById('modal-backdrop').addEventListener('click',(e)=>{ if(e.target.id==='modal-backdrop') closeModal(); });
    const { data:{ session } } = await sb.auth.getSession();
    if(session) await loadMeAndBoot(); else showLogin();
  }

  const pub={ go, closeModal, exportFile, logout };
  ['forgotPassword','editValue','saveValue','delValue','editCompany','saveCompany','editDept','saveDept','delDept',
   'editProc','saveProc','delProc','editMember','saveMember','delMember','editSwot','saveSwot','delSwot',
   'editCurve','saveCurve','delCurve','editPersp','savePersp','editObj','saveObj','delObj','editGoal','saveGoal','delGoal',
   'editIni','saveIni','delIni','manageMs','addMs','toggleMs','delMs','manageOwners','saveOwners','pfSetGoal','pfSetYear','pfSetMode','openWeek','saveWeekPopup',
   'editEval','saveEval','editUser','saveUser','inviteUser','doInvite','newNotif','sendNotif','saveProfile','saveBranding']
   .forEach(n=>{ pub[n]=(...a)=>eval('App_'+n)(...a); });
  return Object.assign(pub,{ init });
})();
window.addEventListener('DOMContentLoaded', App.init);
</script>
